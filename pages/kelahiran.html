<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Data Kelahiran Warga - RT-Ku</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts: Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        .no-scrollbar::-webkit-scrollbar {
            display: none !important;
            width: 0px !important;
            height: 0px !important;
        }
        .no-scrollbar {
            -ms-overflow-style: none !important;
            scrollbar-width: none !important;
        }
    </style>
</head>
<body class="bg-slate-900 font-['Inter'] flex justify-center items-center h-screen overflow-hidden m-0">

    <!-- Toast Notification -->
    <div id="toastNotification" class="fixed top-6 left-1/2 transform -translate-x-1/2 bg-slate-900/95 border border-slate-700 text-white px-4 py-2.5 rounded-none shadow-2xl text-xs font-medium flex items-center space-x-2 z-50 transition-all duration-300 opacity-0 pointer-events-none translate-y-[-20px]">
        <div class="w-5 h-5 rounded-none bg-emerald-500 text-white flex items-center justify-center text-[10px] shadow">
            <i class="fa-solid fa-check"></i>
        </div>
        <span id="toastText">Berhasil!</span>
    </div>

    <!-- Container HP Frame -->
    <div class="w-full h-screen sm:max-w-[400px] sm:h-[92vh] sm:max-h-[820px] bg-slate-50 sm:rounded-[35px] shadow-2xl flex flex-col justify-between relative overflow-hidden sm:border-[6px] sm:border-slate-800">
        
        <!-- Header -->
        <div class="bg-gradient-to-b from-emerald-600 to-emerald-700 text-white p-5 rounded-b-[28px] flex items-center justify-between shrink-0">
            <a href="data-warga.html" class="w-9 h-9 rounded-none bg-white/10 flex items-center justify-center text-white backdrop-blur-sm transition-all hover:bg-white/20">
                <i class="fa-solid fa-arrow-left text-xs"></i>
            </a>
            <h1 class="font-bold text-sm tracking-wide">Data Kelahiran Warga</h1>
            <div class="w-9"></div>
        </div>

        <!-- Content (Scrollable) -->
        <div class="p-4 flex-1 overflow-y-auto no-scrollbar pb-6 space-y-4 text-xs">
            
            <!-- Filter, Pencarian & Tombol Tambah -->
            <div class="bg-white p-3.5 rounded-none shadow-sm border border-slate-200/70 space-y-3">
                <div class="flex items-center justify-between">
                    <div>
                        <h2 class="font-bold text-slate-800 text-xs">Daftar Kelahiran Bayi</h2>
                        <p id="kelahiranCountBadge" class="text-[10px] text-slate-400 mt-0.5">Memuat data...</p>
                    </div>
                    <button type="button" autocomplete="off" onclick="openKelahiranModal()" class="bg-emerald-600 hover:bg-emerald-700 text-white px-3 py-2 rounded-none text-xs font-bold transition-all shadow-md flex items-center space-x-1.5 cursor-pointer">
                        <i class="fa-solid fa-plus text-[10px]"></i>
                        <span>Tambah Data</span>
                    </button>
                </div>

                <!-- Kolom Pencarian di Halaman Utama -->
                <div class="pt-2 border-t border-slate-100">
                    <label class="block text-[10px] font-semibold text-slate-600 mb-1"><i class="fa-solid fa-magnifying-glass mr-1 text-emerald-600"></i> Cari Bayi (Nama / No. KK / Ayah / Ibu):</label>
                    <div class="relative">
                        <span class="absolute inset-y-0 left-0 pl-3 flex items-center text-slate-400 text-xs">
                            <i class="fa-solid fa-search"></i>
                        </span>
                        <input type="text" id="inputPencarian" autocomplete="off" placeholder="Ketik nama bayi, No. KK, ayah, atau ibu..." class="w-full pl-9 pr-8 py-1.5 rounded-none border border-slate-200 text-xs bg-slate-50 focus:outline-none focus:border-emerald-600 font-medium text-slate-700">
                        <button type="button" autocomplete="off" id="btnClearSearch" onclick="clearSearch()" class="absolute inset-y-0 right-0 pr-2.5 flex items-center text-slate-400 hover:text-slate-600 hidden cursor-pointer">
                            <i class="fa-solid fa-xmark text-xs"></i>
                        </button>
                    </div>
                </div>

                <!-- Filter Berdasarkan Bulan & Tahun -->
                <div class="pt-2 border-t border-slate-100 space-y-2">
                    <label class="block text-[10px] font-semibold text-slate-600"><i class="fa-solid fa-filter mr-1 text-emerald-600"></i> Filter Berdasarkan Bulan & Tahun:</label>
                    <div class="grid grid-cols-2 gap-2">
                        <div>
                            <select id="filterBulan" autocomplete="off" class="appearance-none w-full px-2.5 py-1.5 rounded-none border border-slate-200 text-xs bg-slate-50 font-medium text-slate-700 focus:outline-none focus:border-emerald-600 cursor-pointer">
                                <option value="">Semua Bulan</option>
                                <option value="01">Januari</option>
                                <option value="02">Februari</option>
                                <option value="03">Maret</option>
                                <option value="04">April</option>
                                <option value="05">Mei</option>
                                <option value="06">Juni</option>
                                <option value="07">Juli</option>
                                <option value="08">Agustus</option>
                                <option value="09">September</option>
                                <option value="10">Oktober</option>
                                <option value="11">November</option>
                                <option value="12">Desember</option>
                            </select>
                        </div>
                        <div class="flex space-x-1">
                            <select id="filterTahun" autocomplete="off" class="appearance-none flex-1 px-2.5 py-1.5 rounded-none border border-slate-200 text-xs bg-slate-50 font-medium text-slate-700 focus:outline-none focus:border-emerald-600 cursor-pointer">
                                <option value="">Semua Tahun</option>
                            </select>
                            <button type="button" autocomplete="off" onclick="resetFilterBulanTahun()" class="px-2.5 py-1.5 bg-slate-100 hover:bg-slate-200 text-slate-600 rounded-none text-[11px] font-semibold transition-all cursor-pointer" title="Reset Filter">
                                <i class="fa-solid fa-rotate-right"></i>
                            </button>
                        </div>
                    </div>
                </div>
            </div>

            <!-- List Kelahiran Container -->
            <div class="space-y-2.5" id="kelahiranListContainer">
                <div class="text-center py-8 text-slate-400 text-xs bg-white rounded-none border border-slate-200/70 p-4">
                    <i class="fa-solid fa-spinner fa-spin text-emerald-600 text-base mb-2"></i>
                    <p>Memuat data dari database...</p>
                </div>
            </div>

        </div>

        <!-- MODAL TAMBAH / EDIT DATA KELAHIRAN -->
        <div id="kelahiranModal" class="absolute inset-0 bg-black/50 backdrop-blur-[2px] z-50 flex items-end justify-center hidden transition-all duration-300">
            <div class="w-full bg-white rounded-t-none p-5 shadow-2xl transform translate-y-full transition-transform duration-300 max-h-[92vh] flex flex-col overflow-hidden" id="kelahiranModalContent">
                
                <!-- Modal Header -->
                <div class="flex justify-between items-center mb-3 pb-2 border-b border-slate-100 shrink-0">
                    <div class="flex items-center space-x-2">
                        <div class="w-7 h-7 rounded-none bg-emerald-50 text-emerald-600 flex items-center justify-center text-xs">
                            <i class="fa-solid fa-baby" id="modalIcon"></i>
                        </div>
                        <h3 id="modalTitle" class="font-bold text-slate-800 text-xs">Form Kelahiran Bayi</h3>
                    </div>
                    <button type="button" autocomplete="off" onclick="closeKelahiranModal()" class="w-6 h-6 rounded-none bg-slate-100 text-slate-500 hover:bg-slate-200 flex items-center justify-center text-[10px] transition-all cursor-pointer">
                        <i class="fa-solid fa-xmark"></i>
                    </button>
                </div>

                <form id="kelahiranForm" autocomplete="off" class="flex flex-col flex-1 overflow-hidden text-xs">
                    <input type="hidden" id="kelahiranId" autocomplete="off">
                    <input type="hidden" id="wargaDocId" autocomplete="off">
                    <input type="hidden" id="agamaBayi" autocomplete="off" value="-">
                    
                    <!-- FORM INPUT KELAHIRAN (SCROLLABLE AREA TANPA SCROLLBAR) -->
                    <div class="flex-1 overflow-y-auto no-scrollbar space-y-3 py-2 pr-1">
                        
                        <div class="bg-emerald-50/75 p-3 rounded-none border border-emerald-100 space-y-2">
                            <span class="font-bold text-emerald-900 block text-[11px]"><i class="fa-solid fa-baby mr-1"></i> Data Bayi yang Lahir</span>
                            
                            <div>
                                <label class="block text-[9px] font-semibold text-slate-700 mb-0.5">Nama Lengkap Bayi</label>
                                <input type="text" id="namaBayi" autocomplete="off" required placeholder="Nama lengkap bayi" class="w-full px-2.5 py-1.5 rounded-none border border-slate-200 text-xs bg-white focus:outline-none focus:border-emerald-600">
                            </div>

                            <div>
                                <label class="block text-[9px] font-semibold text-slate-700 mb-0.5">NIK Bayi (Sesuai KK Terbaru)</label>
                                <input type="text" id="nikBayi" autocomplete="off" placeholder="Nomor Induk Kependudukan Bayi" class="w-full px-2.5 py-1.5 rounded-none border border-slate-200 text-xs bg-white focus:outline-none focus:border-emerald-600 font-semibold text-slate-800">
                            </div>

                            <div class="grid grid-cols-2 gap-2">
                                <div>
                                    <label class="block text-[9px] font-semibold text-slate-700 mb-0.5">Jenis Kelamin</label>
                                    <select id="jenisKelaminBayi" autocomplete="off" required class="appearance-none w-full px-2.5 py-1.5 rounded-none border border-slate-200 text-xs bg-white font-medium text-slate-800 focus:outline-none focus:border-emerald-600 cursor-pointer">
                                        <option value="" disabled selected>-</option>
                                        <option value="LAKI-LAKI">LAKI-LAKI</option>
                                        <option value="PEREMPUAN">PEREMPUAN</option>
                                    </select>
                                </div>
                                <div>
                                    <label class="block text-[9px] font-semibold text-slate-700 mb-0.5">Tanggal Lahir</label>
                                    <input type="date" id="tanggalLahirBayi" autocomplete="off" required class="w-full px-2.5 py-1.5 rounded-none border border-slate-200 text-xs bg-white focus:outline-none focus:border-emerald-600 font-semibold text-slate-800">
                                </div>
                            </div>

                            <div class="grid grid-cols-2 gap-2">
                                <div>
                                    <label class="block text-[9px] font-semibold text-slate-700 mb-0.5">Tempat Lahir</label>
                                    <select id="tempatLahirBayi" autocomplete="off" required class="appearance-none w-full px-2.5 py-1.5 rounded-none border border-slate-200 text-xs bg-white font-medium text-slate-800 focus:outline-none focus:border-emerald-600 cursor-pointer">
                                        <option value="" disabled selected>-</option>
                                    </select>
                                </div>
                                <div>
                                    <label class="block text-[9px] font-semibold text-slate-700 mb-0.5">Berat / Panjang Bayi</label>
                                    <input type="text" id="beratPanjang" autocomplete="off" placeholder="Contoh: 3.1 kg / 49 cm" class="w-full px-2.5 py-1.5 rounded-none border border-slate-200 text-xs bg-white focus:outline-none focus:border-emerald-600">
                                </div>
                            </div>
                        </div>

                        <div class="bg-slate-50 p-3 rounded-none border border-slate-200/80 space-y-2">
                            <span class="font-bold text-slate-800 block text-[11px]"><i class="fa-solid fa-user-group mr-1 text-emerald-600"></i> Data Orang Tua & Keluarga</span>
                            
                            <!-- FASILITAS PENCARIAN / AUTOCOMPLETE KELUARGA DI FORM INPUT -->
                            <div class="relative">
                                <label class="block text-[9px] font-semibold text-slate-700 mb-0.5">Cari & Pilih No. Kartu Keluarga (KK) / Kepala Keluarga</label>
                                <div class="relative">
                                    <input type="text" id="searchKkInput" autocomplete="off" placeholder="Ketik No. KK atau Nama Kepala Keluarga..." class="w-full pl-3 pr-8 py-1.5 rounded-none border border-slate-200 text-xs bg-white focus:outline-none focus:border-emerald-600">
                                    <span class="absolute inset-y-0 right-0 pr-2.5 flex items-center text-slate-400 pointer-events-none">
                                        <i class="fa-solid fa-magnifying-glass text-xs"></i>
                                    </span>
                                </div>
                                <!-- Dropdown Hasil Pencarian KK -->
                                <div id="kkDropdownList" class="absolute left-0 right-0 mt-1 bg-white border border-slate-200 rounded-none shadow-lg max-h-40 overflow-y-auto z-50 hidden"></div>
                            </div>

                            <div>
                                <label class="block text-[9px] font-semibold text-slate-700 mb-0.5">No. Kartu Keluarga (KK)</label>
                                <input type="text" id="noKk" autocomplete="off" required placeholder="Nomor Kartu Keluarga" class="w-full px-2.5 py-1.5 rounded-none border border-slate-200 text-xs bg-white focus:outline-none focus:border-emerald-600 font-semibold text-slate-800">
                            </div>

                            <div class="grid grid-cols-2 gap-2">
                                <div>
                                    <label class="block text-[9px] font-semibold text-slate-700 mb-0.5">Nama Ayah</label>
                                    <input type="text" id="namaAyah" autocomplete="off" required placeholder="Nama Ayah Kandung" class="w-full px-2.5 py-1.5 rounded-none border border-slate-200 text-xs bg-white focus:outline-none focus:border-emerald-600">
                                </div>
                                <div>
                                    <label class="block text-[9px] font-semibold text-slate-700 mb-0.5">Nama Ibu</label>
                                    <input type="text" id="namaIbu" autocomplete="off" required placeholder="Nama Ibu Kandung" class="w-full px-2.5 py-1.5 rounded-none border border-slate-200 text-xs bg-white focus:outline-none focus:border-emerald-600">
                                </div>
                            </div>

                            <div>
                                <label class="block text-[9px] font-semibold text-slate-700 mb-0.5">Alamat / RT / RW</label>
                                <input type="text" id="alamatKelahiran" autocomplete="off" placeholder="Alamat domisili" class="w-full px-2.5 py-1.5 rounded-none border border-slate-200 text-xs bg-white focus:outline-none focus:border-emerald-600">
                            </div>
                        </div>

                    </div>

                    <!-- Tombol Aksi: Simpan & Batal (Sticky Footer) -->
                    <div class="grid grid-cols-2 gap-2 pt-3 border-t border-slate-100 bg-white shrink-0 mt-auto">
                        <button type="button" autocomplete="off" onclick="closeKelahiranModal()" class="w-full bg-slate-200 hover:bg-slate-300 text-slate-700 font-semibold py-2.5 rounded-none transition-all text-xs cursor-pointer">
                            Batal
                        </button>
                        <button type="submit" autocomplete="off" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-semibold py-2.5 rounded-none shadow-md transition-all text-xs cursor-pointer">
                            Simpan Data
                        </button>
                    </div>
                </form>

            </div>
        </div>

    </div>

    <!-- Skrip Utama Firebase & Firestore -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, addDoc, updateDoc, deleteDoc, doc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        function getLocalDateString() {
            const d = new Date();
            const year = d.getFullYear();
            const month = String(d.getMonth() + 1).padStart(2, '0');
            const day = String(d.getDate()).padStart(2, '0');
            return `${year}-${month}-${day}`;
        }

        window.showToast = function(message) {
            const toast = document.getElementById('toastNotification');
            const toastText = document.getElementById('toastText');
            toastText.innerText = message;
            toast.classList.remove('opacity-0', 'pointer-events-none', 'translate-y-[-20px]');
            toast.classList.add('opacity-100', 'translate-y-0');
            setTimeout(() => {
                toast.classList.remove('opacity-100', 'translate-y-0');
                toast.classList.add('opacity-0', 'pointer-events-none', 'translate-y-[-20px]');
            }, 1800);
        }

        const firebaseConfig = {
            apiKey: "AIzaSyBx2AF0YRpOEq--q__dn39NwiNCKXvKutM",
            authDomain: "erte-979ca.firebaseapp.com",
            projectId: "erte-979ca",
            storageBucket: "erte-979ca.firebasestorage.app",
            messagingSenderId: "329513636032",
            appId: "1:329513636032:web:25a10b627b91db2bbb5d25"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        const kelahiranListContainer = document.getElementById('kelahiranListContainer');
        const kelahiranCountBadge = document.getElementById('kelahiranCountBadge');
        const filterBulan = document.getElementById('filterBulan');
        const filterTahun = document.getElementById('filterTahun');
        const inputPencarian = document.getElementById('inputPencarian');
        const btnClearSearch = document.getElementById('btnClearSearch');

        const searchKkInput = document.getElementById('searchKkInput');
        const kkDropdownList = document.getElementById('kkDropdownList');
        const inputNoKk = document.getElementById('noKk');
        const inputNamaAyah = document.getElementById('namaAyah');
        const inputNamaIbu = document.getElementById('namaIbu');
        const inputAlamat = document.getElementById('alamatKelahiran');
        const inputNikBayi = document.getElementById('nikBayi');
        const inputAgamaBayi = document.getElementById('agamaBayi');
        const selectTempatLahir = document.getElementById('tempatLahirBayi');

        let allRiwayatKelahiranData = [];
        let allWargaMasterData = [];
        let defaultWilayah = "RT 01 / RW 00";
        let globalKelurahan = "";
        let globalKecamatan = "";
        let globalKabupaten = "";
        let currentSelectedIndex = -1;

        // Ambil Profil Wilayah
        onSnapshot(doc(db, "settings", "profilWilayah"), (docSnap) => {
            if (docSnap.exists()) {
                const data = docSnap.data();
                defaultWilayah = `${data.rtNumber || "RT 01"} / ${data.rwNumber || "RW 00"}`;
                globalKelurahan = data.kelurahan || "";
                globalKecamatan = data.kecamatan || "";
                globalKabupaten = data.kabupaten || "";
            }
        });

        // Ambil Data Master Setting untuk Tempat Lahir (settings/masterWarga -> field namaKota)
        onSnapshot(doc(db, "settings", "masterWarga"), (docSnap) => {
            if (docSnap.exists()) {
                const data = docSnap.data();
                const namaKotaStr = data.namaKota || "";
                const kotaArr = namaKotaStr.split(',').map(s => s.trim()).filter(Boolean);
                
                let optionsHtml = `<option value="" disabled selected>-</option>`;
                kotaArr.forEach(kota => {
                    optionsHtml += `<option value="${kota}">${kota}</option>`;
                });
                selectTempatLahir.innerHTML = optionsHtml;
            }
        });

        // Ambil Data Master Warga untuk Pencarian KK & Autofill
        onSnapshot(collection(db, "dataWarga"), (snapshot) => {
            allWargaMasterData = [];
            snapshot.forEach((docSnap) => {
                allWargaMasterData.push({ id: docSnap.id, ...docSnap.data() });
            });
        });

        // Sumber data langsung dari riwayatWarga dengan jenisPeristiwa = "KELAHIRAN"
        onSnapshot(collection(db, "riwayatWarga"), (snapshot) => {
            allRiwayatKelahiranData = [];
            snapshot.forEach((docSnap) => {
                const data = docSnap.id ? { id: docSnap.id, ...docSnap.data() } : docSnap.data();
                if (data.jenisPeristiwa === "KELAHIRAN") {
                    allRiwayatKelahiranData.push(data);
                }
            });
            updateFilterTahunOptions();
            renderKelahiranList();
        });

        // Fungsi memperbarui dropdown Tahun agar hanya terisi tahun yang ada di histori kelahiran
        function updateFilterTahunOptions() {
            const currentSelected = filterTahun.value;
            const yearsSet = new Set();

            allRiwayatKelahiranData.forEach(item => {
                const tgl = item.tanggalLahir || item.tanggalLahirBayi || "";
                if (tgl) {
                    const parts = tgl.split('-');
                    if (parts.length > 0 && parts[0].length === 4) {
                        yearsSet.add(parts[0]);
                    }
                }
            });

            const sortedYears = Array.from(yearsSet).sort((a, b) => b.localeCompare(a));

            let optionsHtml = '<option value="">Semua Tahun</option>';
            sortedYears.forEach(y => {
                optionsHtml += `<option value="${y}">${y}</option>`;
            });

            filterTahun.innerHTML = optionsHtml;
            filterTahun.value = currentSelected; // Pertahankan pilihan jika masih ada
        }

        // Logika Pencarian KK di Form Input Modal
        searchKkInput.addEventListener('input', () => {
            currentSelectedIndex = -1;
            const keyword = searchKkInput.value.toLowerCase().trim();
            if (!keyword) {
                kkDropdownList.classList.add('hidden');
                return;
            }

            const mapKk = {};
            allWargaMasterData.forEach(w => {
                const kk = (w.noKk || "").trim();
                const kepalaKeluarga = (w.namaKepalaKeluarga || w.namaLengkap || w.nama || "").trim();
                const statusHub = (w.statusHubungan || "").toUpperCase();
                
                if (kk && !mapKk[kk]) {
                    mapKk[kk] = {
                        noKk: kk,
                        kepalaKeluarga: "",
                        rtRw: (w.rtRw || defaultWilayah).trim()
                    };
                }
                if (kk && (statusHub.includes("KEPALA") || w.namaKepalaKeluarga)) {
                    mapKk[kk].kepalaKeluarga = w.namaKepalaKeluarga || kepalaKeluarga;
                }
            });

            const matchedKk = Object.values(mapKk).filter(item => 
                item.noKk.toLowerCase().includes(keyword) || item.kepalaKeluarga.toLowerCase().includes(keyword)
            );

            if (matchedKk.length === 0) {
                kkDropdownList.innerHTML = `<div class="p-2 text-slate-400 text-[10px] text-center">Data KK tidak ditemukan</div>`;
                kkDropdownList.classList.remove('hidden');
                return;
            }

            let html = "";
            matchedKk.forEach((item, idx) => {
                const safeKk = item.noKk;
                const safeNama = item.kepalaKeluarga || "-";
                const safeRt = item.rtRw || defaultWilayah;
                html += `
                    <div class="kk-dropdown-item p-2 hover:bg-emerald-50 cursor-pointer border-b border-slate-100 last:border-none" data-index="${idx}" onclick="selectKk('${safeKk}', '${safeNama.replace(/'/g, "\\'")}', '${safeRt.replace(/'/g, "\\'")}')">
                        <p class="font-bold text-slate-800 text-[11px]">${safeKk}</p>
                        <p class="text-[9px] text-slate-500">Kepala Keluarga: ${safeNama}</p>
                    </div>
                `;
            });
            kkDropdownList.innerHTML = html;
            kkDropdownList.classList.remove('hidden');
        });

        // Navigasi Keyboard pada input pencarian KK
        searchKkInput.addEventListener('keydown', (e) => {
            const items = kkDropdownList.querySelectorAll('.kk-dropdown-item');
            if (items.length === 0 || kkDropdownList.classList.contains('hidden')) return;

            if (e.key === 'ArrowDown') {
                e.preventDefault();
                currentSelectedIndex++;
                if (currentSelectedIndex >= items.length) currentSelectedIndex = 0;
                updateDropdownHighlight(items);
            } else if (e.key === 'ArrowUp') {
                e.preventDefault();
                currentSelectedIndex--;
                if (currentSelectedIndex < 0) currentSelectedIndex = items.length - 1;
                updateDropdownHighlight(items);
            } else if (e.key === 'Enter') {
                e.preventDefault();
                if (currentSelectedIndex >= 0 && items[currentSelectedIndex]) {
                    items[currentSelectedIndex].click();
                }
            }
        });

        function updateDropdownHighlight(items) {
            items.forEach((item, idx) => {
                if (idx === currentSelectedIndex) {
                    item.classList.add('bg-emerald-100');
                    item.scrollIntoView({ block: 'nearest' });
                } else {
                    item.classList.remove('bg-emerald-100');
                }
            });
        }

        window.selectKk = function(noKk, kepalaKeluarga, rtRw) {
            inputNoKk.value = noKk;
            searchKkInput.value = `${noKk} - ${kepalaKeluarga}`;
            kkDropdownList.classList.add('hidden');
            currentSelectedIndex = -1;

            if (kepalaKeluarga && kepalaKeluarga !== "-") {
                inputNamaAyah.value = kepalaKeluarga;
            } else {
                const kkMember = allWargaMasterData.find(w => (w.noKk || "").trim() === noKk && (w.statusHubungan || "").toUpperCase().includes("KEPALA"));
                if (kkMember) {
                    inputNamaAyah.value = kkMember.namaKepalaKeluarga || kkMember.namaLengkap || kkMember.nama || "";
                }
            }

            const istriData = allWargaMasterData.find(w => {
                const wKk = (w.noKk || "").trim();
                const wStatus = (w.statusHubungan || "").toUpperCase();
                return wKk === noKk && (wStatus.includes("ISTRI") || wStatus.includes("IBU"));
            });

            if (istriData) {
                inputNamaIbu.value = istriData.namaLengkap || istriData.nama || istriData.namaKepalaKeluarga || "";
            } else {
                inputNamaIbu.value = "";
            }

            // Agama menginduk ke Kepala Keluarga
            const kepalaKeluargaObj = allWargaMasterData.find(w => {
                const wKk = (w.noKk || "").trim();
                const wStatus = (w.statusHubungan || "").toUpperCase();
                return wKk === noKk && (wStatus.includes("KEPALA") || w.namaKepalaKeluarga);
            });

            if (kepalaKeluargaObj && kepalaKeluargaObj.agama) {
                inputAgamaBayi.value = kepalaKeluargaObj.agama;
            } else {
                const anyMember = allWargaMasterData.find(w => (w.noKk || "").trim() === noKk && w.agama && w.agama !== "-");
                inputAgamaBayi.value = anyMember ? anyMember.agama : "-";
            }

            inputAlamat.value = rtRw || defaultWilayah;

            showToast('Data KK, Ayah, Ibu, Alamat, & Agama otomatis terisi!');
        };

        window.addEventListener('click', (e) => {
            if (!searchKkInput.contains(e.target) && !kkDropdownList.contains(e.target)) {
                kkDropdownList.classList.add('hidden');
            }
        });

        window.renderKelahiranList = function() {
            const keyword = (inputPencarian.value || "").toLowerCase().trim();
            const selectedBulan = filterBulan.value;
            const selectedTahun = filterTahun.value;
            let filteredData = allRiwayatKelahiranData;

            if (keyword) {
                filteredData = filteredData.filter(item => {
                    const namaBayi = (item.namaLengkap || item.namaBayi || "").toLowerCase();
                    const noKk = (item.noKk || "").toLowerCase();
                    const nikBayi = (item.nik || "").toLowerCase();
                    const ayah = (item.namaAyah || "").toLowerCase();
                    const ibu = (item.namaIbu || "").toLowerCase();
                    return namaBayi.includes(keyword) || noKk.includes(keyword) || nikBayi.includes(keyword) || ayah.includes(keyword) || ibu.includes(keyword);
                });
                btnClearSearch.classList.remove('hidden');
            } else {
                btnClearSearch.classList.add('hidden');
            }

            if (selectedBulan || selectedTahun) {
                filteredData = filteredData.filter(item => {
                    const tgl = item.tanggalLahir || item.tanggalLahirBayi || "";
                    if (!tgl) return false;
                    const parts = tgl.split('-'); // format YYYY-MM-DD
                    if (parts.length < 3) return false;
                    const tahunItem = parts[0];
                    const bulanItem = parts[1];

                    let matchBulan = selectedBulan ? (bulanItem === selectedBulan) : true;
                    let matchTahun = selectedTahun ? (tahunItem === selectedTahun) : true;

                    return matchBulan && matchTahun;
                });
            }

            filteredData.sort((a, b) => {
                const tglA = a.tanggalLahir || a.tanggalLahirBayi || "";
                const tglB = b.tanggalLahir || b.tanggalLahirBayi || "";
                return tglB.localeCompare(tglA);
            });

            let html = "";
            let count = filteredData.length;
            kelahiranCountBadge.innerText = `${count} Bayi Terdaftar`;

            if (filteredData.length === 0) {
                kelahiranListContainer.innerHTML = `
                    <div class="text-center py-8 text-slate-400 text-xs bg-white rounded-none border border-slate-200/70 p-4">
                        <i class="fa-regular fa-folder-open text-2xl mb-1 text-slate-300"></i>
                        <p>Data kelahiran tidak ditemukan.</p>
                    </div>
                `;
                return;
            }

            filteredData.forEach((data, index) => {
                const id = data.id;
                const namaBayi = data.namaLengkap || data.namaBayi || "Tanpa Nama";
                const nikBayi = data.nik || "-";
                const jk = data.jenisKelamin || data.jenisKelaminBayi || "-";
                const tglLahir = data.tanggalLahir || data.tanggalLahirBayi || "-";
                const tempatLahir = data.tempatLahir || data.tempatLahirBayi || "-";
                const berat = data.beratPanjang || "-";
                const noKk = data.noKk || "-";
                const ayah = data.namaAyah || "-";
                const ibu = data.namaIbu || "-";
                const badgeColor = jk === "LAKI-LAKI" ? "bg-blue-100 text-blue-800" : (jk === "PEREMPUAN" ? "bg-pink-100 text-pink-800" : "bg-slate-100 text-slate-700");
                const jkIcon = jk === "LAKI-LAKI" ? "fa-mars text-blue-600" : (jk === "PEREMPUAN" ? "fa-venus text-pink-600" : "fa-question text-slate-600");

                html += `
                    <div class="bg-white p-3.5 rounded-none border border-slate-200/70 shadow-sm flex items-center justify-between">
                        <div class="flex items-center space-x-3 overflow-hidden">
                            <div class="w-10 h-10 rounded-none bg-emerald-50 text-emerald-600 flex items-center justify-center font-bold text-xs shrink-0 shadow-sm">
                                #${index + 1}
                            </div>
                            <div class="overflow-hidden">
                                <h4 class="font-bold text-slate-800 text-[11px] truncate">${namaBayi} <span class="text-[9px] px-1.5 py-0.5 rounded-none font-bold ${badgeColor}"><i class="fa-solid ${jkIcon} mr-0.5"></i> ${jk}</span></h4>
                                <p class="text-[10px] text-slate-500 truncate">Lahir: <span class="font-semibold text-emerald-700">${tglLahir}</span> (${tempatLahir})</p>
                                <p class="text-[10px] text-slate-500 truncate">NIK: <span class="font-semibold text-slate-700">${nikBayi}</span></p>
                                <p class="text-[9px] text-slate-400 truncate">Orang Tua: Ayah (${ayah}) • Ibu (${ibu})</p>
                                <div class="flex items-center space-x-2 mt-1">
                                    <span class="text-[9px] bg-slate-100 text-slate-700 px-2 py-0.5 rounded-none font-bold">KK: ${noKk}</span>
                                    <span class="text-[9px] text-slate-400 truncate">${berat}</span>
                                </div>
                            </div>
                        </div>
                        <div class="flex items-center space-x-1 shrink-0">
                            <button type="button" autocomplete="off" onclick="editKelahiran('${id}', ${escapeAttr(JSON.stringify(data))})" class="w-7 h-7 rounded-none bg-amber-50 text-amber-600 hover:bg-amber-600 hover:text-white flex items-center justify-center text-xs transition-all cursor-pointer" title="Edit">
                                <i class="fa-solid fa-pen"></i>
                            </button>
                            <!-- Tombol Hapus: Menghapus dari riwayatWarga & dataWarga -->
                            <button type="button" autocomplete="off" onclick="deleteKelahiran('${id}', '${data.wargaId || ''}')" class="w-7 h-7 rounded-none bg-red-50 text-red-600 hover:bg-red-600 hover:text-white flex items-center justify-center text-xs transition-all cursor-pointer" title="Hapus">
                                <i class="fa-solid fa-trash-can"></i>
                            </button>
                        </div>
                    </div>
                `;
            });

            kelahiranListContainer.innerHTML = html;
        };

        inputPencarian.addEventListener('input', () => {
            renderKelahiranList();
        });

        window.clearSearch = function() {
            inputPencarian.value = "";
            renderKelahiranList();
        };

        filterBulan.addEventListener('change', () => {
            renderKelahiranList();
        });

        filterTahun.addEventListener('change', () => {
            renderKelahiranList();
        });

        window.resetFilterBulanTahun = function() {
            filterBulan.value = "";
            filterTahun.value = "";
            renderKelahiranList();
            showToast('Filter bulan & tahun direset');
        };

        window.escapeAttr = function(str) {
            return str.replace(/'/g, "&apos;").replace(/"/g, "&quot;");
        };

        window.openKelahiranModal = function() {
            const today = getLocalDateString();
            document.getElementById('kelahiranForm').reset();
            document.getElementById('kelahiranId').value = "";
            document.getElementById('wargaDocId').value = "";
            document.getElementById('modalTitle').innerText = "Form Kelahiran Bayi";
            document.getElementById('modalIcon').className = "fa-solid fa-baby";
            document.getElementById('tanggalLahirBayi').value = today;
            document.getElementById('jenisKelaminBayi').value = ""; 
            document.getElementById('nikBayi').value = "";
            document.getElementById('agamaBayi').value = "-";
            selectTempatLahir.value = "";
            searchKkInput.value = "";
            kkDropdownList.classList.add('hidden');
            currentSelectedIndex = -1;

            const modal = document.getElementById('kelahiranModal');
            const content = document.getElementById('kelahiranModalContent');
            modal.classList.remove('hidden');
            setTimeout(() => content.classList.remove('translate-y-full'), 10);
        };

        window.closeKelahiranModal = function() {
            const modal = document.getElementById('kelahiranModal');
            const content = document.getElementById('kelahiranModalContent');
            content.classList.add('translate-y-full');
            setTimeout(() => modal.classList.add('hidden'), 300);
        };

        window.editKelahiran = function(id, data) {
            document.getElementById('kelahiranId').value = id;
            document.getElementById('wargaDocId').value = data.wargaId || "";
            document.getElementById('namaBayi').value = data.namaLengkap || data.namaBayi || "";
            document.getElementById('nikBayi').value = data.nik || "";
            document.getElementById('jenisKelaminBayi').value = data.jenisKelamin || data.jenisKelaminBayi || "";
            document.getElementById('tanggalLahirBayi').value = data.tanggalLahir || data.tanggalLahirBayi || getLocalDateString();
            selectTempatLahir.value = data.tempatLahir || data.tempatLahirBayi || "";
            document.getElementById('beratPanjang').value = data.beratPanjang || "";
            document.getElementById('noKk').value = data.noKk || "";
            document.getElementById('namaAyah').value = data.namaAyah || "";
            document.getElementById('namaIbu').value = data.namaIbu || "";
            document.getElementById('alamatKelahiran').value = data.rtRw || data.alamatKelahiran || defaultWilayah;
            document.getElementById('agamaBayi').value = data.agama || "-";
            searchKkInput.value = data.noKk || "";
            kkDropdownList.classList.add('hidden');
            currentSelectedIndex = -1;

            document.getElementById('modalTitle').innerText = "Edit Data Kelahiran";
            document.getElementById('modalIcon').className = "fa-solid fa-user-pen";

            const modal = document.getElementById('kelahiranModal');
            const content = document.getElementById('kelahiranModalContent');
            modal.classList.remove('hidden');
            setTimeout(() => content.classList.remove('translate-y-full'), 10);
        };

        const kelahiranForm = document.getElementById('kelahiranForm');
        kelahiranForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const riwayatId = document.getElementById('kelahiranId').value;
            const wargaDocId = document.getElementById('wargaDocId').value;

            const namaBayiVal = document.getElementById('namaBayi').value.trim();
            const nikBayiVal = document.getElementById('nikBayi').value.trim();
            const jenisKelaminVal = document.getElementById('jenisKelaminBayi').value;
            const tanggalLahirVal = document.getElementById('tanggalLahirBayi').value;
            const tempatLahirVal = selectTempatLahir.value;
            const beratPanjangVal = document.getElementById('beratPanjang').value.trim();
            const noKkVal = document.getElementById('noKk').value.trim();
            const namaAyahVal = document.getElementById('namaAyah').value.trim();
            const namaIbuVal = document.getElementById('namaIbu').value.trim();
            const alamatVal = document.getElementById('alamatKelahiran').value.trim() || defaultWilayah;
            const agamaVal = document.getElementById('agamaBayi').value.trim() || "-";

            if (!jenisKelaminVal) {
                alert("Silakan pilih Jenis Kelamin terlebih dahulu!");
                return;
            }

            if (!tempatLahirVal) {
                alert("Silakan pilih Tempat Lahir terlebih dahulu!");
                return;
            }

            try {
                if (riwayatId) {
                    const existingMembers = allWargaMasterData.filter(w => (w.noKk || "").trim() === noKkVal);
                    const nextNoUrut = existingMembers.length > 0 ? (existingMembers.length) : 1;

                    const wargaData = {
                        tanggalKejadian: tanggalLahirVal,
                        noKk: noKkVal,
                        noUrut: nextNoUrut,
                        namaKepalaKeluarga: namaAyahVal,
                        statusWajibIuran: "Wajib",
                        rtRw: alamatVal,
                        kelurahan: globalKelurahan,
                        kecamatan: globalKecamatan,
                        kabupaten: globalKabupaten,
                        
                        statusWarga: "Aktif",
                        tanggalMeninggal: null,
                        statusMutasi: "-",
                        tanggalMutasi: null,
                        namaLengkap: namaBayiVal,
                        nik: nikBayiVal,
                        jenisKelamin: jenisKelaminVal,
                        tempatLahir: tempatLahirVal,
                        tanggalLahir: tanggalLahirVal,
                        agama: agamaVal,
                        pendidikan: "-",
                        jenisPekerjaan: "BELUM/TIDAK BEKERJA",
                        golDarah: "-",
                        statusPerkawinan: "BELUM KAWIN",
                        kewarganegaraan: "WNI",
                        statusHubungan: "ANAK",
                        phone: "",
                        namaAyah: namaAyahVal,
                        namaIbu: namaIbuVal,
                        email: "",
                        beratPanjang: beratPanjangVal,
                        updatedAt: new Date()
                    };

                    let targetWargaId = wargaDocId;
                    if (wargaDocId) {
                        await updateDoc(doc(db, "dataWarga", wargaDocId), wargaData);
                    } else {
                        wargaData.createdAt = new Date();
                        const newWargaRef = await addDoc(collection(db, "dataWarga"), wargaData);
                        targetWargaId = newWargaRef.id;
                    }

                    const riwayatData = {
                        ...wargaData,
                        wargaId: targetWargaId,
                        jenisPeristiwa: "KELAHIRAN",
                        keterangan: `Pencatatan Kelahiran Bayi: ${namaBayiVal} (KK: ${noKkVal})`,
                        logCreatedAt: new Date()
                    };
                    await updateDoc(doc(db, "riwayatWarga", riwayatId), riwayatData);

                    showToast('Data kelahiran berhasil diperbarui!');
                } else {
                    const existingMembers = allWargaMasterData.filter(w => (w.noKk || "").trim() === noKkVal);
                    const nextNoUrut = existingMembers.length + 1;

                    const wargaData = {
                        tanggalKejadian: tanggalLahirVal,
                        noKk: noKkVal,
                        noUrut: nextNoUrut,
                        namaKepalaKeluarga: namaAyahVal,
                        statusWajibIuran: "Wajib",
                        rtRw: alamatVal,
                        kelurahan: globalKelurahan,
                        kecamatan: globalKecamatan,
                        kabupaten: globalKabupaten,
                        
                        statusWarga: "Aktif",
                        tanggalMeninggal: null,
                        statusMutasi: "-",
                        tanggalMutasi: null,
                        namaLengkap: namaBayiVal,
                        nik: nikBayiVal,
                        jenisKelamin: jenisKelaminVal,
                        tempatLahir: tempatLahirVal,
                        tanggalLahir: tanggalLahirVal,
                        agama: agamaVal,
                        pendidikan: "-",
                        jenisPekerjaan: "BELUM/TIDAK BEKERJA",
                        golDarah: "-",
                        statusPerkawinan: "BELUM KAWIN",
                        kewarganegaraan: "WNI",
                        statusHubungan: "ANAK",
                        phone: "",
                        namaAyah: namaAyahVal,
                        namaIbu: namaIbuVal,
                        email: "",
                        beratPanjang: beratPanjangVal,
                        createdAt: new Date(),
                        updatedAt: new Date()
                    };

                    const wargaRef = await addDoc(collection(db, "dataWarga"), wargaData);

                    const riwayatData = {
                        ...wargaData,
                        wargaId: wargaRef.id,
                        jenisPeristiwa: "KELAHIRAN",
                        keterangan: `Pencatatan Kelahiran Bayi: ${namaBayiVal} (KK: ${noKkVal})`,
                        logCreatedAt: new Date()
                    };
                    await addDoc(collection(db, "riwayatWarga"), riwayatData);

                    showToast('Data kelahiran & data warga berhasil ditambahkan!');
                }
                closeKelahiranModal();
            } catch (error) {
                alert("Gagal menyimpan data: " + error.message);
            }
        });

        window.deleteKelahiran = async function(id, wargaId) {
            if (confirm("Apakah Anda yakin ingin menghapus data kelahiran ini? Data dari riwayat dan master warga akan dihapus.")) {
                try {
                    await deleteDoc(doc(db, "riwayatWarga", id));
                    
                    if (wargaId) {
                        try {
                            await deleteDoc(doc(db, "dataWarga", wargaId));
                        } catch (err) {
                            console.log("Data warga master mungkin sudah terhapus.");
                        }
                    }

                    showToast('Data berhasil dihapus dari riwayat dan master warga!');
                } catch (error) {
                    alert("Gagal menghapus data: " + error.message);
                }
            }
        };
    </script>
</body>
</html>
