    <!-- AREA KONTEN UTAMA / TABEL / GRID -->

        <div id="desktopContentContainer" class="space-y-3">
            <div class="p-6 bg-slate-50 dark:bg-slate-700/50 rounded-none border border-slate-200/70 dark:border-slate-700 shadow-sm text-center text-slate-400 text-xs">
                Memuat data rapat...

        </div>

        <div class="flex items-stretch border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-800 shadow-sm">

    <!-- AREA KONTEN UTAMA (MOBILE) -->

        <div id="mobileContentContainer" class="space-y-2.5">
            <div class="p-4 bg-slate-50 dark:bg-slate-700/50 rounded-none border border-slate-200/70 dark:border-slate-700 shadow-sm text-center text-slate-400 text-xs">
                Memuat data rapat...

<!-- SKRIP UTAMA & FIRESTORE -->
<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, collection, addDoc, getDocs, onSnapshot, serverTimestamp, query, orderBy } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const firebaseConfig = {
        apiKey: "AIzaSyBx2AF0YRpOEq--q__dn39NwiNCKXvKutM",
        authDomain: "erte-979ca.firebaseapp.com",
        projectId: "erte-979ca",
        storageBucket: "erte-979ca.firebasestorage.app",
        messagingSenderId: "329513636032",
        appId: "1:329513636032:web:25a10b627b91db2bbb5d25"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    let allRapatData = [];
    let isInitialLoad = true;

    const now = new Date();
    const currentYear = now.getFullYear().toString();
    const currentMonth = String(now.getMonth() + 1).padStart(2, '0');

    async function loadJudulRapatOptions() {
        const selectEl = document.getElementById('inputJudulRapat');
        if (!selectEl) return;

        try {
            const querySnapshot = await getDocs(collection(db, "kategoriJudulRapat"));
            let optionsHtml = '<option value="" disabled selected>Pilih Judul Rapat...</option>';
            
            if (querySnapshot.empty) {
                optionsHtml = '<option value="" disabled selected>Belum ada data judul rapat</option>';
            } else {
                querySnapshot.forEach((doc) => {
                    const data = doc.data();
                    const namaJudul = data.nama || '';
                    if (namaJudul) {
                        optionsHtml += `<option value="${namaJudul}">${namaJudul}</option>`;
                    }
                });
            }
            selectEl.innerHTML = optionsHtml;
        } catch (error) {
            console.error("Gagal memuat kategori judul rapat:", error);
        }
    }

    function initBottomModal() {
        if (document.getElementById('customRapatModal')) return;

        const modalHTML = `
        <div id="customRapatModal" class="fixed inset-0 bg-black/50 backdrop-blur-[2px] z-[9999] flex items-end justify-center hidden transition-opacity duration-300">
            <div id="customRapatBox" class="w-full max-w-lg bg-white dark:bg-slate-800 rounded-t-2xl p-5 shadow-2xl flex flex-col max-h-[90vh] transform translate-y-full transition-transform duration-300 ease-out">
                <div class="w-12 h-1.5 bg-slate-300 dark:bg-slate-600 rounded-full mx-auto mb-3"></div>
                
                <div class="flex justify-between items-center mb-3 pb-2 border-b border-slate-100 dark:border-slate-700">
                    <h3 class="font-bold text-slate-800 dark:text-slate-100 text-xs uppercase tracking-wide">Form Tambah Rapat</h3>
                    <button type="button" id="closeCustomModal" class="w-6 h-6 rounded-none bg-slate-100 dark:bg-slate-700 text-slate-500 hover:bg-slate-200 flex items-center justify-center text-xs cursor-pointer">
                        <i class="fa-solid fa-xmark"></i>
                    </button>
                </div>
                
                <form id="formRapatCustom" class="space-y-3 text-xs overflow-y-auto flex-1 pb-2">
                    <div>
                        <label class="block text-[11px] font-semibold text-slate-700 dark:text-slate-300 mb-1">Judul Rapat</label>
                        <select id="inputJudulRapat" required class="w-full px-3 py-2 rounded-none border border-slate-200 dark:border-slate-600 text-xs bg-slate-50 dark:bg-slate-700 text-slate-800 dark:text-slate-100 focus:outline-none focus:border-emerald-600">
                            <option value="" disabled selected>Memuat data...</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-[11px] font-semibold text-slate-700 dark:text-slate-300 mb-1">Kategori Rapat</label>
                        <input type="text" id="inputKategoriRapat" required placeholder="Contoh: Rapat Pleno RT" class="w-full px-3 py-2 rounded-none border border-slate-200 dark:border-slate-600 text-xs bg-slate-50 dark:bg-slate-700 text-slate-800 dark:text-slate-100 focus:outline-none focus:border-emerald-600">
                    </div>
                    <div>
                        <label class="block text-[11px] font-semibold text-slate-700 dark:text-slate-300 mb-1">Tanggal</label>
                        <input type="date" id="inputTanggalRapat" required class="w-full px-3 py-2 rounded-none border border-slate-200 dark:border-slate-600 text-xs bg-slate-50 dark:bg-slate-700 text-slate-800 dark:text-slate-100 focus:outline-none focus:border-emerald-600">
                    </div>
                    <div>
                        <label class="block text-[11px] font-semibold text-slate-700 dark:text-slate-300 mb-1">Notulen / Hasil Pembahasan</label>
                        <textarea id="inputNotulenRapat" rows="5" required placeholder="Tuliskan hasil notulen rapat..." class="w-full px-3 py-2 rounded-none border border-slate-200 dark:border-slate-600 text-xs bg-slate-50 dark:bg-slate-700 text-slate-800 dark:text-slate-100 focus:outline-none focus:border-emerald-600"></textarea>
                    </div>
                    <div class="flex space-x-2 pt-2">
                        <button type="button" id="cancelCustomModal" class="w-1/2 bg-slate-200 dark:bg-slate-700 hover:bg-slate-300 text-slate-700 dark:text-slate-200 font-semibold py-2 rounded-none transition-all text-xs cursor-pointer">Batal</button>
                        <button type="submit" class="w-1/2 bg-emerald-600 hover:bg-emerald-700 text-white font-semibold py-2 rounded-none shadow transition-all text-xs cursor-pointer">Simpan</button>
                    </div>
                </form>
            </div>
        `;

        document.body.insertAdjacentHTML('beforeend', modalHTML);

        document.getElementById('closeCustomModal').addEventListener('click', window.tutupModalRapat);
        document.getElementById('cancelCustomModal').addEventListener('click', window.tutupModalRapat);
        document.getElementById('customRapatModal').addEventListener('click', (e) => {
            if (e.target.id === 'customRapatModal') window.tutupModalRapat();
        });

        document.getElementById('formRapatCustom').addEventListener('submit', async (e) => {
            e.preventDefault();
            const judulVal = document.getElementById('inputJudulRapat').value.trim();
            const kategoriVal = document.getElementById('inputKategoriRapat').value.trim();
            const tanggalVal = document.getElementById('inputTanggalRapat').value.trim();
            const notulenVal = document.getElementById('inputNotulenRapat').value.trim();

            if (!judulVal || !kategoriVal || !tanggalVal || !notulenVal) return;

            try {
                await addDoc(collection(db, "rapat"), {
                    judul: judulVal,
                    kategori: kategoriVal,
                    tanggal: tanggalVal,
                    notulen: notulenVal,
                    authorName: "Admin RT",
                    createdAt: serverTimestamp(),
                    updatedAt: serverTimestamp()
                });
                e.target.reset();
                window.tutupModalRapat();
                if (typeof showToast === 'function') {
                    showToast("Data rapat berhasil disimpan!");
                } else {
                    alert("Data rapat berhasil disimpan!");
                }
            } catch (error) {
                alert("Gagal menyimpan data: " + error.message);
            }
        });
    }

    window.bukaModalRapat = function() {
        initBottomModal();
        loadJudulRapatOptions();
        
        const today = new Date().toISOString().split('T')[0];
        const tanggalInput = document.getElementById('inputTanggalRapat');
        if (tanggalInput) {
            tanggalInput.value = today;
        }

        const modal = document.getElementById('customRapatModal');
        const box = document.getElementById('customRapatBox');
        if (modal && box) {
            modal.classList.remove('hidden');
            setTimeout(() => {
                box.classList.remove('translate-y-full');
            }, 10);
        }
    }

    window.tutupModalRapat = function() {
        const modal = document.getElementById('customRapatModal');
        const box = document.getElementById('customRapatBox');
        if (modal && box) {
            box.classList.add('translate-y-full');
            setTimeout(() => {
                modal.classList.add('hidden');
            }, 300);
        }
    }

    window.openTemplateModal = window.bukaModalRapat;
    window.closeTemplateModal = window.tutupModalRapat;

    function syncAndUpdate(bulanVal, tahunVal) {
        const bDesk = document.getElementById('filterBulanDesktop');
        const bMob = document.getElementById('filterBulanMobile');
        const tDesk = document.getElementById('filterTahunDesktop');
        const tMob = document.getElementById('filterTahunMobile');

        if (bDesk) bDesk.value = bulanVal;
        if (bMob) bMob.value = bulanVal;
        if (tDesk) tDesk.value = tahunVal;
        if (tMob) tMob.value = tahunVal;

        renderRapatData();
    }

    function updateYearDropdown(dataRapat) {
        const yearsSet = new Set();
        dataRapat.forEach(item => {
            if (item.tanggal && item.tanggal.length >= 4) {
                yearsSet.add(item.tanggal.substring(0, 4));
            }
        });

        const sortedYears = Array.from(yearsSet).sort((a, b) => b - a);
        let optionsHtml = '<option value="">Semua Tahun</option>';
        sortedYears.forEach(year => {
            optionsHtml += `<option value="${year}">${year}</option>`;
        });

        const tDesk = document.getElementById('filterTahunDesktop');
        const tMob = document.getElementById('filterTahunMobile');

        if (tDesk) tDesk.innerHTML = optionsHtml;
        if (tMob) tMob.innerHTML = optionsHtml;

        if (isInitialLoad) {
            let targetTahun = sortedYears.includes(currentYear) ? currentYear : (sortedYears[0] || "");
            syncAndUpdate(currentMonth, targetTahun);
            isInitialLoad = false;
        }
    }

    function renderRapatData() {
        const desktopContainer = document.getElementById('desktopContentContainer');
        const mobileContainer = document.getElementById('mobileContentContainer');
        if (!desktopContainer || !mobileContainer) return;

        const selectedBulan = document.getElementById('filterBulanDesktop')?.value || document.getElementById('filterBulanMobile')?.value || '';
        const selectedTahun = document.getElementById('filterTahunDesktop')?.value || document.getElementById('filterTahunMobile')?.value || '';

        const filteredData = allRapatData.filter(item => {
            if (!item.tanggal) return false;
            const parts = item.tanggal.split('-');
            if (parts.length < 2) return false;
            const itemTahun = parts[0];
            const itemBulan = parts[1];

            const matchBulan = selectedBulan === '' || itemBulan === selectedBulan;
            const matchTahun = selectedTahun === '' || itemTahun === selectedTahun;

            return matchBulan && matchTahun;
        });

        if (filteredData.length === 0) {
            const emptyMsg = '<div class="p-4 bg-slate-50 dark:bg-slate-700/50 rounded-none border border-slate-200/70 dark:border-slate-700 shadow-sm text-center text-slate-400 text-xs">Tidak ada data rapat untuk periode ini.</div>';
            desktopContainer.innerHTML = emptyMsg;
            mobileContainer.innerHTML = emptyMsg;
            return;
        }

        let desktopHtml = "";
        let mobileHtml = "";

        filteredData.forEach(data => {
            const judul = data.judul || '-';
            const kategori = data.kategori || '-';
            const tanggal = data.tanggal || '-';
            const notulen = data.notulen || '-';

            desktopHtml += `
                <div class="p-3.5 bg-slate-50 dark:bg-slate-700/50 rounded-none border border-slate-200/70 dark:border-slate-700 shadow-sm space-y-2">
                    <div class="flex items-center justify-between">
                        <span class="px-2 py-0.5 bg-emerald-100 dark:bg-emerald-900/40 text-emerald-800 dark:text-emerald-300 font-semibold text-[10px] uppercase">${kategori}</span>
                        <span class="text-[11px] text-slate-500 dark:text-slate-400"><i class="fa-regular fa-calendar mr-1"></i>${tanggal}</span>
                    </div>
                    <div>
                        <h4 class="font-bold text-slate-800 dark:text-slate-100 text-xs">${judul}</h4>
                        <p class="text-slate-600 dark:text-slate-300 mt-1 text-[11px] leading-relaxed"><strong>Notulen:</strong> ${notulen}</p>
                    </div>
                </div>
            `;

            mobileHtml += `
                <div class="p-3 bg-slate-50 dark:bg-slate-700/50 rounded-none border border-slate-200/70 dark:border-slate-700 shadow-sm space-y-2">
                    <div class="flex items-center justify-between">
                        <span class="px-2 py-0.5 bg-emerald-100 dark:bg-emerald-900/40 text-emerald-800 dark:text-emerald-300 font-semibold text-[10px] uppercase">${kategori}</span>
                        <span class="text-[10px] text-slate-500 dark:text-slate-400">${tanggal}</span>
                    </div>
                    <div>
                        <h4 class="font-bold text-slate-800 dark:text-slate-100 text-xs">${judul}</h4>
                        <p class="text-slate-600 dark:text-slate-300 mt-1 text-[11px] leading-relaxed"><strong>Notulen:</strong> ${notulen}</p>
                    </div>
                </div>
            `;
        });

        desktopContainer.innerHTML = desktopHtml;
        mobileContainer.innerHTML = mobileHtml;
    }

    document.getElementById('filterBulanDesktop')?.addEventListener('change', (e) => syncAndUpdate(e.target.value, document.getElementById('filterTahunDesktop').value));
    document.getElementById('filterTahunDesktop')?.addEventListener('change', (e) => syncAndUpdate(document.getElementById('filterBulanDesktop').value, e.target.value));

    document.getElementById('filterBulanMobile')?.addEventListener('change', (e) => syncAndUpdate(e.target.value, document.getElementById('filterTahunMobile').value));
    document.getElementById('filterTahunMobile')?.addEventListener('change', (e) => syncAndUpdate(document.getElementById('filterBulanMobile').value, e.target.value));

    onSnapshot(query(collection(db, "rapat"), orderBy("createdAt", "desc")), (snapshot) => {
        allRapatData = [];
        snapshot.forEach((doc) => {
            allRapatData.push({ id: doc.id, ...doc.data() });
        });

        updateYearDropdown(allRapatData);
        renderRapatData();
    });
</script>
