<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Iuran Wajib Warga - RT-Ku</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts: Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        .no-scrollbar::-webkit-scrollbar {
            display: none !important;
            width: 0px !important;
            height: 0px !important;
        }
        .no-scrollbar {
            -ms-overflow-style: none !important;
            scrollbar-width: none !important;
        }
    </style>
</head>
<body class="bg-slate-900 font-['Inter'] flex justify-center items-center h-screen overflow-hidden m-0">

    <!-- Toast Notification -->
    <div id="toastNotification" class="fixed top-6 left-1/2 transform -translate-x-1/2 bg-slate-900/95 border border-slate-700 text-white px-4 py-2.5 rounded-none shadow-2xl text-xs font-medium flex items-center space-x-2 z-50 transition-all duration-300 opacity-0 pointer-events-none translate-y-[-20px]">
        <div class="w-5 h-5 rounded-none bg-emerald-500 text-white flex items-center justify-center text-[10px] shadow">
            <i class="fa-solid fa-check"></i>
        </div>
        <span id="toastText">Berhasil!</span>
    </div>

    <!-- Container HP Frame -->
    <div class="w-full h-screen sm:max-w-[400px] sm:h-[92vh] sm:max-h-[820px] bg-slate-50 sm:rounded-[35px] shadow-2xl flex flex-col justify-between relative overflow-hidden sm:border-[6px] sm:border-slate-800">
        
        <!-- Header -->
        <div class="bg-gradient-to-b from-emerald-600 to-emerald-700 text-white p-4 rounded-none flex items-center justify-between shrink-0 z-25">
            <a href="../home.html" class="w-9 h-9 rounded-none bg-white/10 flex items-center justify-center text-white backdrop-blur-sm transition-all hover:bg-white/20">
                <i class="fa-solid fa-arrow-left text-xs"></i>
            </a>
            <h1 class="font-bold text-sm tracking-wide">Iuran Wajib & Kas Saya</h1>
            <div class="w-9"></div>
        </div>

        <!-- Content (Scrollable) -->
        <div class="p-4 flex-1 overflow-y-auto no-scrollbar space-y-4 text-xs">
            
            <!-- Ringkasan Status Iuran Warga -->
            <div class="bg-gradient-to-r from-emerald-600 to-teal-700 text-white p-4 rounded-none shadow-md space-y-2">
                <div class="flex items-center justify-between">
                    <span class="text-[11px] font-medium text-emerald-100" id="namaWargaLabel">Memuat Profil...</span>
                    <span class="text-[10px] bg-emerald-800/60 px-2 py-0.5 rounded text-emerald-200" id="badgeTargetLabel">Target: Rp 0/thn</span>
                </div>
                <div class="text-xl font-bold" id="totalSudahBayarText">Rp 0</div>
                <div class="grid grid-cols-2 gap-2 pt-2 border-t border-emerald-500/40 text-[10px]">
                    <div>
                        <span class="text-emerald-200 block">Sisa Kekurangan</span>
                        <span class="font-bold text-white" id="sisaKekuranganText">Rp 0</span>
                    </div>
                    <div>
                        <span class="text-emerald-200 block">Status Pembayaran</span>
                        <span class="font-bold text-amber-300" id="statusLunasText">Belum Lunas</span>
                    </div>
                </div>
            </div>

            <!-- Pemberitahuan Status Buka/Tutup dari Admin -->
            <div id="bannerStatusAkses" class="p-3 rounded-none border text-xs font-medium bg-rose-50 border-rose-200 text-rose-700 flex items-center space-x-2">
                <i class="fa-solid fa-lock text-sm"></i>
                <span id="textStatusAkses">Fasilitas pembayaran mandiri sedang ditutup oleh Bendahara RT.</span>
            </div>

            <!-- Tombol Ajukan Catat Cicilan Mandiri -->
            <div>
                <button type="button" id="btnBukaModalBayar" onclick="bukaModalBaru()" disabled class="w-full bg-slate-300 text-slate-500 font-semibold py-2.5 rounded-none transition-all text-xs flex items-center justify-center space-x-2 cursor-not-allowed">
                    <i class="fa-solid fa-plus"></i>
                    <span>Catat Pembayaran / Angsuran Baru</span>
                </button>
            </div>

            <!-- Histori Pembayaran Iuran Warga -->
            <div class="bg-white rounded-none p-4 shadow-sm border border-slate-200/60 space-y-3">
                <div class="flex items-center justify-between pb-2 border-b border-slate-100">
                    <div class="flex items-center space-x-2">
                        <div class="w-6 h-6 rounded-none bg-emerald-50 text-emerald-600 flex items-center justify-center text-xs">
                            <i class="fa-solid fa-clock-rotate-left"></i>
                        </div>
                        <h3 class="font-bold text-slate-800 text-xs">Histori Angsuran Saya</h3>
                    </div>
                    <span class="text-[9px] bg-emerald-100 text-emerald-700 px-2 py-0.5 rounded-none font-bold">Real-time</span>
                </div>

                <div id="listHistoriContainer" class="space-y-2">
                    <div class="p-3 bg-slate-50 rounded-none border border-slate-200/60 text-center text-slate-400 text-xs">
                        Memuat riwayat pembayaran...
                    </div>
                </div>
            </div>

        </div>

    </div>

    <!-- MODAL POP-UP CATAT / EDIT PEMBAYARAN MANDIRI -->
    <div id="popupModal" class="fixed inset-0 bg-black/60 backdrop-blur-xs z-50 flex items-end justify-center transition-opacity duration-300 opacity-0 pointer-events-none" onclick="toggleModal(false)">
        <div id="modalContent" class="w-full sm:max-w-[400px] bg-white rounded-t-none shadow-2xl p-4 transform translate-y-full transition-transform duration-300 border-t border-slate-200 max-h-[90vh] overflow-y-auto" onclick="event.stopPropagation()">
            <div class="flex items-center justify-between mb-3 pb-2 border-b border-slate-100">
                <h3 class="font-bold text-slate-800 text-xs flex items-center" id="modalTitle">
                    <i class="fa-solid fa-money-bill-wave text-emerald-600 mr-1.5"></i> Catat Angsuran Iuran Wajib
                </h3>
                <button type="button" onclick="toggleModal(false)" class="text-slate-400 hover:text-red-500 text-xs cursor-pointer px-2 py-1">
                    <i class="fa-solid fa-xmark text-sm"></i> Tutup
                </button>
            </div>
            
            <form id="pembayaranForm" class="space-y-3">
                <input type="hidden" id="editDocId" value="">
                
                <div>
                    <label class="block text-[11px] font-semibold text-slate-700 mb-1">Akun</label>
                    <input type="text" id="txtAkun" value="Pendapatan Iuran Wajib" readonly class="w-full px-3 py-2 rounded-none border border-slate-200 text-xs bg-slate-100 text-slate-600 font-semibold focus:outline-none cursor-not-allowed">
                </div>

                <div>
                    <label class="block text-[11px] font-semibold text-slate-700 mb-1">Nominal Angsuran (Rp)</label>
                    <input type="text" id="txtNominal" autocomplete="off" required placeholder="Contoh: 10.000" onkeyup="formatRupiah(this)" class="w-full px-3 py-2 rounded-none border border-slate-200 text-xs bg-slate-50 focus:outline-none focus:border-emerald-600 font-semibold">
                </div>

                <div>
                    <label class="block text-[11px] font-semibold text-slate-700 mb-1">Keterangan Pertemuan / Bulan</label>
                    <input type="text" id="txtKeterangan" autocomplete="off" required class="w-full px-3 py-2 rounded-none border border-slate-200 text-xs bg-slate-50 focus:outline-none focus:border-emerald-600 font-semibold">
                </div>

                <div>
                    <label class="block text-[11px] font-semibold text-slate-700 mb-1">Tanggal Pembayaran</label>
                    <input type="date" id="txtTanggal" required class="w-full px-3 py-2 rounded-none border border-slate-200 text-xs bg-slate-50 focus:outline-none focus:border-emerald-600">
                </div>

                <button type="submit" id="btnSubmitModal" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-semibold py-2.5 rounded-none shadow-md shadow-emerald-600/35 transition-all text-xs cursor-pointer mt-2">
                    Kirim Catatan Pembayaran
                </button>
            </form>
        </div>
    </div>

    <!-- Skrip Firebase & Logika -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { getFirestore, collection, addDoc, updateDoc, doc, getDoc, onSnapshot, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        window.showToast = function(message) {
            const toast = document.getElementById('toastNotification');
            const toastText = document.getElementById('toastText');
            toastText.innerText = message;
            toast.classList.remove('opacity-0', 'pointer-events-none', 'translate-y-[-20px]');
            toast.classList.add('opacity-100', 'translate-y-0');
            setTimeout(() => {
                toast.classList.remove('opacity-100', 'translate-y-0');
                toast.classList.add('opacity-0', 'pointer-events-none', 'translate-y-[-20px]');
            }, 3000);
        }

        const firebaseConfig = {
            apiKey: "AIzaSyBx2AF0YRpOEq--q__dn39NwiNCKXvKutM",
            authDomain: "erte-979ca.firebaseapp.com",
            projectId: "erte-979ca",
            storageBucket: "erte-979ca.firebasestorage.app",
            messagingSenderId: "329513636032",
            appId: "1:329513636032:web:25a10b627b91db2bbb5d25"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        let currentUser = null;
        let namaWargaLogin = "";
        let targetIuranTahunan = 60000;
        let aksesPembayaranDibuka = false;
        let pendingDataCache = {};
        const namaBulanArr = ["Januari", "Februari", "Maret", "April", "Mei", "Juni", "Juli", "Agustus", "September", "Oktober", "November", "Desember"];

        const namaWargaLabel = document.getElementById('namaWargaLabel');
        const badgeTargetLabel = document.getElementById('badgeTargetLabel');
        const totalSudahBayarText = document.getElementById('totalSudahBayarText');
        const sisaKekuranganText = document.getElementById('sisaKekuranganText');
        const statusLunasText = document.getElementById('statusLunasText');
        const listHistoriContainer = document.getElementById('listHistoriContainer');
        const popupModal = document.getElementById('popupModal');
        const modalContent = document.getElementById('modalContent');
        const modalTitle = document.getElementById('modalTitle');
        const pembayaranForm = document.getElementById('pembayaranForm');
        const editDocId = document.getElementById('editDocId');
        const txtAkun = document.getElementById('txtAkun');
        const txtNominal = document.getElementById('txtNominal');
        const txtKeterangan = document.getElementById('txtKeterangan');
        const txtTanggal = document.getElementById('txtTanggal');
        const btnBukaModalBayar = document.getElementById('btnBukaModalBayar');
        const btnSubmitModal = document.getElementById('btnSubmitModal');
        const bannerStatusAkses = document.getElementById('bannerStatusAkses');
        const textStatusAkses = document.getElementById('textStatusAkses');

        onAuthStateChanged(auth, async (user) => {
            if (user) {
                currentUser = user;
                namaWargaLogin = user.displayName || user.email || "Warga RT";
                namaWargaLabel.innerText = namaWargaLogin;
                loadConfigAksesDanTarget();
            } else {
                window.location.href = "../index.html";
            }
        });

        function loadConfigAksesDanTarget() {
            onSnapshot(doc(db, "settings", "pengaturanKeuangan"), (docSnap) => {
                if (docSnap.exists()) {
                    const data = docSnap.data();
                    targetIuranTahunan = Number(data.totalSetahun || 60000);
                    badgeTargetLabel.innerText = `Target: ${formatRupiahNum(targetIuranTahunan)}/thn`;

                    aksesPembayaranDibuka = data.bukaPembayaranWarga || false;
                    
                    if (aksesPembayaranDibuka) {
                        bannerStatusAkses.className = "p-3 rounded-none border text-xs font-medium bg-emerald-50 border-emerald-200 text-emerald-700 flex items-center space-x-2";
                        textStatusAkses.innerText = "Fasilitas pembayaran mandiri sedang DIBUKA oleh Bendahara.";
                        bannerStatusAkses.querySelector("i").className = "fa-solid fa-lock-open text-sm";
                        
                        btnBukaModalBayar.disabled = false;
                        btnBukaModalBayar.className = "w-full bg-emerald-600 hover:bg-emerald-700 text-white font-semibold py-2.5 rounded-none shadow-md shadow-emerald-600/35 transition-all text-xs flex items-center justify-center space-x-2 cursor-pointer";
                    } else {
                        bannerStatusAkses.className = "p-3 rounded-none border text-xs font-medium bg-rose-50 border-rose-200 text-rose-700 flex items-center space-x-2";
                        textStatusAkses.innerText = "Fasilitas pembayaran mandiri sedang DITUTUP oleh Bendahara RT.";
                        bannerStatusAkses.querySelector("i").className = "fa-solid fa-lock text-sm";
                        
                        btnBukaModalBayar.disabled = true;
                        btnBukaModalBayar.className = "w-full bg-slate-300 text-slate-500 font-semibold py-2.5 rounded-none transition-all text-xs flex items-center justify-center space-x-2 cursor-not-allowed";
                    }
                }
            });
            loadHistoriPembayaran();
            loadHistoriPending();
        }

        window.formatRupiah = function(input) {
            let value = input.value.replace(/[^,\d]/g, '').toString();
            let split = value.split(',');
            let sisa = split[0].length % 3;
            let rupiah = split[0].substr(0, sisa);
            let ribuan = split[0].substr(sisa).match(/\d{3}/gi);

            if (ribuan) {
                let separator = sisa ? '.' : '';
                rupiah += separator + ribuan.join('.');
            }

            rupiah = split[1] !== undefined ? rupiah + ',' + split[1] : rupiah;
            input.value = rupiah;
        }

        function formatRupiahNum(angka) {
            return new Intl.NumberFormat('id-ID', { style: 'currency', currency: 'IDR', minimumFractionDigits: 0 }).format(angka);
        }

        window.bukaModalBaru = function() {
            if (!aksesPembayaranDibuka) {
                alert("Maaf, fasilitas pembayaran mandiri saat ini sedang ditutup oleh Bendahara RT.");
                return;
            }
            editDocId.value = "";
            modalTitle.innerHTML = `<i class="fa-solid fa-money-bill-wave text-emerald-600 mr-1.5"></i> Catat Angsuran Iuran Wajib`;
            btnSubmitModal.innerText = "Kirim Catatan Pembayaran";
            pembayaranForm.reset();
            txtAkun.value = "Pendapatan Iuran Wajib";

            const now = new Date();
            txtTanggal.value = now.toISOString().split('T')[0];
            const bulanAktif = namaBulanArr[now.getMonth()];
            const tahunAktif = now.getFullYear();
            txtKeterangan.value = `Iuran Wajib - ${bulanAktif} ${tahunAktif}`;

            toggleModal(true);
        }

        window.bukaModalEdit = function(id) {
            if (!aksesPembayaranDibuka) {
                alert("Maaf, fasilitas pembayaran mandiri saat ini sedang ditutup oleh Bendahara RT.");
                return;
            }
            const data = pendingDataCache[id];
            if (!data) return;

            editDocId.value = id;
            modalTitle.innerHTML = `<i class="fa-solid.fa-pen-to-square text-emerald-600 mr-1.5"></i> Edit Pengajuan Pembayaran`;
            btnSubmitModal.innerText = "Simpan Perubahan";

            txtAkun.value = data.akun || "Pendapatan Iuran Wajib";
            txtNominal.value = Number(data.nominal || 0).toLocaleString('id-ID');
            txtKeterangan.value = data.keterangan || "";
            txtTanggal.value = data.tanggal || "";

            toggleModal(true);
        }

        window.toggleModal = function(isOpen) {
            if (isOpen) {
                popupModal.classList.remove('opacity-0', 'pointer-events-none');
                modalContent.classList.remove('translate-y-full');
            } else {
                popupModal.classList.add('opacity-0', 'pointer-events-none');
                modalContent.classList.add('translate-y-full');
                pembayaranForm.reset();
                editDocId.value = "";
            }
        }

        pembayaranForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            if (!currentUser || !aksesPembayaranDibuka) return;

            const docId = editDocId.value;
            const akun = txtAkun.value;
            const nominalRaw = parseFloat(txtNominal.value.replace(/[^0-9]/g, '')) || 0;
            const keterangan = txtKeterangan.value.trim();
            const tanggal = txtTanggal.value;

            if (nominalRaw <= 0) {
                alert("Nominal angsuran harus lebih besar dari 0");
                return;
            }

            try {
                if (docId) {
                    // Update data yang sudah ada (edit)
                    await updateDoc(doc(db, "iuranPending", docId), {
                        akun: akun,
                        kategori: "Iuran Wajib",
                        keterangan: keterangan,
                        nominal: nominalRaw,
                        tanggal: tanggal,
                        updatedAt: serverTimestamp()
                    });
                    showToast("Perubahan catatan pembayaran berhasil disimpan!");
                } else {
                    // Tambah data baru
                    await addDoc(collection(db, "iuranPending"), {
                        jenis: "Pemasukan",
                        akun: akun,
                        kategori: "Iuran Wajib",
                        namaWarga: namaWargaLogin,
                        keterangan: keterangan,
                        nominal: nominalRaw,
                        tanggal: tanggal,
                        status: "Menunggu Verifikasi",
                        inputBy: currentUser.email || "Warga",
                        createdAt: serverTimestamp()
                    });
                    showToast("Catatan pembayaran dikirim dan menunggu verifikasi Bendahara!");
                }
                toggleModal(false);
            } catch (error) {
                alert("Gagal menyimpan pembayaran: " + error.message);
            }
        });

        function loadHistoriPembayaran() {
            onSnapshot(collection(db, "kasRt"), (snapshot) => {
                let totalSudahBayar = 0;
                let htmlDisetujui = "";

                snapshot.forEach((docSnap) => {
                    const data = docSnap.data();
                    if (data.jenis === "Pemasukan" && (data.namaWarga?.includes(namaWargaLogin) || data.inputBy === currentUser.email)) {
                        totalSudahBayar += Number(data.nominal) || 0;
                        htmlDisetujui += `
                            <div class="p-3 bg-slate-50 rounded-none border border-slate-200/60 space-y-1">
                                <div class="flex items-center justify-between">
                                    <span class="text-[9px] bg-emerald-100 text-emerald-700 px-1.5 py-0.5 rounded-none font-bold">Disetujui / Sukses</span>
                                    <span class="text-xs font-bold text-emerald-600">+ ${formatRupiahNum(data.nominal || 0)}</span>
                                </div>
                                <h4 class="font-bold text-slate-800 text-[11px]">${data.keterangan || '-'}</h4>
                                <div class="text-[9px] text-slate-400">
                                    <i class="fa-regular fa-calendar mr-1"></i>${data.tanggal || '-'}
                                </div>
                            </div>
                        `;
                    }
                });

                totalSudahBayarText.innerText = formatRupiahNum(totalSudahBayar);
                const sisa = Math.max(0, targetIuranTahunan - totalSudahBayar);
                sisaKekuranganText.innerText = formatRupiahNum(sisa);

                if (totalSudahBayar >= targetIuranTahunan) {
                    statusLunasText.innerText = "LUNAS (1 Tahun)";
                    statusLunasText.className = "font-bold text-emerald-300";
                } else {
                    statusLunasText.innerText = "Belum Lunas";
                    statusLunasText.className = "font-bold text-amber-300";
                }

                window.htmlDisetujuiCache = htmlDisetujui;
                renderCombinedHistori();
            });
        }

        function loadHistoriPending() {
            onSnapshot(collection(db, "iuranPending"), (snapshot) => {
                let htmlPending = "";
                pendingDataCache = {};

                snapshot.forEach((docSnap) => {
                    const data = docSnap.data();
                    if (data.inputBy === currentUser.email || data.namaWarga?.includes(namaWargaLogin)) {
                        pendingDataCache[docSnap.id] = data;
                        htmlPending += `
                            <div class="p-3 bg-amber-50/50 rounded-none border border-amber-200/60 space-y-1">
                                <div class="flex items-center justify-between">
                                    <span class="text-[9px] bg-amber-100 text-amber-700 px-1.5 py-0.5 rounded-none font-bold"><i class="fa-solid fa-clock mr-1"></i>Menunggu Verifikasi</span>
                                    <div class="flex items-center space-x-2">
                                        <button type="button" onclick="bukaModalEdit('${docSnap.id}')" class="text-[9px] bg-amber-600 hover:bg-amber-700 text-white px-2 py-0.5 font-bold cursor-pointer"><i class="fa-solid fa-pen mr-1"></i>Edit</button>
                                        <span class="text-xs font-bold text-amber-600">+ ${formatRupiahNum(data.nominal || 0)}</span>
                                    </div>
                                </div>
                                <h4 class="font-bold text-slate-800 text-[11px]">${data.keterangan || '-'}</h4>
                                <div class="text-[9px] text-slate-400">
                                    <i class="fa-regular fa-calendar mr-1"></i>${data.tanggal || '-'}
                                </div>
                            </div>
                        `;
                    }
                });
                window.htmlPendingCache = htmlPending;
                renderCombinedHistori();
            });
        }

        function renderCombinedHistori() {
            const pending = window.htmlPendingCache || "";
            const disetujui = window.htmlDisetujuiCache || "";
            const combined = pending + disetujui;

            if (combined === "") {
                listHistoriContainer.innerHTML = `<div class="p-3 bg-slate-50 rounded-none border border-slate-200/60 text-center text-slate-400 text-xs">Belum ada riwayat pembayaran iuran yang tercatat.</div>`;
            } else {
                listHistoriContainer.innerHTML = combined;
            }
        }
    </script>
</body>
</html>
