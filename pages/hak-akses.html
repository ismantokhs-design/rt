        const container = document.getElementById('toastContainer');
        if (!container) return;

        const toast = document.createElement('div');
        toast.className = `pointer-events-auto flex items-center space-x-3 px-4 py-3 shadow-lg border text-xs font-medium transition-all duration-300 transform translate-y-[-10px] opacity-0 ${

            <span>${message}</span>
        `;

        container.appendChild(toast);

            toast.classList.remove('translate-y-[-10px]', 'opacity-0');
        }, 10);

        setTimeout(() => {
            toast.classList.add('translate-y-[-10px]', 'opacity-0');
            setTimeout(() => toast.remove(), 300);
        }, 3000);
    };

    // Sinkronisasi pilihan dropdown role desktop & mobile
    if (targetRoleSelect && targetRoleMobileSelect) {
        targetRoleSelect.addEventListener('change', (e) => {
            targetRoleMobileSelect.value = e.target.value;
            loadPermissions(e.target.value);
        });
        targetRoleMobileSelect.addEventListener('change', (e) => {
            targetRoleSelect.value = e.target.value;
            loadPermissions(e.target.value);
        });
    }

    window.selectAllMenus = function(status) {
        document.querySelectorAll('input[name="menuPerm"]').forEach(cb => cb.checked = status);
        document.querySelectorAll('input[name="menuPermMobile"]').forEach(cb => cb.checked = status);
    }

    window.selectAllMenusMobile = function(status) {
        selectAllMenus(status);
    }

    async function loadPermissions(role) {
        try {
            const docRef = doc(db, "permissions", role);
            const docSnap = await getDoc(docRef);
            
            const allCheckboxes = document.querySelectorAll('input[name="menuPerm"], input[name="menuPermMobile"]');
            allCheckboxes.forEach(cb => cb.checked = false);

            if (docSnap.exists()) {
                const allowedMenus = docSnap.data().allowedMenus || [];
                allCheckboxes.forEach(cb => {
                    if (allowedMenus.includes(cb.value)) {
                        cb.checked = true;
                    }
                });
            } else {
                if (role === 'Warga') {
                    allCheckboxes.forEach(cb => {
                        if (['home', 'absensi', 'rapat', 'keuangan', 'galeri', 'manajemen-event'].includes(cb.value)) {
                            cb.checked = true;
                        }
                    });
                } else {
                    allCheckboxes.forEach(cb => cb.checked = true);
                }
            }
        } catch (error) {
            console.error("Gagal memuat hak akses:", error);
        }
    }

    // Inisialisasi awal load
    const initialRole = targetRoleSelect ? targetRoleSelect.value : 'Ketua RT';
    loadPermissions(initialRole);

    async function saveRolePermissions() {
        const selectedRole = targetRoleSelect ? targetRoleSelect.value : targetRoleMobileSelect.value;
        const allowedMenus = [];
        
        // Ambil nilai dari checkbox desktop/mobile yang aktif
        document.querySelectorAll('input[name="menuPerm"]:checked').forEach(cb => {
            if (!allowedMenus.includes(cb.value)) allowedMenus.push(cb.value);
        });
        document.querySelectorAll('input[name="menuPermMobile"]:checked').forEach(cb => {
            if (!allowedMenus.includes(cb.value)) allowedMenus.push(cb.value);
        });

        try {
            await setDoc(doc(db, "permissions", selectedRole), {
                role: selectedRole,
                allowedMenus: allowedMenus,
                updatedAt: new Date()
            }, { merge: true });

            showToast(`Hak akses untuk role ${selectedRole} berhasil disimpan!`);
        } catch (error) {
            showToast("Gagal menyimpan hak akses: " + error.message, 'error');
        }
    }

    if (saveBtn) saveBtn.addEventListener('click', async () => await saveRolePermissions());
    if (saveBtnMobile) saveBtnMobile.addEventListener('click', async () => await saveRolePermissions());
</script>
