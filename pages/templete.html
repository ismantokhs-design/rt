<!-- MODAL FORM TEMPLATE (OPSIONAL) -->
<div id="templateModal" class="fixed inset-0 bg-black/50 backdrop-blur-[2px] z-50 flex items-center justify-center hidden transition-all duration-300 p-4">
    <div class="w-full max-w-md bg-white dark:bg-slate-800 rounded-none p-5 shadow-2xl flex flex-col max-h-[90vh]">
        <div class="flex justify-between items-center mb-3 pb-2 border-b border-slate-100 dark:border-slate-700">
            <h3 class="font-bold text-slate-800 dark:text-slate-100 text-xs uppercase tracking-wide">Form Tambah Data</h3>
            <button type="button" onclick="closeTemplateModal()" class="w-6 h-6 rounded-none bg-slate-100 dark:bg-slate-700 text-slate-500 hover:bg-slate-200 flex items-center justify-center text-xs cursor-pointer">
                <i class="fa-solid fa-xmark"></i>
            </button>
        </div>
        <form id="templateForm" class="space-y-3 text-xs overflow-y-auto flex-1 pb-1">
            <div>
                <label class="block text-[11px] font-semibold text-slate-700 dark:text-slate-300 mb-1">Nama / Judul</label>
                <input type="text" id="inputNama" required placeholder="Masukkan nama..." class="w-full px-3 py-2 rounded-none border border-slate-200 dark:border-slate-600 text-xs bg-slate-50 dark:bg-slate-700 text-slate-800 dark:text-slate-100 focus:outline-none focus:border-emerald-600">
            </div>
            <div class="flex space-x-2 pt-2">
                <button type="button" onclick="closeTemplateModal()" class="w-1/2 bg-slate-200 dark:bg-slate-700 hover:bg-slate-300 text-slate-700 dark:text-slate-200 font-semibold py-2 rounded-none transition-all text-xs cursor-pointer">Batal</button>
                <button type="submit" class="w-1/2 bg-emerald-600 hover:bg-emerald-700 text-white font-semibold py-2 rounded-none shadow transition-all text-xs cursor-pointer">Simpan</button>
            </div>
        </form>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, collection, addDoc, getDocs, onSnapshot, serverTimestamp, query, orderBy } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const firebaseConfig = {
        apiKey: "AIzaSyBx2AF0YRpOEq--q__dn39NwiNCKXvKutM",
        authDomain: "erte-979ca.firebaseapp.com",
        projectId: "erte-979ca",
        storageBucket: "erte-979ca.firebasestorage.app",
        messagingSenderId: "329513636032",
        appId: "1:329513636032:web:25a10b627b91db2bbb5d25"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    // Fungsi Kontrol Modal
    window.openTemplateModal = function() {
        document.getElementById('templateModal')?.classList.remove('hidden');
    }
    window.closeTemplateModal = function() {
        document.getElementById('templateModal')?.classList.add('hidden');
    }

    // Contoh Event Submit Form ke Firestore
    document.getElementById('templateForm')?.addEventListener('submit', async (e) => {
        e.preventDefault();
        const namaVal = document.getElementById('inputNama').value.trim();
        if (!namaVal) return;

        try {
            await addDoc(collection(db, "namakoleksi"), {
                nama: namaVal,
                createdAt: serverTimestamp()
            });
            e.target.reset();
            closeTemplateModal();
            if (typeof showToast === 'function') showToast("Data berhasil disimpan!");
        } catch (error) {
            alert("Gagal menyimpan data: " + error.message);
        }
    });
