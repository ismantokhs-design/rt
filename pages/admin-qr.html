<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>QR Code Absensi - Admin RT 05</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts: Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- QRCode Generator Library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <style>
        .no-scrollbar::-webkit-scrollbar {
            display: none !important;
            width: 0px !important;
            height: 0px !important;
        }
        .no-scrollbar {
            -ms-overflow-style: none !important;
            scrollbar-width: none !important;
        }
    </style>
</head>
<body class="bg-slate-900 font-['Inter'] flex justify-center items-center h-screen overflow-hidden m-0">

    <!-- Toast Notification -->
    <div id="toastNotification" class="fixed top-6 left-1/2 transform -translate-x-1/2 bg-slate-900/95 border border-slate-700 text-white px-4 py-2.5 rounded-2xl shadow-2xl text-xs font-medium flex items-center space-x-2 z-50 transition-all duration-300 opacity-0 pointer-events-none translate-y-[-20px]">
        <div class="w-5 h-5 rounded-full bg-emerald-500 text-white flex items-center justify-center text-[10px] shadow">
            <i class="fa-solid fa-check"></i>
        </div>
        <span id="toastText">Berhasil!</span>
    </div>

    <!-- Container HP Frame -->
    <div class="w-full h-screen sm:max-w-[400px] sm:h-[92vh] sm:max-h-[820px] bg-slate-50 sm:rounded-[35px] shadow-2xl flex flex-col justify-between relative overflow-hidden sm:border-[6px] sm:border-slate-800">
        
        <!-- Header (Tombol kembali diarahkan ke ../home.html) -->
        <div class="bg-gradient-to-b from-emerald-600 to-emerald-700 text-white p-5 rounded-b-[28px] flex items-center justify-between shrink-0">
            <a href="../home.html" class="w-9 h-9 rounded-full bg-white/10 flex items-center justify-center text-white backdrop-blur-sm transition-all hover:bg-white/20">
                <i class="fa-solid fa-arrow-left text-xs"></i>
            </a>
            <h1 class="font-bold text-sm tracking-wide">Generator QR Code</h1>
            <div class="w-9"></div>
        </div>

        <!-- Content -->
        <div class="p-4 flex-1 overflow-y-auto no-scrollbar space-y-4">
            
            <!-- Form Input Fleksibel -->
            <div class="bg-white p-4 rounded-2xl shadow-sm border border-slate-200/70 space-y-3">
                <h2 class="font-bold text-slate-800 text-xs flex items-center">
                    <i class="fa-solid fa-pen-to-square text-emerald-600 mr-1.5"></i> Masukkan Data QR Code
                </h2>
                <div class="space-y-2">
                    <label class="block text-[11px] font-semibold text-slate-700">Teks / Kode Absensi</label>
                    <input type="text" id="inputQrText" value="RT05-RAPAT-BULANAN-2026-10-22" placeholder="Contoh: RT05-RAPAT-2026" class="w-full px-3 py-2.5 rounded-xl border border-slate-200 text-xs bg-slate-50 focus:outline-none focus:border-emerald-600">
                    <button type="button" onclick="generateQRCode()" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-semibold py-2.5 rounded-xl shadow-md shadow-emerald-600/35 transition-all text-xs cursor-pointer">
                        Buat QR Code
                    </button>
                </div>
            </div>

            <!-- Tampilan QR Code Hasil -->
            <div class="bg-white p-5 rounded-2xl shadow-sm border border-slate-200/70 flex flex-col items-center text-center">
                <h3 class="font-bold text-slate-800 text-xs mb-3">Hasil QR Code Kehadiran</h3>
                
                <!-- Kotak QR Code -->
                <div id="qrcode" class="p-3 bg-white border border-slate-100 rounded-2xl shadow-inner inline-block min-w-[150px] min-h-[150px] flex items-center justify-center"></div>
                
                <p id="labelQrText" class="text-xs font-semibold text-emerald-700 mt-3 break-all">RT05-RAPAT-BULANAN-2026-10-22</p>
            </div>

        </div>

        <!-- Tempat Include Bottom Navigation -->
        <div id="nav-container"></div>

    </div>

    <!-- Skrip Generate QR Code Fleksibel -->
    <script type="module">
        import { renderNavigation } from "../assets/js/navigation.js";
        document.getElementById('nav-container').innerHTML = renderNavigation('home', true);

        // Toast Notification
        window.showToast = function(message) {
            const toast = document.getElementById('toastNotification');
            const toastText = document.getElementById('toastText');
            toastText.innerText = message;
            toast.classList.remove('opacity-0', 'pointer-events-none', 'translate-y-[-20px]');
            toast.classList.add('opacity-100', 'translate-y-0');
            setTimeout(() => {
                toast.classList.remove('opacity-100', 'translate-y-0');
                toast.classList.add('opacity-0', 'pointer-events-none', 'translate-y-[-20px]');
            }, 1800);
        }

        let qrInstance = null;

        // Fungsi Generate QR Code dari Input
        window.generateQRCode = function() {
            const textValue = document.getElementById('inputQrText').value.trim();
            const qrContainer = document.getElementById('qrcode');
            const labelText = document.getElementById('labelQrText');

            if (!textValue) {
                alert("Teks atau kode QR tidak boleh kosong!");
                return;
            }

            // Bersihkan QR Code sebelumnya
            qrContainer.innerHTML = "";
            labelText.innerText = textValue;

            // Buat QR Code baru
            qrInstance = new QRCode(qrContainer, {
                text: textValue,
                width: 180,
                height: 180,
                colorDark: "#065f46",
                colorLight: "#ffffff",
                correctLevel: QRCode.CorrectLevel.H
            });

            showToast('QR Code berhasil diperbarui!');
        };

        // Otomatis buat QR Code saat halaman pertama kali dibuka
        window.addEventListener('load', () => {
            generateQRCode();
        });
    </script>
</body>
</html>
