<!-- KONTEN UTAMA HALAMAN (DESKTOP) -->
<div id="spaAppContainer" class="space-y-4 pb-20">
    <!-- HEADER / JUDUL HALAMAN -->
    <div class="bg-white dark:bg-slate-800 p-4 rounded-none shadow-sm border border-slate-200 dark:border-slate-700 flex flex-col md:flex-row md:items-center md:justify-between gap-3">
        <div>
            <h3 class="text-xs font-bold text-slate-800 dark:text-slate-100 uppercase tracking-wide">Generate QR Code Rapat</h3>
            <p class="text-[11px] text-slate-500 dark:text-slate-400 mt-0.5">Buat dan kelola QR Code absensi rapat berdasarkan tanggal. Klik gambar QR untuk memperbesar.</p>
        </div>
        <div>
            <button type="button" onclick="window.openTemplateModal()" class="bg-emerald-600 hover:bg-emerald-700 text-white px-3 py-1.5 rounded-none text-xs font-bold transition-all shadow cursor-pointer">
                <i class="fa-solid fa-qrcode mr-1"><span>Buat QR Baru</span></i>
            </button>
        </div>
    </div>

    <!-- AREA KONTEN UTAMA / GRID -->
    <div class="bg-white dark:bg-slate-800 p-4 rounded-none shadow-sm border border-slate-200 dark:border-slate-700 space-y-3">
        <div id="desktopContentContainer" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
            <div class="col-span-full p-6 bg-slate-50 dark:bg-slate-700/50 rounded-none border border-slate-200/70 dark:border-slate-700 shadow-sm text-center text-slate-400 text-xs">
                Memuat data QR Code rapat...
            </div>
        </div>
    </div>
</div>

<!-- KONTEN UTAMA HALAMAN (MOBILE) -->
<div id="spaAppContainerMobile" class="space-y-3 pb-28">
    <!-- HEADER / TOMBOL PINTAS (MOBILE) -->
    <div class="bg-white dark:bg-slate-800 p-3.5 rounded-none shadow-sm border border-slate-200 dark:border-slate-700">
        <div class="flex items-center justify-between mb-2">
            <h3 class="text-xs font-bold text-slate-800 dark:text-slate-100 uppercase tracking-wide">QR Code Rapat</h3>
        </div>
        <button type="button" onclick="window.openTemplateModal()" class="w-full py-2.5 px-3 bg-emerald-600 hover:bg-emerald-700 text-white font-bold rounded-none shadow-sm transition-all flex items-center justify-center space-x-2 text-xs cursor-pointer">
            <i class="fa-solid fa-qrcode text-xs"></i>
            <span>Buat QR Baru</span>
        </button>
    </div>

    <!-- AREA KONTEN UTAMA (MOBILE) -->
    <div class="bg-white dark:bg-slate-800 p-3.5 rounded-none shadow-sm border border-slate-200 dark:border-slate-700 space-y-2.5">
        <div id="mobileContentContainer" class="space-y-2.5">
            <div class="p-4 bg-slate-50 dark:bg-slate-700/50 rounded-none border border-slate-200/70 dark:border-slate-700 shadow-sm text-center text-slate-400 text-xs">
                Memuat data QR Code rapat...
            </div>
        </div>
    </div>
</div>

<!-- SKRIP LOGIKA & FIRESTORE -->
<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, collection, addDoc, getDocs, deleteDoc, doc, onSnapshot, serverTimestamp, query, orderBy } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const firebaseConfig = {
        apiKey: "AIzaSyBx2AF0YRpOEq--q__dn39NwiNCKXvKutM",
        authDomain: "erte-979ca.firebaseapp.com",
        projectId: "erte-979ca",
        storageBucket: "erte-979ca.firebasestorage.app",
        messagingSenderId: "329513636032",
        appId: "1:329513636032:web:25a10b627b91db2bbb5d25"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    // Inisialisasi Modal Zoom QR secara Dinamis agar aman dari error null
    function initZoomModal() {
        if (document.getElementById('qrZoomModal')) return;

        const zoomModalHTML = `
        <div id="qrZoomModal" class="fixed inset-0 bg-black/80 backdrop-blur-md z-[99999] flex items-center justify-center p-4 hidden transition-all">
            <div class="relative max-w-sm w-full bg-white dark:bg-slate-800 p-6 shadow-2xl border border-slate-700 flex flex-col items-center text-center space-y-3" onclick="event.stopPropagation()">
                <button type="button" id="closeZoomBtn" class="absolute -top-3 -right-3 w-7 h-7 bg-slate-900 text-white rounded-full flex items-center justify-center text-xs shadow-lg cursor-pointer hover:bg-emerald-600 transition-all border border-slate-600 z-10">
                    <i class="fa-solid fa-xmark"></i>
                </button>
                <div class="space-y-0.5">
                    <span id="zoomQrDate" class="text-[11px] text-emerald-600 dark:text-emerald-400 font-semibold"></span>
                    <h4 id="zoomQrTitle" class="font-bold text-slate-800 dark:text-slate-100 text-sm"></h4>
                    <p id="zoomQrLocation" class="text-[11px] text-slate-400"></p>
                </div>
                <div class="p-3 bg-white border border-slate-200 shadow-inner flex justify-center">
                    <img id="zoomQrImgSrc" src="" alt="QR Code Besar" class="w-64 h-64 object-contain">
                </div>
                <p class="text-[10px] text-slate-500 dark:text-slate-400">Silakan arahkan kamera perangkat anggota untuk melakukan scan absensi.</p>
            </div>
        </div>`;

        document.body.insertAdjacentHTML('beforeend', zoomModalHTML);
        document.getElementById('closeZoomBtn').addEventListener('click', window.closeQrZoom);
        document.getElementById('qrZoomModal').addEventListener('click', window.closeQrZoom);
    }

    window.openQrZoom = function(title, date, location, url) {
        initZoomModal();
        document.getElementById('zoomQrTitle').innerText = title;
        document.getElementById('zoomQrDate').innerText = date;
        document.getElementById('zoomQrLocation').innerText = location ? `Lokasi: ${location}` : '';
        document.getElementById('zoomQrImgSrc').src = url;
        document.getElementById('qrZoomModal').classList.remove('hidden');
    }

    window.closeQrZoom = function() {
        const modal = document.getElementById('qrZoomModal');
        if (modal) modal.classList.add('hidden');
    }

    // Inisialisasi Modal Form Input QR Code
    function initBottomModal() {
        if (document.getElementById('templateModal')) return;

        const modalHTML = `
        <div id="templateModal" class="fixed inset-0 bg-black/50 backdrop-blur-[2px] z-[9999] flex items-end justify-center hidden transition-opacity duration-300">
            <div id="templateModalBox" class="w-full max-w-lg bg-white dark:bg-slate-800 rounded-t-2xl p-5 shadow-2xl flex flex-col max-h-[90vh] transform translate-y-full transition-transform duration-300 ease-out">
                <div class="w-12 h-1.5 bg-slate-300 dark:bg-slate-600 rounded-full mx-auto mb-3"></div>
                
                <div class="flex justify-between items-center mb-3 pb-2 border-b border-slate-100 dark:border-slate-700">
                    <h3 class="font-bold text-slate-800 dark:text-slate-100 text-xs uppercase tracking-wide">Buat QR Code Rapat</h3>
                    <button type="button" id="closeCustomModal" class="w-6 h-6 rounded-none bg-slate-100 dark:bg-slate-700 text-slate-500 hover:bg-slate-200 flex items-center justify-center text-xs cursor-pointer">
                        <i class="fa-solid fa-xmark"></i>
                    </button>
                </div>

                <form id="templateForm" class="space-y-3 text-xs overflow-y-auto flex-1 pb-2">
                    <div>
                        <label class="block text-[11px] font-semibold text-slate-700 dark:text-slate-300 mb-1">Judul / Agenda Rapat</label>
                        <input type="text" id="inputTitle" required placeholder="Contoh: Rapat Koordinasi RT..." class="w-full px-3 py-2 rounded-none border border-slate-200 dark:border-slate-600 text-xs bg-slate-50 dark:bg-slate-700 text-slate-800 dark:text-slate-100 focus:outline-none focus:border-emerald-600">
                    </div>
                    <div>
                        <label class="block text-[11px] font-semibold text-slate-700 dark:text-slate-300 mb-1">Tanggal Rapat</label>
                        <input type="date" id="inputDate" required class="w-full px-3 py-2 rounded-none border border-slate-200 dark:border-slate-600 text-xs bg-slate-50 dark:bg-slate-700 text-slate-800 dark:text-slate-100 focus:outline-none focus:border-emerald-600">
                    </div>
                    <div>
                        <label class="block text-[11px] font-semibold text-slate-700 dark:text-slate-300 mb-1">Keterangan / Lokasi</label>
                        <input type="text" id="inputLocation" placeholder="Contoh: Balai Warga RT 10" class="w-full px-3 py-2 rounded-none border border-slate-200 dark:border-slate-600 text-xs bg-slate-50 dark:bg-slate-700 text-slate-800 dark:text-slate-100 focus:outline-none focus:border-emerald-600">
                    </div>

                    <div class="flex space-x-2 pt-2">
                        <button type="button" id="cancelCustomModal" class="w-1/2 bg-slate-200 dark:bg-slate-700 hover:bg-slate-300 text-slate-700 dark:text-slate-200 font-semibold py-2 rounded-none transition-all text-xs cursor-pointer">Batal</button>
                        <button type="submit" id="btnSubmitQR" class="w-1/2 bg-emerald-600 hover:bg-emerald-700 text-white font-semibold py-2 rounded-none shadow transition-all text-xs cursor-pointer">Generate & Simpan</button>
                    </div>
                </form>
            </div>
        </div>`;

        document.body.insertAdjacentHTML('beforeend', modalHTML);

        document.getElementById('closeCustomModal').addEventListener('click', window.closeTemplateModal);
        document.getElementById('cancelCustomModal').addEventListener('click', window.closeTemplateModal);
        document.getElementById('templateModal').addEventListener('click', (e) => {
            if (e.target.id === 'templateModal') window.closeTemplateModal();
        });

        const today = new Date().toISOString().split('T')[0];
        const dateInput = document.getElementById('inputDate');
        if (dateInput) dateInput.value = today;

        document.getElementById('templateForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const titleVal = document.getElementById('inputTitle').value.trim();
            const dateVal = document.getElementById('inputDate').value;
            const locationVal = document.getElementById('inputLocation').value.trim();
            const submitBtn = document.getElementById('btnSubmitQR');

            if (!titleVal || !dateVal) return;

            try {
                submitBtn.disabled = true;
                submitBtn.innerText = "Menyimpan...";

                const qrPayload = JSON.stringify({
                    agenda: titleVal,
                    tanggal: dateVal,
                    lokasi: locationVal,
                    timestamp: Date.now()
                });

                await addDoc(collection(db, "qrRapat"), {
                    title: titleVal,
                    date: dateVal,
                    location: locationVal,
                    payload: qrPayload,
                    createdAt: serverTimestamp()
                });

                e.target.reset();
                window.closeTemplateModal();
                if (typeof showToast === 'function') showToast("QR Code berhasil dibuat!");
            } catch (error) {
                alert("Gagal membuat QR Code: " + error.message);
            } finally {
                submitBtn.disabled = false;
                submitBtn.innerText = "Generate & Simpan";
            }
        });
    }

    window.openTemplateModal = function() {
        initBottomModal();
        const modal = document.getElementById('templateModal');
        const box = document.getElementById('templateModalBox');
        if (modal && box) {
            modal.classList.remove('hidden');
            setTimeout(() => {
                box.classList.remove('translate-y-full');
            }, 10);
        }
    }

    window.closeTemplateModal = function() {
        const modal = document.getElementById('templateModal');
        const box = document.getElementById('templateModalBox');
        if (modal && box) {
            box.classList.add('translate-y-full');
            setTimeout(() => {
                modal.classList.add('hidden');
                const form = document.getElementById('templateForm');
                if (form) form.reset();
            }, 300);
        }
    }

    window.deleteQR = async function(id) {
        if (confirm("Yakin ingin menghapus QR Code rapat ini?")) {
            try {
                await deleteDoc(doc(db, "qrRapat", id));
                if (typeof showToast === 'function') showToast("QR Code berhasil dihapus.");
            } catch (error) {
                alert("Gagal menghapus: " + error.message);
            }
        }
    }

    // Realtime Listener untuk Koleksi "qrRapat"
    onSnapshot(query(collection(db, "qrRapat"), orderBy("createdAt", "desc")), (snapshot) => {
        let deskHtml = "";
        let mobHtml = "";

        if (snapshot.empty) {
            const emptyMsg = '<div class="col-span-full p-6 bg-slate-50 dark:bg-slate-700/50 rounded-none border border-slate-200/70 dark:border-slate-700 shadow-sm text-center text-slate-400 text-xs">Belum ada QR Code rapat tersimpan.</div>';
            document.getElementById('desktopContentContainer').innerHTML = emptyMsg;
            document.getElementById('mobileContentContainer').innerHTML = emptyMsg;
            return;
        }

        snapshot.forEach((docSnap) => {
            const data = docSnap.data();
            const docId = docSnap.id;
            const title = data.title || '-';
            const date = data.date || '-';
            const location = data.location || '-';
            const payload = data.payload || title;

            const qrImageUrl = `https://api.qrserver.com/v1/create-qr-code/?size=250x250&data=${encodeURIComponent(payload)}`;

            deskHtml += `
                <div class="bg-white dark:bg-slate-800 rounded-none border border-slate-200 dark:border-slate-700 shadow-sm p-4 flex flex-col items-center text-center space-y-3">
                    <div class="w-full text-left border-b border-slate-100 dark:border-slate-700 pb-2">
                        <span class="text-[10px] text-emerald-600 dark:text-emerald-400 font-semibold"><i class="fa-regular fa-calendar mr-1"></i>${date}</span>
                        <h4 class="font-bold text-slate-800 dark:text-slate-100 text-xs truncate mt-0.5">${title}</h4>
                        <p class="text-[10px] text-slate-400 truncate"><i class="fa-solid fa-location-dot mr-1"></i>${location}</p>
                    </div>

                    <div onclick="window.openQrZoom('${title.replace(/'/g, "\\'")}', '${date}', '${location.replace(/'/g, "\\'")}', '${qrImageUrl}')" class="p-2 bg-white border border-slate-200 shadow-inner flex justify-center cursor-pointer hover:scale-105 transition-all group relative" title="Klik untuk memperbesar QR Code">
                        <img src="${qrImageUrl}" alt="QR Code" class="w-32 h-32 object-contain">
                        <div class="absolute inset-0 bg-black/10 opacity-0 group-hover:opacity-100 transition-opacity flex items-center justify-center">
                            <span class="bg-slate-900/80 text-white text-[9px] px-2 py-1 font-bold">Perbesar</span>
                        </div>
                    </div>

                    <div class="w-full flex space-x-2 pt-1">
                        <button type="button" onclick="window.deleteQR('${docId}')" class="w-full bg-red-50 dark:bg-red-950/50 hover:bg-red-100 text-red-600 dark:text-red-400 py-1.5 px-3 rounded-none text-xs font-semibold transition-all cursor-pointer flex items-center justify-center space-x-1">
                            <i class="fa-solid fa-trash text-[10px]"></i>
                            <span>Hapus</span>
                        </button>
                    </div>
                </div>
            `;

            mobHtml += `
                <div class="bg-white dark:bg-slate-800 rounded-none border border-slate-200 dark:border-slate-700 shadow-sm p-3 flex items-center space-x-3">
                    <div onclick="window.openQrZoom('${title.replace(/'/g, "\\'")}', '${date}', '${location.replace(/'/g, "\\'")}', '${qrImageUrl}')" class="p-1 bg-white border border-slate-200 shrink-0 cursor-pointer hover:opacity-80 transition-opacity" title="Klik untuk memperbesar">
                        <img src="${qrImageUrl}" alt="QR Code" class="w-16 h-16 object-contain">
                    </div>
                    <div class="flex-1 min-w-0 space-y-1">
                        <span class="text-[10px] text-emerald-600 dark:text-emerald-400 font-semibold"><i class="fa-regular fa-calendar mr-1"></i>${date}</span>
                        <h4 class="font-bold text-slate-800 dark:text-slate-100 text-xs truncate">${title}</h4>
                        <p class="text-[10px] text-slate-400 truncate">${location}</p>
                        <button type="button" onclick="window.deleteQR('${docId}')" class="text-red-600 dark:text-red-400 text-[10px] font-semibold flex items-center space-x-1 pt-1 cursor-pointer">
                            <i class="fa-solid fa-trash text-[9px]"></i>
                            <span>Hapus QR</span>
                        </button>
                    </div>
                </div>
            `;
        });

        document.getElementById('desktopContentContainer').innerHTML = deskHtml;
        document.getElementById('mobileContentContainer').innerHTML = mobHtml;
    });
</script>
