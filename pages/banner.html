<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Kelola Banner & Slider - RT 05</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts: Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        .no-scrollbar::-webkit-scrollbar {
            display: none !important;
            width: 0px !important;
            height: 0px !important;
        }
        .no-scrollbar {
            -ms-overflow-style: none !important;
            scrollbar-width: none !important;
        }
    </style>
</head>
<body class="bg-slate-900 font-['Inter'] flex justify-center items-center h-screen overflow-hidden m-0">

    <!-- Toast Notification -->
    <div id="toastNotification" class="fixed top-6 left-1/2 transform -translate-x-1/2 bg-slate-900/95 border border-slate-700 text-white px-4 py-2.5 rounded-2xl shadow-2xl text-xs font-medium flex items-center space-x-2 z-50 transition-all duration-300 opacity-0 pointer-events-none translate-y-[-20px]">
        <div class="w-5 h-5 rounded-full bg-emerald-500 text-white flex items-center justify-center text-[10px] shadow">
            <i class="fa-solid fa-check"></i>
        </div>
        <span id="toastText">Berhasil!</span>
    </div>

    <!-- Container HP Frame -->
    <div class="w-full h-screen sm:max-w-[400px] sm:h-[92vh] sm:max-h-[820px] bg-slate-50 sm:rounded-[35px] shadow-2xl flex flex-col justify-between relative overflow-hidden sm:border-[6px] sm:border-slate-800">
        
        <!-- Header -->
        <div class="bg-gradient-to-b from-emerald-600 to-emerald-700 text-white p-5 rounded-b-[28px] flex items-center justify-between shrink-0">
            <a href="manajemen.html" class="w-9 h-9 rounded-full bg-white/10 flex items-center justify-center text-white backdrop-blur-sm transition-all hover:bg-white/20">
                <i class="fa-solid fa-arrow-left text-xs"></i>
            </a>
            <h1 class="font-bold text-sm tracking-wide">Kelola Banner & Slider</h1>
            <div class="w-9"></div>
        </div>

        <!-- Content (Scrollable) -->
        <div class="p-4 flex-1 overflow-y-auto no-scrollbar pb-28 space-y-4 text-xs">
            
            <!-- Form Tambah Banner Langsung ke Firestore -->
            <div class="bg-white rounded-2xl p-4 shadow-sm border border-slate-200/65">
                <h2 class="font-bold text-slate-800 text-xs mb-3 pb-2 border-b border-slate-100 flex items-center justify-between">
                    <span class="flex items-center"><i class="fa-solid fa-plus-circle text-emerald-600 mr-2"></i> Tambah Banner ke Firestore</span>
                    <span id="formCounter" class="text-[10px] font-semibold text-slate-400">0/5 Banner</span>
                </h2>
                <form id="bannerForm" class="space-y-3">
                    <div>
                        <label class="block font-semibold text-slate-700 mb-1">Judul / Keterangan Banner</label>
                        <input type="text" id="bannerTitle" required placeholder="Contoh: Gotong Royong Kerja Bakti RT 05" class="w-full p-2.5 rounded-xl border border-slate-200 text-xs focus:outline-none focus:border-emerald-600 bg-slate-50">
                    </div>

                    <div>
                        <label class="block font-semibold text-slate-700 mb-1">Pilih File Foto (Max 500px)</label>
                        <input type="file" id="bannerFile" accept="image/*" required class="w-full text-xs text-slate-500 file:mr-3 file:py-2 file:px-3 file:rounded-xl file:border-0 file:text-xs file:font-semibold file:bg-emerald-50 file:text-emerald-700 hover:file:bg-emerald-100 cursor-pointer">
                        <span class="text-[9px] text-slate-400 mt-1 block">Foto di-resize max 500px dan langsung disimpan ke database Firestore.</span>
                    </div>

                    <!-- Area Preview Gambar Sebelum Upload -->
                    <div id="previewContainer" class="hidden space-y-1">
                        <label class="block font-semibold text-slate-700 text-[10px]">Preview Gambar:</label>
                        <div class="relative w-full h-32 bg-slate-100 rounded-xl overflow-hidden border border-slate-200 flex items-center justify-center">
                            <img id="imagePreview" src="" alt="Preview" class="w-full h-full object-cover">
                        </div>
                    </div>

                    <button type="submit" id="btnSubmit" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-semibold py-2.5 rounded-xl shadow-md shadow-emerald-600/35 transition-all cursor-pointer">
                        Simpan ke Firestore
                    </button>
                </form>
            </div>

            <!-- Daftar Banner Saat Ini -->
            <div class="bg-white rounded-2xl p-4 shadow-sm border border-slate-200/65 space-y-3">
                <h2 class="font-bold text-slate-800 text-xs pb-2 border-b border-slate-100 flex items-center justify-between">
                    <span>Daftar Banner Aktif</span>
                    <span id="bannerCount" class="bg-emerald-100 text-emerald-700 px-2 py-0.5 rounded-full text-[10px]">0 / 5 Max</span>
                </h2>

                <div id="bannerListContainer" class="space-y-3">
                    <p class="text-slate-400 text-center py-4">Memuat data banner...</p>
                </div>
            </div>

        </div>

        <!-- Tempat Include Bottom Navigation -->
        <div id="nav-container"></div>

    </div>

    <!-- Skrip Utama Firestore -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, addDoc, deleteDoc, doc, onSnapshot, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";
        import { renderNavigation } from "../assets/js/navigation.js";

        // Render Navigasi Bawah
        document.getElementById('nav-container').innerHTML = renderNavigation('home', true);

        // Toast Notification
        window.showToast = function(message) {
            const toast = document.getElementById('toastNotification');
            const toastText = document.getElementById('toastText');
            toastText.innerText = message;
            toast.classList.remove('opacity-0', 'pointer-events-none', 'translate-y-[-20px]');
            toast.classList.add('opacity-100', 'translate-y-0');
            setTimeout(() => {
                toast.classList.remove('opacity-100', 'translate-y-0');
                toast.classList.add('opacity-0', 'pointer-events-none', 'translate-y-[-20px]');
            }, 1800);
        }

        // Konfigurasi Firebase
        const firebaseConfig = {
            apiKey: "AIzaSyBx2AF0YRpOEq--q__dn39NwiNCKXvKutM",
            authDomain: "erte-979ca.firebaseapp.com",
            projectId: "erte-979ca",
            storageBucket: "erte-979ca.firebasestorage.app",
            messagingSenderId: "329513636032",
            appId: "1:329513636032:web:25a10b627b91db2bbb5d25"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        const bannerForm = document.getElementById('bannerForm');
        const bannerTitle = document.getElementById('bannerTitle');
        const bannerFile = document.getElementById('bannerFile');
        const previewContainer = document.getElementById('previewContainer');
        const imagePreview = document.getElementById('imagePreview');
        const btnSubmit = document.getElementById('btnSubmit');
        const bannerListContainer = document.getElementById('bannerListContainer');
        const bannerCount = document.getElementById('bannerCount');
        const formCounter = document.getElementById('formCounter');

        let currentBannerCount = 0;

        // Event Listener untuk memunculkan Preview saat file dipilih
        bannerFile.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = (event) => {
                    imagePreview.src = event.target.result;
                    previewContainer.classList.remove('hidden');
                };
                reader.readAsDataURL(file);
            } else {
                previewContainer.classList.add('hidden');
                imagePreview.src = "";
            }
        });

        // Fungsi Resize Gambar ke Maksimal 500px Menggunakan Canvas HTML5
        function resizeImage(file, maxSize = 500) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.readAsDataURL(file);
                reader.onload = (event) => {
                    const img = new Image();
                    img.src = event.target.result;
                    img.onload = () => {
                        let width = img.width;
                        let height = img.height;

                        if (width > height) {
                            if (width > maxSize) {
                                height *= maxSize / width;
                                width = maxSize;
                            }
                        } else {
                            if (height > maxSize) {
                                width *= maxSize / height;
                                height = maxSize;
                            }
                        }

                        const canvas = document.createElement('canvas');
                        canvas.width = width;
                        canvas.height = height;
                        const ctx = canvas.getContext('2d');
                        ctx.drawImage(img, 0, 0, width, height);

                        resolve(canvas.toDataURL('image/jpeg', 0.75));
                    };
                    img.onerror = (error) => reject(error);
                };
                reader.onerror = (error) => reject(error);
            });
        }

        // Ambil Data Banner secara Real-time dari Firestore
        onSnapshot(collection(db, "banners"), (snapshot) => {
            let bannersHTML = "";
            currentBannerCount = snapshot.size;
            bannerCount.innerText = `${currentBannerCount} / 5 Max`;
            formCounter.innerText = `${currentBannerCount}/5 Banner`;

            if (currentBannerCount >= 5) {
                btnSubmit.disabled = true;
                btnSubmit.classList.add('bg-slate-400', 'cursor-not-allowed');
                btnSubmit.classList.remove('bg-emerald-600', 'hover:bg-emerald-700', 'cursor-pointer');
                btnSubmit.innerText = "Batas Maksimal 5 Banner Tercapai";
            } else {
                btnSubmit.disabled = false;
                btnSubmit.classList.remove('bg-slate-400', 'cursor-not-allowed');
                btnSubmit.classList.add('bg-emerald-600', 'hover:bg-emerald-700', 'cursor-pointer');
                btnSubmit.innerText = "Simpan ke Firestore";
            }

            if (currentBannerCount === 0) {
                bannerListContainer.innerHTML = `<p class="text-slate-400 text-center py-4">Belum ada banner tersimpan.</p>`;
                return;
            }

            snapshot.forEach((docSnap) => {
                const data = docSnap.data();
                const id = docSnap.id;
                bannersHTML += `
                    <div class="flex items-center justify-between p-2.5 bg-slate-50 rounded-xl border border-slate-200/80">
                        <div class="flex items-center space-x-3 overflow-hidden">
                            <img src="${data.imageUrl}" alt="${data.title}" class="w-12 h-10 object-cover rounded-lg shrink-0 border border-slate-200">
                            <div class="overflow-hidden">
                                <h4 class="font-bold text-slate-800 text-[11px] truncate">${data.title}</h4>
                                <span class="text-[9px] text-slate-400 truncate block">Tersimpan di Firestore</span>
                            </div>
                        </div>
                        <button type="button" onclick="deleteBanner('${id}')" class="w-7 h-7 rounded-lg bg-red-50 text-red-600 hover:bg-red-600 hover:text-white flex items-center justify-center text-xs transition-all shrink-0 cursor-pointer" title="Hapus Banner">
                            <i class="fa-solid fa-trash-can"></i>
                        </button>
                    </div>
                `;
            });

            bannerListContainer.innerHTML = bannersHTML;
        });

        // Proses Submit & Simpan Langsung ke Firestore
        bannerForm.addEventListener('submit', async (e) => {
            e.preventDefault();

            if (currentBannerCount >= 5) {
                alert("Maksimal banner adalah 5 foto.");
                return;
            }

            const title = bannerTitle.value.trim();
            const file = bannerFile.files[0];

            if (!file) {
                alert("Pilih file gambar terlebih dahulu!");
                return;
            }

            btnSubmit.disabled = true;
            btnSubmit.innerText = "Mengompres & Menyimpan...";

            try {
                const resizedBase64 = await resizeImage(file, 500);

                await addDoc(collection(db, "banners"), {
                    title: title,
                    imageUrl: resizedBase64,
                    createdAt: serverTimestamp()
                });

                bannerTitle.value = "";
                bannerFile.value = "";
                previewContainer.classList.add('hidden');
                imagePreview.src = "";
                showToast('Banner berhasil disimpan ke Firestore!');
            } catch (error) {
                alert("Gagal menyimpan banner: " + error.message);
            } finally {
                if (currentBannerCount < 5) {
                    btnSubmit.disabled = false;
                    btnSubmit.innerText = "Simpan ke Firestore";
                }
            }
        });

        // Fungsi Hapus Banner dari Firestore
        window.deleteBanner = async function(id) {
            if (confirm("Apakah Anda yakin ingin menghapus banner ini?")) {
                try {
                    await deleteDoc(doc(db, "banners", id));
                    showToast('Banner berhasil dihapus!');
                } catch (error) {
                    alert("Gagal menghapus banner: " + error.message);
                }
            }
        };
    </script>
</body>
</html>
