<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Kelola Running Text - RT 05</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts: Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        .no-scrollbar::-webkit-scrollbar {
            display: none !important;
            width: 0px !important;
            height: 0px !important;
        }
        .no-scrollbar {
            -ms-overflow-style: none !important;
            scrollbar-width: none !important;
        }
    </style>
</head>
<body class="bg-slate-900 font-['Inter'] flex justify-center items-center h-screen overflow-hidden m-0">

    <!-- Toast Notification -->
    <div id="toastNotification" class="fixed top-6 left-1/2 transform -translate-x-1/2 bg-slate-900/95 border border-slate-700 text-white px-4 py-2.5 rounded-2xl shadow-2xl text-xs font-medium flex items-center space-x-2 z-50 transition-all duration-300 opacity-0 pointer-events-none translate-y-[-20px]">
        <div class="w-5 h-5 rounded-full bg-emerald-500 text-white flex items-center justify-center text-[10px] shadow">
            <i class="fa-solid fa-check"></i>
        </div>
        <span id="toastText">Berhasil!</span>
    </div>

    <!-- Container HP Frame -->
    <div class="w-full h-screen sm:max-w-[400px] sm:h-[92vh] sm:max-h-[820px] bg-slate-50 sm:rounded-[35px] shadow-2xl flex flex-col justify-between relative overflow-hidden sm:border-[6px] sm:border-slate-800">
        
        <!-- Header -->
        <div class="bg-gradient-to-b from-emerald-600 to-emerald-700 text-white p-5 rounded-b-[28px] flex items-center justify-between shrink-0">
            <a href="manajemen.html" class="w-9 h-9 rounded-full bg-white/10 flex items-center justify-center text-white backdrop-blur-sm transition-all hover:bg-white/20">
                <i class="fa-solid fa-arrow-left text-xs"></i>
            </a>
            <h1 class="font-bold text-sm tracking-wide">Kelola Running Text</h1>
            <div class="w-9"></div>
        </div>

        <!-- Content (Scrollable) -->
        <div class="p-4 flex-1 overflow-y-auto no-scrollbar pb-28 space-y-4 text-xs">
            
            <!-- Info Card Preview -->
            <div class="bg-white rounded-2xl p-4 shadow-sm border border-slate-200/60 space-y-2">
                <label class="block font-bold text-slate-800">Preview Tampilan Saat Ini:</label>
                <div class="bg-emerald-800 text-white py-1.5 px-3 rounded-xl text-[10px] flex items-center overflow-hidden">
                    <span class="bg-emerald-900 text-white font-bold px-1.5 py-0.5 rounded text-[9px] mr-2 shrink-0 flex items-center">
                        <i class="fa-solid fa-bullhorn mr-1 text-amber-300"></i> Info RT:
                    </span>
                    <marquee behavior="scroll" direction="left" scrollamount="4" id="previewMarquee" class="font-medium">
                        Memuat pengumuman...
                    </marquee>
                </div>
            </div>

            <!-- Form Edit Running Text -->
            <div class="bg-white rounded-2xl p-4 shadow-sm border border-slate-200/60">
                <form id="runningTextForm" class="space-y-3">
                    <div>
                        <label class="block font-semibold text-slate-700 mb-1">Isi Pengumuman Running Text</label>
                        <textarea id="runningTextInput" rows="4" required placeholder="Masukkan teks pengumuman RT di sini..." class="w-full p-3 rounded-xl border border-slate-200 text-xs focus:outline-none focus:border-emerald-600 bg-slate-50 resize-none"></textarea>
                        <span class="text-[10px] text-slate-400 mt-1 block">Teks ini akan tersimpan di database dan berjalan otomatis di halaman beranda warga.</span>
                    </div>

                    <button type="submit" id="btnSubmit" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-semibold py-2.5 rounded-xl shadow-md shadow-emerald-600/35 transition-all cursor-pointer">
                        Simpan ke Database
                    </button>
                </form>
            </div>

        </div>

        <!-- Tempat Include Bottom Navigation -->
        <div id="nav-container"></div>

    </div>

    <!-- Skrip Utama Firestore -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, doc, getDoc, setDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";
        import { renderNavigation } from "../assets/js/navigation.js";

        // Render Navigasi Bawah
        document.getElementById('nav-container').innerHTML = renderNavigation('home', true);

        // Toast Notification
        window.showToast = function(message) {
            const toast = document.getElementById('toastNotification');
            const toastText = document.getElementById('toastText');
            toastText.innerText = message;
            toast.classList.remove('opacity-0', 'pointer-events-none', 'translate-y-[-20px]');
            toast.classList.add('opacity-100', 'translate-y-0');
            setTimeout(() => {
                toast.classList.remove('opacity-100', 'translate-y-0');
                toast.classList.add('opacity-0', 'pointer-events-none', 'translate-y-[-20px]');
            }, 1800);
        }

        // Konfigurasi Firebase
        const firebaseConfig = {
            apiKey: "AIzaSyBx2AF0YRpOEq--q__dn39NwiNCKXvKutM",
            authDomain: "erte-979ca.firebaseapp.com",
            projectId: "erte-979ca",
            storageBucket: "erte-979ca.firebasestorage.app",
            messagingSenderId: "329513636032",
            appId: "1:329513636032:web:25a10b627b91db2bbb5d25"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        const runningTextInput = document.getElementById('runningTextInput');
        const previewMarquee = document.getElementById('previewMarquee');
        const btnSubmit = document.getElementById('btnSubmit');

        const defaultText = "Selamat datang di Aplikasi RT-Ku RT 05 Harapan Jaya • Jadwal Ronda Malam ini Wajib Hadir • Pembayaran Iuran Kas RT paling lambat tanggal 20 setiap bulannya.";

        // Ambil data dari Firestore saat halaman dimuat
        async function loadRunningText() {
            try {
                const docRef = doc(db, "settings", "runningText");
                const docSnap = await getDoc(docRef);
                if (docSnap.exists() && docSnap.data().text) {
                    const text = docSnap.data().text;
                    runningTextInput.value = text;
                    previewMarquee.innerText = text;
                } else {
                    runningTextInput.value = defaultText;
                    previewMarquee.innerText = defaultText;
                }
            } catch (error) {
                console.error("Gagal memuat data:", error);
                runningTextInput.value = defaultText;
                previewMarquee.innerText = defaultText;
            }
        }

        loadRunningText();

        // Simpan perubahan ke Firestore
        const form = document.getElementById('runningTextForm');
        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            const newText = runningTextInput.value.trim();
            btnSubmit.disabled = true;
            btnSubmit.innerText = "Menyimpan...";

            try {
                await setDoc(doc(db, "settings", "runningText"), {
                    text: newText,
                    updatedAt: new Date()
                });

                previewMarquee.innerText = newText;
                showToast('Running text berhasil disimpan ke Database!');
            } catch (error) {
                alert("Gagal menyimpan ke database: " + error.message);
            } finally {
                btnSubmit.disabled = false;
                btnSubmit.innerText = "Simpan ke Database";
            }
        });
    </script>
</body>
</html>
