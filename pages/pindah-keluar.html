<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Warga Pindah Keluar - Aplikasi RT-Ku</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts: Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        .no-scrollbar::-webkit-scrollbar {
            display: none !important;
            width: 0px !important;
            height: 0px !important;
        }
        .no-scrollbar {
            -ms-overflow-style: none !important;
            scrollbar-width: none !important;
        }
    </style>
</head>
<body class="bg-slate-900 font-['Inter'] flex justify-center items-center h-screen overflow-hidden m-0">

    <!-- Toast Notification -->
    <div id="toastNotification" class="fixed top-6 left-1/2 transform -translate-x-1/2 bg-slate-900/95 border border-slate-700 text-white px-4 py-2.5 rounded-none shadow-2xl text-xs font-medium flex items-center space-x-2 z-50 transition-all duration-300 opacity-0 pointer-events-none translate-y-[-20px]">
        <div class="w-5 h-5 rounded-none bg-emerald-500 text-white flex items-center justify-center text-[10px] shadow">
            <i class="fa-solid fa-check"></i>
        </div>
        <span id="toastText">Berhasil!</span>
    </div>

    <!-- Container HP Frame -->
    <div class="w-full h-screen sm:max-w-[400px] sm:h-[92vh] sm:max-h-[820px] bg-slate-50 sm:rounded-none shadow-2xl flex flex-col justify-between relative overflow-hidden sm:border-[6px] sm:border-slate-800">
        
        <!-- Header -->
        <div class="bg-gradient-to-b from-emerald-600 to-emerald-700 text-white p-4 rounded-none flex items-center justify-between shrink-0 z-20">
            <a href="data-warga.html" class="w-9 h-9 rounded-none bg-white/10 flex items-center justify-center text-white backdrop-blur-sm transition-all hover:bg-white/20">
                <i class="fa-solid fa-arrow-left text-xs"></i>
            </a>
            <h1 class="font-bold text-sm tracking-wide">Warga Pindah Keluar</h1>
            <div class="w-9"></div>
        </div>

        <!-- Content (Scrollable) -->
        <div class="p-4 flex-1 overflow-y-auto no-scrollbar space-y-4 text-xs">
            
            <!-- Form Input -->
            <div class="bg-white rounded-none p-4 shadow-sm border border-slate-200/70">
                <h2 id="formTitle" class="font-bold text-slate-800 text-xs mb-3 pb-2 border-b border-slate-100 flex items-center justify-between">
                    <span class="flex items-center"><i class="fa-solid fa-person-walking-arrow-right text-emerald-600 mr-2"></i> Catat Pindah Keluar</span>
                    <button type="button" id="btnCancelEdit" onclick="resetForm()" class="hidden text-[10px] text-red-500 hover:underline">Batal Edit</button>
                </h2>
                <form id="pindahKeluarForm" class="space-y-3">
                    <input type="hidden" id="editId" value="">
                    
                    <div>
                        <label class="block font-semibold text-slate-700 mb-1">Nama Kepala Keluarga / Warga</label>
                        <input type="text" id="namaWarga" required placeholder="Nama lengkap" class="w-full p-2.5 rounded-none border border-slate-200 text-xs focus:outline-none focus:border-emerald-600 bg-slate-50">
                    </div>

                    <div class="grid grid-cols-2 gap-2">
                        <div>
                            <label class="block font-semibold text-slate-700 mb-1">Jumlah Anggota</label>
                            <input type="number" id="jumlahAnggota" required placeholder="Contoh: 3" class="w-full p-2.5 rounded-none border border-slate-200 text-xs focus:outline-none focus:border-emerald-600 bg-slate-50">
                        </div>
                        <div>
                            <label class="block font-semibold text-slate-700 mb-1">Tanggal Keluar</label>
                            <input type="date" id="tanggalKeluar" required class="w-full p-2.5 rounded-none border border-slate-200 text-xs focus:outline-none focus:border-emerald-600 bg-slate-50">
                        </div>
                    </div>

                    <div>
                        <label class="block font-semibold text-slate-700 mb-1">Alamat Tujuan Pindah Baru</label>
                        <input type="text" id="alamatTujuan" required placeholder="Contoh: Perumahan Indah Blok A No. 5" class="w-full p-2.5 rounded-none border border-slate-200 text-xs focus:outline-none focus:border-emerald-600 bg-slate-50">
                    </div>

                    <div>
                        <label class="block font-semibold text-slate-700 mb-1">Upload Surat Pindah / Keterangan (Max 500px)</label>
                        <input type="file" id="suratFile" accept="image/*" class="w-full text-xs text-slate-500 file:mr-3 file:py-2 file:px-3 file:rounded-none file:border-0 file:text-xs file:font-semibold file:bg-emerald-50 file:text-emerald-700 hover:file:bg-emerald-100 cursor-pointer">
                    </div>

                    <!-- Preview Gambar -->
                    <div id="previewContainer" class="hidden space-y-1">
                        <label class="block font-semibold text-slate-700 text-[10px]">Preview Dokumen:</label>
                        <div class="relative w-full h-32 bg-slate-100 rounded-none overflow-hidden border border-slate-200 flex items-center justify-center">
                            <img id="imagePreview" src="" alt="Preview" class="w-full h-full object-cover">
                        </div>
                    </div>

                    <button type="submit" id="btnSubmit" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-semibold py-2.5 rounded-none shadow-md transition-all cursor-pointer">
                        Simpan Data Pindah Keluar
                    </button>
                </form>
            </div>

            <!-- Riwayat Data -->
            <div class="bg-white rounded-none p-4 shadow-sm border border-slate-200/70 space-y-3">
                <h2 class="font-bold text-slate-800 text-xs pb-2 border-b border-slate-100 flex items-center justify-between">
                    <span>Riwayat Warga Pindah Keluar</span>
                    <span id="dataCount" class="bg-emerald-100 text-emerald-700 px-2 py-0.5 rounded-none text-[10px]">0 Total</span>
                </h2>

                <div id="dataListContainer" class="space-y-3">
                    <p class="text-slate-400 text-center py-4">Memuat data pindah keluar...</p>
                </div>
            </div>

        </div>

    </div>

    <!-- Skrip Firestore -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, addDoc, updateDoc, deleteDoc, doc, onSnapshot, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        window.showToast = function(message) {
            const toast = document.getElementById('toastNotification');
            const toastText = document.getElementById('toastText');
            toastText.innerText = message;
            toast.classList.remove('opacity-0', 'pointer-events-none', 'translate-y-[-20px]');
            toast.classList.add('opacity-100', 'translate-y-0');
            setTimeout(() => {
                toast.classList.remove('opacity-100', 'translate-y-0');
                toast.classList.add('opacity-0', 'pointer-events-none', 'translate-y-[-20px]');
            }, 1800);
        }

        const firebaseConfig = {
            apiKey: "AIzaSyBx2AF0YRpOEq--q__dn39NwiNCKXvKutM",
            authDomain: "erte-979ca.firebaseapp.com",
            projectId: "erte-979ca",
            storageBucket: "erte-979ca.firebasestorage.app",
            messagingSenderId: "329513636032",
            appId: "1:329513636032:web:25a10b627b91db2bbb5d25"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        const form = document.getElementById('pindahKeluarForm');
        const editId = document.getElementById('editId');
        const namaWarga = document.getElementById('namaWarga');
        const jumlahAnggota = document.getElementById('jumlahAnggota');
        const tanggalKeluar = document.getElementById('tanggalKeluar');
        const alamatTujuan = document.getElementById('alamatTujuan');
        const suratFile = document.getElementById('suratFile');
        const previewContainer = document.getElementById('previewContainer');
        const imagePreview = document.getElementById('imagePreview');
        const btnSubmit = document.getElementById('btnSubmit');
        const btnCancelEdit = document.getElementById('btnCancelEdit');
        const formTitle = document.getElementById('formTitle');
        const dataListContainer = document.getElementById('dataListContainer');
        const dataCount = document.getElementById('dataCount');

        let allData = [];

        suratFile.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = (event) => {
                    imagePreview.src = event.target.result;
                    previewContainer.classList.remove('hidden');
                };
                reader.readAsDataURL(file);
            } else {
                previewContainer.classList.add('hidden');
                imagePreview.src = "";
            }
        });

        function resizeImage(file, maxSize = 500) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.readAsDataURL(file);
                reader.onload = (event) => {
                    const img = new Image();
                    img.src = event.target.result;
                    img.onload = () => {
                        let width = img.width;
                        let height = img.height;
                        if (width > height) {
                            if (width > maxSize) { height *= maxSize / width; width = maxSize; }
                        } else {
                            if (height > maxSize) { width *= maxSize / height; height = maxSize; }
                        }
                        const canvas = document.createElement('canvas');
                        canvas.width = width;
                        canvas.height = height;
                        const ctx = canvas.getContext('2d');
                        ctx.drawImage(img, 0, 0, width, height);
                        resolve(canvas.toDataURL('image/jpeg', 0.75));
                    };
                    img.onerror = (error) => reject(error);
                };
                reader.onerror = (error) => reject(error);
            });
        }

        onSnapshot(collection(db, "pindahKeluar"), (snapshot) => {
            allData = [];
            snapshot.forEach((docSnap) => {
                allData.push({ id: docSnap.id, ...docSnap.data() });
            });

            dataCount.innerText = `${allData.length} Total`;
            if (allData.length === 0) {
                dataListContainer.innerHTML = `<p class="text-slate-400 text-center py-4">Belum ada data pindah keluar.</p>`;
                return;
            }

            let html = "";
            allData.forEach((data) => {
                const tglFormatted = data.tanggalKeluar ? new Date(data.tanggalKeluar).toLocaleDateString('id-ID', { day: 'numeric', month: 'short', year: 'numeric' }) : '-';
                html += `
                    <div class="flex items-center justify-between p-2.5 bg-slate-50 rounded-none border border-slate-200/80">
                        <div class="flex items-center space-x-3 overflow-hidden">
                            ${data.suratUrl ? `<img src="${data.suratUrl}" alt="Dokumen" class="w-12 h-10 object-cover rounded-none shrink-0 border border-slate-200">` : `<div class="w-12 h-10 bg-slate-200 flex items-center justify-center text-slate-400 shrink-0"><i class="fa-solid fa-file-lines text-xs"></i></div>`}
                            <div class="overflow-hidden">
                                <h4 class="font-bold text-slate-800 text-[11px] truncate">${data.nama} (${data.jumlah} Jiwa)</h4>
                                <p class="text-[9px] text-slate-500">Keluar: ${tglFormatted}</p>
                                <span class="text-[8px] bg-slate-200 text-slate-700 px-1.5 py-0.2 rounded-none font-medium inline-block mt-0.5 truncate max-w-[160px]">Tujuan: ${data.alamatTujuan}</span>
                            </div>
                        </div>
                        <div class="flex items-center space-x-1 shrink-0">
                            <button type="button" onclick="editData('${data.id}')" class="w-7 h-7 rounded-none bg-blue-50 text-blue-600 hover:bg-blue-600 hover:text-white flex items-center justify-center text-xs transition-all cursor-pointer"><i class="fa-solid fa-pen-to-square"></i></button>
                            <button type="button" onclick="deleteData('${data.id}')" class="w-7 h-7 rounded-none bg-red-50 text-red-600 hover:bg-red-600 hover:text-white flex items-center justify-center text-xs transition-all cursor-pointer"><i class="fa-solid fa-trash-can"></i></button>
                        </div>
                    </div>
                `;
            });
            dataListContainer.innerHTML = html;
        });

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            const id = editId.value;
            const nama = namaWarga.value.trim();
            const jumlah = jumlahAnggota.value.trim();
            const tgl = tanggalKeluar.value;
            const tujuan = alamatTujuan.value.trim();
            const file = suratFile.files[0];

            btnSubmit.disabled = true;
            btnSubmit.innerText = "Memproses...";

            try {
                if (id) {
                    let updateData = { nama, jumlah, tanggalKeluar: tgl, alamatTujuan: tujuan };
                    if (file) updateData.suratUrl = await resizeImage(file, 500);
                    await updateDoc(doc(db, "pindahKeluar", id), updateData);
                    showToast('Data berhasil diperbarui!');
                } else {
                    let suratUrl = file ? await resizeImage(file, 500) : "";
                    await addDoc(collection(db, "pindahKeluar"), {
                        nama, jumlah, tanggalKeluar: tgl, alamatTujuan: tujuan, suratUrl, createdAt: serverTimestamp()
                    });
                    showToast('Data berhasil disimpan!');
                }
                resetForm();
            } catch (error) {
                alert("Gagal menyimpan: " + error.message);
            } finally {
                btnSubmit.disabled = false;
                btnSubmit.innerText = "Simpan Data Pindah Keluar";
            }
        });

        window.editData = function(id) {
            const item = allData.find(d => d.id === id);
            if (item) {
                editId.value = item.id;
                namaWarga.value = item.nama;
                jumlahAnggota.value = item.jumlah;
                tanggalKeluar.value = item.tanggalKeluar || "";
                alamatTujuan.value = item.alamatTujuan || "";
                if (item.suratUrl) {
                    imagePreview.src = item.suratUrl;
                    previewContainer.classList.remove('hidden');
                } else {
                    previewContainer.classList.add('hidden');
                    imagePreview.src = "";
                }
                formTitle.innerHTML = `<span class="flex items-center text-blue-600"><i class="fa-solid fa-pen-to-square mr-2"></i> Edit Pindah Keluar</span>`;
                btnSubmit.innerText = "Perbarui Data";
                btnCancelEdit.classList.remove('hidden');
                window.scrollTo({ top: 0, behavior: 'smooth' });
            }
        }

        window.resetForm = function() {
            editId.value = "";
            namaWarga.value = "";
            jumlahAnggota.value = "";
            tanggalKeluar.value = "";
            alamatTujuan.value = "";
            suratFile.value = "";
            previewContainer.classList.add('hidden');
            imagePreview.src = "";
            formTitle.innerHTML = `<span class="flex items-center"><i class="fa-solid fa-person-walking-arrow-right text-emerald-600 mr-2"></i> Catat Pindah Keluar</span>`;
            btnSubmit.innerText = "Simpan Data Pindah Keluar";
            btnCancelEdit.classList.add('hidden');
        }

        window.deleteData = async function(id) {
            if (confirm("Hapus data ini?")) {
                try {
                    await deleteDoc(doc(db, "pindahKeluar", id));
                    showToast('Data berhasil dihapus!');
                    if (editId.value === id) resetForm();
                } catch (error) {
                    alert("Gagal menghapus: " + error.message);
                }
            }
        }
    </script>
</body>
</html>
