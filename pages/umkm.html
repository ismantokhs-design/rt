<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Kelola UMKM Saya - Aplikasi RT-Ku</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts: Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        .no-scrollbar::-webkit-scrollbar {
            display: none !important;
            width: 0px !important;
            height: 0px !important;
        }
        .no-scrollbar {
            -ms-overflow-style: none !important;
            scrollbar-width: none !important;
        }
    </style>
</head>
<body class="bg-slate-900 font-['Inter'] flex justify-center items-center h-screen overflow-hidden m-0">

    <!-- Toast Notification -->
    <div id="toastNotification" class="fixed top-6 left-1/2 transform -translate-x-1/2 bg-slate-900/95 border border-slate-700 text-white px-4 py-2.5 rounded-none shadow-2xl text-xs font-medium flex items-center space-x-2 z-50 transition-all duration-300 opacity-0 pointer-events-none translate-y-[-20px]">
        <div class="w-5 h-5 rounded-none bg-emerald-500 text-white flex items-center justify-center text-[10px] shadow">
            <i class="fa-solid fa-check"></i>
        </div>
        <span id="toastText">Berhasil!</span>
    </div>

    <!-- Container HP Frame -->
    <div class="w-full h-screen sm:max-w-[400px] sm:h-[92vh] sm:max-h-[820px] bg-slate-50 sm:rounded-none shadow-2xl flex flex-col justify-between relative overflow-hidden sm:border-[6px] sm:border-slate-800">
        
        <!-- Header Navigasi Atas -->
        <div class="bg-gradient-to-b from-emerald-600 to-emerald-700 text-white p-4 rounded-none flex items-center justify-between shrink-0 z-20">
            <a href="../home.html" class="w-9 h-9 rounded-none bg-white/10 flex items-center justify-center text-white backdrop-blur-sm transition-all hover:bg-white/20">
                <i class="fa-solid fa-arrow-left text-xs"></i>
            </a>
            <h1 class="font-bold text-sm tracking-wide">Kelola UMKM Saya</h1>
            <a href="umkm-view.html" class="w-9 h-9 rounded-none bg-white/10 flex items-center justify-center text-white backdrop-blur-sm transition-all hover:bg-white/20" title="Lihat Katalog Umum">
                <i class="fa-solid fa-store text-xs"></i>
            </a>
        </div>

        <!-- Bagian Utama yang Scrollable -->
        <div class="p-4 flex-1 overflow-y-auto no-scrollbar space-y-4">
            
            <!-- Info Card -->
            <div class="bg-emerald-50 border border-emerald-200/60 rounded-none p-2.5 flex items-start space-x-2.5">
                <div class="w-7 h-7 rounded-none bg-emerald-600 text-white flex items-center justify-center shrink-0 text-xs shadow-md">
                    <i class="fa-solid fa-store"></i>
                </div>
                <div>
                    <h2 class="font-bold text-emerald-900 text-xs">Manajemen Produk UMKM Anda</h2>
                    <p class="text-[10px] text-emerald-700 leading-tight">Kelola produk Anda. Data yang sudah tersimpan di database akan otomatis tampil kembali di sini.</p>
                </div>
            </div>

            <!-- Form Data Pemilik & Daftar Produk -->
            <div class="bg-white p-3.5 border border-slate-200 shadow-sm rounded-none space-y-2.5">
                <h3 class="font-bold text-slate-800 text-xs pb-1.5 border-b border-slate-100 flex items-center justify-between">
                    <span class="flex items-center"><i class="fa-solid fa-circle-plus text-emerald-600 mr-1.5"></i> Input & Kelola Produk</span>
                    <span id="activeUserBadge" class="text-[9px] bg-slate-100 text-slate-600 px-2 py-0.5 font-semibold">Memuat akun...</span>
                </h3>

                <form id="umkmForm" class="space-y-2.5">
                    <div class="grid grid-cols-2 gap-2">
                        <div>
                            <label class="block text-[10px] font-semibold text-slate-700 mb-0.5">Nama Pemilik / Warga</label>
                            <input type="text" id="namaPemilik" required placeholder="Nama Lengkap" class="w-full px-2.5 py-1.5 rounded-none border border-slate-200 text-xs bg-slate-50 focus:outline-none focus:border-emerald-600" onchange="checkAndReloadProducts()">
                        </div>
                        <div>
                            <label class="block text-[10px] font-semibold text-slate-700 mb-0.5">No. WhatsApp (08... / 628...)</label>
                            <input type="tel" id="noWa" required placeholder="081234567890" class="w-full px-2.5 py-1.5 rounded-none border border-slate-200 text-xs bg-slate-50 focus:outline-none focus:border-emerald-600">
                        </div>
                    </div>

                    <div class="flex items-center justify-between pt-1">
                        <span class="font-bold text-slate-800 text-xs flex items-center">
                            <i class="fa-solid fa-boxes-stacked text-emerald-600 mr-1.5"></i> Daftar Produk Anda
                        </span>
                        <button type="button" onclick="addProductRow()" class="text-[10px] bg-emerald-100 text-emerald-700 font-semibold px-2 py-1 rounded-none hover:bg-emerald-200 transition-all cursor-pointer">
                            <i class="fa-solid fa-plus mr-1"></i> Tambah Baris
                        </button>
                    </div>

                    <!-- Container Baris Produk Multi Input -->
                    <div id="productRowsContainer" class="space-y-2.5 pb-2">
                        <!-- Baris produk dinamis -->
                    </div>

                    <button type="submit" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-semibold py-2.5 rounded-none shadow-md shadow-emerald-600/35 transition-all text-xs cursor-pointer mt-2">
                        Simpan Perubahan / Produk Baru
                    </button>
                </form>
            </div>

        </div>

    </div>

    <!-- Skrip Utama Firestore & Auth -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { getFirestore, collection, getDocs, addDoc, updateDoc, deleteDoc, doc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        // Toast Notification
        window.showToast = function(message) {
            const toast = document.getElementById('toastNotification');
            const toastText = document.getElementById('toastText');
            toastText.innerText = message;
            toast.classList.remove('opacity-0', 'pointer-events-none', 'translate-y-[-20px]');
            toast.classList.add('opacity-100', 'translate-y-0');
            setTimeout(() => {
                toast.classList.remove('opacity-100', 'translate-y-0');
                toast.classList.add('opacity-0', 'pointer-events-none', 'translate-y-[-20px]');
            }, 1800);
        }

        // Konfigurasi Firebase
        const firebaseConfig = {
            apiKey: "AIzaSyBx2AF0YRpOEq--q__dn39NwiNCKXvKutM",
            authDomain: "erte-979ca.firebaseapp.com",
            projectId: "erte-979ca",
            storageBucket: "erte-979ca.firebasestorage.app",
            messagingSenderId: "329513636032",
            appId: "1:329513636032:web:25a10b627b91db2bbb5d25"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        const umkmForm = document.getElementById('umkmForm');
        const namaPemilikInput = document.getElementById('namaPemilik');
        const noWaInput = document.getElementById('noWa');
        const productRowsContainer = document.getElementById('productRowsContainer');
        const activeUserBadge = document.getElementById('activeUserBadge');

        let currentUserEmail = "";

        // Fungsi Format Angka ke Format Ribuan (Titik)
        window.formatRupiah = function(input) {
            let value = input.value.replace(/[^,\d]/g, '').toString();
            let split = value.split(',');
            let sisa = split[0].length % 3;
            let rupiah = split[0].substr(0, sisa);
            let ribuan = split[0].substr(sisa).match(/\d{3}/gi);

            if (ribuan) {
                let separator = sisa ? '.' : '';
                rupiah += separator + ribuan.join('.');
            }

            rupiah = split[1] !== undefined ? rupiah + ',' + split[1] : rupiah;
            input.value = rupiah;
        };

        // Fungsi Menambah Baris Input Produk
        window.addProductRow = function(data = {}) {
            const rowId = 'row_' + Date.now() + Math.random().toString(36).substr(2, 5);
            const docId = data.id || '';
            const div = document.createElement('div');
            div.className = "p-2.5 bg-slate-50 border border-slate-200 rounded-none space-y-2 relative group product-row";
            div.id = rowId;
            div.innerHTML = `
                <div class="flex items-center justify-between">
                    <span class="text-[10px] font-bold text-emerald-700 product-index">Produk</span>
                    <button type="button" onclick="removeProductRow('${rowId}', '${docId}')" class="text-red-500 hover:text-red-700 text-xs cursor-pointer" title="Hapus Produk"><i class="fa-solid fa-trash"></i></button>
                </div>
                <div class="flex items-center space-x-2">
                    <!-- Preview Gambar di Baris Input -->
                    <div class="w-12 h-12 bg-white border border-slate-200 rounded-none flex items-center justify-center shrink-0 overflow-hidden">
                        <img class="prod-preview w-full h-full object-cover ${data.imageUrl ? '' : 'hidden'}" src="${data.imageUrl || ''}" alt="Preview">
                        <i class="fa-solid fa-image text-slate-300 text-xs ${data.imageUrl ? 'hidden' : ''}"></i>
                    </div>
                    <div class="flex-1 grid grid-cols-3 gap-1.5">
                        <input type="text" placeholder="Nama Produk" class="prod-nama w-full px-2 py-1 rounded-none border border-slate-200 text-[11px] bg-white" value="${data.namaUsaha || ''}">
                        <input type="text" placeholder="Harga (Rp)" class="prod-harga w-full px-2 py-1 rounded-none border border-slate-200 text-[11px] bg-white" value="${data.harga || ''}" onkeyup="formatRupiah(this)">
                        <select class="prod-kategori w-full px-1 py-1 rounded-none border border-slate-200 text-[10px] bg-white text-slate-700">
                            <option value="Makanan" ${data.kategori === 'Makanan' ? 'selected' : ''}>Makanan</option>
                            <option value="Minuman" ${data.kategori === 'Minuman' ? 'selected' : ''}>Minuman</option>
                            <option value="Kerajinan" ${data.kategori === 'Kerajinan' ? 'selected' : ''}>Kerajinan</option>
                            <option value="Jasa" ${data.kategori === 'Jasa' ? 'selected' : ''}>Jasa</option>
                            <option value="Fashion" ${data.kategori === 'Fashion' ? 'selected' : ''}>Fashion</option>
                            <option value="Lainnya" ${data.kategori === 'Lainnya' || !data.kategori ? 'selected' : ''}>Lainnya</option>
                        </select>
                    </div>
                </div>
                <div class="grid grid-cols-2 gap-1.5">
                    <textarea placeholder="Deskripsi singkat produk..." class="prod-desc w-full px-2 py-1 rounded-none border border-slate-200 text-[11px] bg-white" rows="1">${data.deskripsi || ''}</textarea>
                    <input type="file" accept="image/*" class="prod-file w-full px-1 py-1 rounded-none border border-slate-200 text-[9px] bg-white file:mr-1 file:py-0.5 file:px-1 file:rounded-none file:border-0 file:text-[9px] file:font-semibold file:bg-emerald-50 file:text-emerald-700 hover:file:bg-emerald-100" onchange="processImageFile(this)">
                </div>
                <input type="hidden" class="prod-id" value="${docId}">
                <input type="hidden" class="prod-img-base64" value="${data.imageUrl || ''}">
            `;
            productRowsContainer.appendChild(div);
            updateRowIndexes();
        };

        // Fungsi Kompresi Gambar Max 300px
        window.processImageFile = function(fileInput) {
            const file = fileInput.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                const img = new Image();
                img.onload = function() {
                    const canvas = document.createElement('canvas');
                    let width = img.width;
                    let height = img.height;

                    if (width > height) {
                        if (width > 300) {
                            height *= 300 / width;
                            width = 300;
                        }
                    } else {
                        if (height > 300) {
                            width *= 300 / height;
                            height = 300;
                        }
                    }

                    canvas.width = width;
                    canvas.height = height;
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0, width, height);

                    const base64String = canvas.toDataURL('image/jpeg', 0.85);
                    const parentRow = fileInput.closest('.group');
                    
                    parentRow.querySelector('.prod-img-base64').value = base64String;
                    const previewImg = parentRow.querySelector('.prod-preview');
                    const placeholderIcon = parentRow.querySelector('.fa-image');
                    
                    previewImg.src = base64String;
                    previewImg.classList.remove('hidden');
                    placeholderIcon.classList.add('hidden');

                    showToast('Foto berhasil dimuat & disesuaikan (max 300px)!');
                };
                img.src = e.target.result;
            };
            reader.readAsDataURL(file);
        };

        // Fungsi Hapus Baris / Data Firestore
        window.removeProductRow = async function(rowId, docId) {
            const row = document.getElementById(rowId);
            if (docId) {
                if (confirm("Yakin ingin menghapus produk ini dari database?")) {
                    try {
                        await deleteDoc(doc(db, "umkm", docId));
                        showToast('Produk berhasil dihapus!');
                        row.remove();
                        updateRowIndexes();
                    } catch (error) {
                        alert("Gagal menghapus produk: " + error.message);
                    }
                }
            } else {
                if (productRowsContainer.children.length > 1) {
                    row.remove();
                    updateRowIndexes();
                } else {
                    alert("Minimal harus ada 1 baris input produk.");
                }
            }
        };

        function updateRowIndexes() {
            const rows = productRowsContainer.children;
            for (let i = 0; i < rows.length; i++) {
                const label = rows[i].querySelector('.product-index');
                if (label) label.innerText = `Produk #${i + 1}`;
            }
        }

        // Ambil data produk berdasarkan ownerEmail atau nama pemilik
        window.checkAndReloadProducts = async function() {
            const ownerName = namaPemilikInput.value.trim().toLowerCase();
            if (!ownerName) return;

            productRowsContainer.innerHTML = "";
            try {
                const querySnapshot = await getDocs(collection(db, "umkm"));
                let foundCount = 0;

                querySnapshot.forEach((docSnap) => {
                    const data = docSnap.data();
                    const dbEmail = (data.ownerEmail || "").toLowerCase();
                    const dbName = (data.namaPemilik || "").toLowerCase();

                    if ((currentUserEmail && dbEmail === currentUserEmail.toLowerCase()) || (ownerName && dbName.includes(ownerName))) {
                        if (data.noWa && !noWaInput.value) {
                            noWaInput.value = data.noWa;
                        }
                        addProductRow({ id: docSnap.id, ...data });
                        foundCount++;
                    }
                });

                if (foundCount > 0) {
                    activeUserBadge.innerText = `${foundCount} Produk Tersimpan`;
                } else {
                    for (let i = 0; i < 5; i++) {
                        addProductRow();
                    }
                    activeUserBadge.innerText = `Belum ada produk`;
                }
            } catch (error) {
                console.error("Gagal memuat data:", error);
                for (let i = 0; i < 5; i++) {
                    addProductRow();
                }
            }
        };

        onAuthStateChanged(auth, async (user) => {
            if (user) {
                currentUserEmail = user.email;
                let ownerName = user.displayName || "Warga RT";
                let phoneValue = "";

                // Ambil data detail user (nama & phone) dari koleksi 'users' di Firestore berdasarkan email
                try {
                    const usersSnapshot = await getDocs(collection(db, "users"));
                    usersSnapshot.forEach((docSnap) => {
                        const userData = docSnap.data();
                        if (userData.email && userData.email.toLowerCase() === currentUserEmail.toLowerCase()) {
                            if (userData.name) ownerName = userData.name;
                            if (userData.phone) phoneValue = userData.phone;
                        }
                    });
                } catch (err) {
                    console.error("Gagal mengambil data user dari Firestore:", err);
                }

                namaPemilikInput.value = ownerName;
                noWaInput.value = phoneValue;

                // Load produk awal
                productRowsContainer.innerHTML = "";
                const querySnapshot = await getDocs(collection(db, "umkm"));
                let foundCount = 0;

                querySnapshot.forEach((docSnap) => {
                    const data = docSnap.data();
                    const dbEmail = (data.ownerEmail || "").toLowerCase();
                    const dbName = (data.namaPemilik || "").toLowerCase();

                    if ((currentUserEmail && dbEmail === currentUserEmail.toLowerCase()) || dbName.includes(ownerName.toLowerCase())) {
                        if (data.noWa && !noWaInput.value) {
                            noWaInput.value = data.noWa;
                        }
                        addProductRow({ id: docSnap.id, ...data });
                        foundCount++;
                    }
                });

                if (foundCount > 0) {
                    activeUserBadge.innerText = `${foundCount} Produk Tersimpan`;
                } else {
                    for (let i = 0; i < 5; i++) {
                        addProductRow();
                    }
                    activeUserBadge.innerText = `Belum ada produk`;
                }
            } else {
                window.location.href = "../index.html";
            }
        });

        // Simpan atau Perbarui Produk ke Firestore
        umkmForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const pemilik = namaPemilikInput.value.trim();
            const wa = noWaInput.value.trim();
            const rows = productRowsContainer.children;

            let savedCount = 0;

            try {
                for (let row of rows) {
                    const docId = row.querySelector('.prod-id').value.trim();
                    const namaUsaha = row.querySelector('.prod-nama').value.trim();
                    const harga = row.querySelector('.prod-harga').value.trim();
                    const kategori = row.querySelector('.prod-kategori').value;
                    const imageUrl = row.querySelector('.prod-img-base64').value.trim();
                    const deskripsi = row.querySelector('.prod-desc').value.trim();

                    if (namaUsaha !== "" && harga !== "") {
                        const productData = {
                            namaUsaha,
                            namaPemilik: pemilik,
                            harga,
                            kategori,
                            noWa: wa,
                            imageUrl,
                            deskripsi,
                            ownerEmail: currentUserEmail,
                            updatedAt: new Date()
                        };

                        if (docId) {
                            await updateDoc(doc(db, "umkm", docId), productData);
                        } else {
                            productData.createdAt = new Date();
                            const newDocRef = await addDoc(collection(db, "umkm"), productData);
                            row.querySelector('.prod-id').value = newDocRef.id;
                        }
                        savedCount++;
                    }
                }

                if (savedCount > 0) {
                    showToast(`${savedCount} produk UMKM berhasil disimpan/diperbarui!`);
                    window.checkAndReloadProducts();
                } else {
                    alert("Silakan isi minimal satu nama produk dan harga.");
                }
            } catch (error) {
                alert("Gagal menyimpan data: " + error.message);
            }
        });
    </script>
</body>
</html>
