<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Kirim Broadcast Notif - RT-Ku</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts: Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        .no-scrollbar::-webkit-scrollbar {
            display: none !important;
            width: 0px !important;
            height: 0px !important;
        }
        .no-scrollbar {
            -ms-overflow-style: none !important;
            scrollbar-width: none !important;
        }
    </style>
</head>
<body class="bg-slate-900 font-['Inter'] flex justify-center items-center h-screen overflow-hidden m-0">

    <!-- Toast Notification -->
    <div id="toastNotification" class="fixed top-6 left-1/2 transform -translate-x-1/2 bg-slate-900/95 border border-slate-700 text-white px-4 py-2.5 rounded-2xl shadow-2xl text-xs font-medium flex items-center space-x-2 z-50 transition-all duration-300 opacity-0 pointer-events-none translate-y-[-20px]">
        <div id="toastIconContainer" class="w-5 h-5 rounded-full bg-emerald-500 text-white flex items-center justify-center text-[10px] shadow">
            <i id="toastIcon" class="fa-solid fa-check"></i>
        </div>
        <span id="toastText">Berhasil!</span>
    </div>

    <!-- Container HP Frame -->
    <div class="w-full h-screen sm:max-w-[400px] sm:h-[92vh] sm:max-h-[820px] bg-slate-50 sm:rounded-[35px] shadow-2xl flex flex-col justify-between relative overflow-hidden sm:border-[6px] sm:border-slate-800">
        
        <!-- Header -->
        <div class="bg-gradient-to-b from-emerald-600 to-emerald-700 text-white p-5 rounded-b-[28px] flex items-center justify-between shrink-0">
            <a href="../home.html" class="w-9 h-9 rounded-full bg-white/10 flex items-center justify-center text-white backdrop-blur-sm transition-all hover:bg-white/20">
                <i class="fa-solid fa-arrow-left text-xs"></i>
            </a>
            <h1 class="font-bold text-sm tracking-wide">Kirim Broadcast Notif</h1>
            <div class="w-9"></div>
        </div>

        <!-- Content (Scrollable) -->
        <div class="p-4 flex-1 overflow-y-auto no-scrollbar pb-6 space-y-4 text-xs">
            
            <div class="bg-white p-4 rounded-2xl shadow-sm border border-slate-200/70 space-y-3">
                <div>
                    <h2 class="font-bold text-slate-800 text-xs"><i class="fa-solid fa-paper-plane mr-1.5 text-emerald-600"></i> Buat Pesan Pengumuman RT</h2>
                    <p class="text-[10px] text-slate-400 mt-0.5">Pesan akan dikirim langsung ke panel HP warga.</p>
                </div>

                <form id="notifForm" autocomplete="off" class="space-y-3 pt-2">
                    <div>
                        <label class="block text-[10px] font-semibold text-slate-700 mb-1">Judul Notifikasi</label>
                        <input type="text" id="notifTitle" required placeholder="Contoh: Pengumuman Kerja Bakti RT" class="w-full px-3 py-2 rounded-xl border border-slate-200 text-xs bg-slate-50 focus:outline-none focus:border-emerald-600 font-medium text-slate-700">
                    </div>

                    <div>
                        <label class="block text-[10px] font-semibold text-slate-700 mb-1">Isi Pesan / Informasi</label>
                        <textarea id="notifBody" required rows="4" placeholder="Tulis isi pengumuman lengkap di sini..." class="w-full px-3 py-2 rounded-xl border border-slate-200 text-xs bg-slate-50 focus:outline-none focus:border-emerald-600 font-medium text-slate-700 resize-none"></textarea>
                    </div>

                    <button type="submit" id="btnKirim" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-3 rounded-xl shadow-md shadow-emerald-600/35 transition-all text-xs cursor-pointer flex items-center justify-center space-x-2">
                        <i class="fa-solid fa-bell"></i>
                        <span>Kirim Notifikasi ke Warga</span>
                    </button>
                </form>
            </div>

            <!-- Status Perangkat Warga -->
            <div class="bg-white p-4 rounded-2xl shadow-sm border border-slate-200/70 space-y-2">
                <h3 class="font-bold text-slate-800 text-xs"><i class="fa-solid fa-users-viewfinder mr-1 text-emerald-600"></i> Status Perangkat Warga</h3>
                <p id="infoTokenCount" class="text-[10px] text-slate-400 font-medium">Memeriksa data perangkat...</p>
            </div>

        </div>

    </div>

    <!-- Skrip Pengiriman Push Notif -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, getDocs, addDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBx2AF0YRpOEq--q__dn39NwiNCKXvKutM",
            authDomain: "erte-979ca.firebaseapp.com",
            projectId: "erte-979ca",
            storageBucket: "erte-979ca.firebasestorage.app",
            messagingSenderId: "329513636032",
            appId: "1:329513636032:web:25a10b627b91db2bbb5d25"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        const infoTokenCount = document.getElementById('infoTokenCount');
        const notifForm = document.getElementById('notifForm');
        const btnKirim = document.getElementById('btnKirim');

        window.showToast = function(message, type = 'success') {
            const toast = document.getElementById('toastNotification');
            const toastText = document.getElementById('toastText');
            const iconContainer = document.getElementById('toastIconContainer');
            const icon = document.getElementById('toastIcon');

            toastText.innerText = message;
            if (type === 'error') {
                iconContainer.className = "w-5 h-5 rounded-full bg-red-500 text-white flex items-center justify-center text-[10px] shadow";
                icon.className = "fa-solid fa-xmark";
            } else {
                iconContainer.className = "w-5 h-5 rounded-full bg-emerald-500 text-white flex items-center justify-center text-[10px] shadow";
                icon.className = "fa-solid fa-check";
            }

            toast.classList.remove('opacity-0', 'pointer-events-none', 'translate-y-[-20px]');
            toast.classList.add('opacity-100', 'translate-y-0');

            setTimeout(() => {
                toast.classList.remove('opacity-100', 'translate-y-0');
                toast.classList.add('opacity-0', 'pointer-events-none', 'translate-y-[-20px]');
            }, 2000);
        }

        let targetTokens = [];
        async function checkRegisteredTokens() {
            try {
                const querySnapshot = await getDocs(collection(db, "users"));
                targetTokens = [];
                querySnapshot.forEach((doc) => {
                    const data = doc.data();
                    if (data.fcmToken) {
                        targetTokens.push(data.fcmToken);
                    }
                });
                
                if (targetTokens.length > 0) {
                    infoTokenCount.innerText = `${targetTokens.length} perangkat warga siap menerima notifikasi.`;
                    infoTokenCount.className = "text-[10px] text-emerald-600 font-bold";
                } else {
                    infoTokenCount.innerText = "0 perangkat warga siap menerima notifikasi.";
                    infoTokenCount.className = "text-[10px] text-slate-400 font-medium";
                }
            } catch (error) {
                infoTokenCount.innerText = "Gagal memuat status perangkat.";
            }
        }
        checkRegisteredTokens();

        notifForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const title = document.getElementById('notifTitle').value.trim();
            const body = document.getElementById('notifBody').value.trim();

            if (!title || !body) return;

            if (targetTokens.length === 0) {
                showToast('Tidak ada token perangkat warga!', 'error');
                return;
            }

            btnKirim.disabled = true;
            btnKirim.innerHTML = `<i class="fa-solid fa-spinner fa-spin"></i> <span>Mengirim Notif...</span>`;

            try {
                // Menyimpan ke koleksi 'broadcasts' agar service worker mendeteksi perubahan data secara real-time dan memunculkan push notification sistem
                await addDoc(collection(db, "broadcasts"), {
                    title: title,
                    body: body,
                    createdAt: new Date()
                });

                showToast(`Berhasil! Notif dikirim ke ${targetTokens.length} perangkat.`);
                notifForm.reset();
            } catch (error) {
                showToast('Gagal mengirim: ' + error.message, 'error');
            } finally {
                btnKirim.disabled = false;
                btnKirim.innerHTML = `<i class="fa-solid fa-bell"></i> <span>Kirim Notifikasi ke Warga</span>`;
            }
        });
    </script>
</body>
</html>
