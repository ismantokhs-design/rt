<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Daftar Kehadiran Warga - Admin RT 05</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts: Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        .no-scrollbar::-webkit-scrollbar {
            display: none !important;
            width: 0px !important;
            height: 0px !important;
        }
        .no-scrollbar {
            -ms-overflow-style: none !important;
            scrollbar-width: none !important;
        }
    </style>
</head>
<body class="bg-slate-900 font-['Inter'] flex justify-center items-center h-screen overflow-hidden m-0">

    <!-- Toast Notification -->
    <div id="toastNotification" class="fixed top-6 left-1/2 transform -translate-x-1/2 bg-slate-900/95 border border-slate-700 text-white px-4 py-2.5 rounded-2xl shadow-2xl text-xs font-medium flex items-center space-x-2 z-50 transition-all duration-300 opacity-0 pointer-events-none translate-y-[-20px]">
        <div class="w-5 h-5 rounded-full bg-emerald-500 text-white flex items-center justify-center text-[10px] shadow">
            <i class="fa-solid fa-check"></i>
        </div>
        <span id="toastText">Berhasil!</span>
    </div>

    <!-- Container HP Frame -->
    <div class="w-full h-screen sm:max-w-[400px] sm:h-[92vh] sm:max-h-[820px] bg-slate-50 sm:rounded-[35px] shadow-2xl flex flex-col justify-between relative overflow-hidden sm:border-[6px] sm:border-slate-800">
        
        <!-- Header -->
        <div class="bg-gradient-to-b from-emerald-600 to-emerald-700 text-white p-5 rounded-b-[28px] flex items-center justify-between shrink-0">
            <a href="manajemen.html" class="w-9 h-9 rounded-full bg-white/10 flex items-center justify-center text-white backdrop-blur-sm transition-all hover:bg-white/20">
                <i class="fa-solid fa-arrow-left text-xs"></i>
            </a>
            <h1 class="font-bold text-sm tracking-wide">Daftar Kehadiran Rapat</h1>
            <div class="w-9"></div>
        </div>

        <!-- Content (Scrollable) -->
        <div class="p-4 flex-1 overflow-y-auto no-scrollbar pb-28 space-y-4">
            
            <div class="bg-emerald-50 border border-emerald-100 p-4 rounded-2xl flex justify-between items-center">
                <div>
                    <h2 class="font-bold text-emerald-800 text-xs">Rekapitulasi Kehadiran</h2>
                    <p class="text-[11px] text-emerald-600 mt-0.5">Data masuk secara real-time dari warga.</p>
                </div>
                <div class="bg-emerald-600 text-white font-bold text-xs px-3 py-1.5 rounded-xl shadow-sm" id="totalHadirCount">
                    0 Hadir
                </div>
            </div>

            <!-- Daftar List Kehadiran -->
            <div>
                <h3 class="font-bold text-slate-800 text-xs mb-2.5 px-1">Warga yang Telah Absen</h3>
                <div id="listAbsensiAdmin" class="space-y-2 text-xs">
                    <div class="p-4 bg-white rounded-2xl border border-slate-200/70 shadow-sm text-center text-slate-400">
                        Memuat data kehadiran...
                    </div>
                </div>
            </div>

        </div>

        <!-- Tempat Include Bottom Navigation -->
        <div id="nav-container"></div>

    </div>

    <!-- Skrip Firestore Real-time -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, onSnapshot, query, orderBy } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";
        import { renderNavigation } from "../assets/js/navigation.js";

        // Render Navigasi Bawah
        document.getElementById('nav-container').innerHTML = renderNavigation('home', true);

        // Konfigurasi Firebase
        const firebaseConfig = {
            apiKey: "AIzaSyBx2AF0YRpOEq--q__dn39NwiNCKXvKutM",
            authDomain: "erte-979ca.firebaseapp.com",
            projectId: "erte-979ca",
            storageBucket: "erte-979ca.firebasestorage.app",
            messagingSenderId: "329513636032",
            appId: "1:329513636032:web:25a10b627b91db2bbb5d25"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        const listAbsensiAdmin = document.getElementById('listAbsensiAdmin');
        const totalHadirCount = document.getElementById('totalHadirCount');

        // Ambil data absensi dari Firestore secara Real-time diurutkan dari yang terbaru
        const q = query(collection(db, "absensi"), orderBy("createdAt", "desc"));

        onSnapshot(q, (snapshot) => {
            totalHadirCount.innerText = `${snapshot.size} Hadir`;

            if (snapshot.empty) {
                listAbsensiAdmin.innerHTML = `
                    <div class="p-4 bg-white rounded-2xl border border-slate-200/70 shadow-sm text-center text-slate-400 text-xs">
                        Belum ada data kehadiran yang masuk.
                    </div>
                `;
                return;
            }

            let html = "";
            snapshot.forEach((docSnap) => {
                const data = docSnap.data();
                let badgeColor = "bg-emerald-100 text-emerald-700";
                if (data.status === 'Izin') badgeColor = "bg-amber-100 text-amber-700";
                if (data.status === 'Sakit') badgeColor = "bg-blue-100 text-blue-700";

                html += `
                    <div class="p-3 bg-white rounded-xl border border-slate-200/60 shadow-sm flex justify-between items-center">
                        <div>
                            <span class="font-bold text-slate-800 text-xs block">${data.nama || 'Warga'}</span>
                            <span class="text-slate-400 text-[10px]"><i class="fa-regular fa-clock mr-1"></i> ${data.waktu || 'Baru saja'}</span>
                        </div>
                        <span class="${badgeColor} text-[10px] px-2.5 py-1 rounded-full font-bold">${data.status || 'Hadir'}</span>
                    </div>
                `;
            });
            listAbsensiAdmin.innerHTML = html;
        });
    </script>
</body>
</html>
