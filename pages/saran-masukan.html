<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Saran & Masukan - Aplikasi RT-Ku</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts: Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        .no-scrollbar::-webkit-scrollbar {
            display: none !important;
            width: 0px !important;
            height: 0px !important;
        }
        .no-scrollbar {
            -ms-overflow-style: none !important;
            scrollbar-width: none !important;
        }
    </style>
</head>
<body class="bg-slate-900 font-['Inter'] flex justify-center items-center h-screen overflow-hidden m-0">

    <!-- Toast Notification -->
    <div id="toastNotification" class="fixed top-6 left-1/2 transform -translate-x-1/2 bg-slate-900/95 border border-slate-700 text-white px-4 py-2.5 rounded-none shadow-2xl text-xs font-medium flex items-center space-x-2 z-50 transition-all duration-300 opacity-0 pointer-events-none translate-y-[-20px]">
        <div class="w-5 h-5 rounded-none bg-emerald-500 text-white flex items-center justify-center text-[10px] shadow">
            <i class="fa-solid fa-check"></i>
        </div>
        <span id="toastText">Berhasil!</span>
    </div>

    <!-- Container HP Frame -->
    <div class="w-full h-screen sm:max-w-[400px] sm:h-[92vh] sm:max-h-[820px] bg-slate-50 sm:rounded-none shadow-2xl flex flex-col justify-between relative overflow-hidden sm:border-[6px] sm:border-slate-800">
        
        <!-- Header -->
        <div class="bg-gradient-to-b from-emerald-600 to-emerald-700 text-white p-4 rounded-none flex items-center justify-between shrink-0 z-20">
            <a href="../home.html" class="w-9 h-9 rounded-none bg-white/10 flex items-center justify-center text-white backdrop-blur-sm transition-all hover:bg-white/20">
                <i class="fa-solid fa-arrow-left text-xs"></i>
            </a>
            <h1 class="font-bold text-sm tracking-wide">Saran & Masukan Warga</h1>
            <div class="w-9"></div>
        </div>

        <!-- Content (Scrollable) -->
        <div class="p-4 flex-1 overflow-y-auto no-scrollbar space-y-4 text-xs">
            
            <!-- Info Card -->
            <div class="bg-emerald-50 border border-emerald-200/60 rounded-none p-3.5 flex items-start space-x-3">
                <div class="w-8 h-8 rounded-none bg-emerald-600 text-white flex items-center justify-center shrink-0 text-xs shadow-md">
                    <i class="fa-solid fa-comments"></i>
                </div>
                <div>
                    <h2 class="font-bold text-emerald-900 text-xs">Suara Warga RT-Ku</h2>
                    <p class="text-[11px] text-emerald-700 mt-0.5 leading-relaxed">Sampaikan aspirasi atau masukan Anda. Riwayat di bawah bersifat privat dan hanya dapat dilihat oleh Anda sendiri.</p>
                </div>
            </div>

            <!-- Tombol Pemicu Pop-up -->
            <div>
                <button type="button" onclick="toggleModal(true)" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-semibold py-2.5 rounded-none shadow-md shadow-emerald-600/35 transition-all text-xs flex items-center justify-center space-x-2 cursor-pointer">
                    <i class="fa-solid fa-plus"></i>
                    <span>Tulis Aspirasi / Saran Baru</span>
                </button>
            </div>

            <!-- Daftar Histori Saran Saya (Real-time) -->
            <div class="bg-white rounded-none p-4 shadow-sm border border-slate-200/60 space-y-3">
                <div class="flex items-center justify-between pb-2 border-b border-slate-100">
                    <div class="flex items-center space-x-2">
                        <div class="w-6 h-6 rounded-none bg-emerald-50 text-emerald-600 flex items-center justify-center text-xs">
                            <i class="fa-solid fa-clock-rotate-left"></i>
                        </div>
                        <h3 class="font-bold text-slate-800 text-xs">Histori Aspirasi Saya</h3>
                    </div>
                    <span class="text-[9px] bg-emerald-100 text-emerald-700 px-2 py-0.5 rounded-none font-bold">Pribadi</span>
                </div>

                <div id="listSaranContainer" class="space-y-2">
                    <div class="p-3 bg-slate-50 rounded-none border border-slate-200/60 text-center text-slate-400 text-xs">
                        Memuat histori saran...
                    </div>
                </div>
            </div>

        </div>

    </div>

    <!-- MODAL POP-UP (MUNCUL DARI BAWAH) -->
    <div id="popupModal" class="fixed inset-0 bg-black/60 backdrop-blur-xs z-50 flex items-end justify-center transition-opacity duration-300 opacity-0 pointer-events-none" onclick="toggleModal(false)">
        <div id="modalContent" class="w-full sm:max-w-[400px] bg-white rounded-t-none shadow-2xl p-4 transform translate-y-full transition-transform duration-300 border-t border-slate-200" onclick="event.stopPropagation()">
            <div class="flex items-center justify-between mb-3 pb-2 border-b border-slate-100">
                <h3 id="formTitle" class="font-bold text-slate-800 text-xs flex items-center">
                    <i class="fa-solid fa-pen-to-square text-emerald-600 mr-1.5"></i> Kirim Saran Baru
                </h3>
                <button type="button" onclick="toggleModal(false)" class="text-slate-400 hover:text-red-500 text-xs cursor-pointer px-2 py-1">
                    <i class="fa-solid fa-xmark text-sm"></i> Tutup
                </button>
            </div>
            
            <form id="saranForm" class="space-y-3">
                <input type="hidden" id="editSaranId" value="">
                <div>
                    <label class="block text-[11px] font-semibold text-slate-700 mb-1">Subjek / Perihal</label>
                    <input type="text" id="txtSubjek" autocomplete="off" required placeholder="Contoh: Perbaikan Lampu Jalan" class="w-full px-3 py-2 rounded-none border border-slate-200 text-xs bg-slate-50 focus:outline-none focus:border-emerald-600">
                </div>

                <div>
                    <label class="block text-[11px] font-semibold text-slate-700 mb-1">Isi Saran / Masukan</label>
                    <textarea id="txtPesan" rows="3" autocomplete="off" required placeholder="Tuliskan saran atau masukan Anda secara jelas..." class="w-full px-3 py-2 rounded-none border border-slate-200 text-xs bg-slate-50 focus:outline-none focus:border-emerald-600"></textarea>
                </div>

                <button type="submit" id="btnSubmit" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-semibold py-2.5 rounded-none shadow-md shadow-emerald-600/35 transition-all text-xs cursor-pointer">
                    Kirim Saran & Masukan
                </button>
            </form>
        </div>
    </div>

    <!-- Skrip Firebase & Logika -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { getFirestore, collection, addDoc, updateDoc, deleteDoc, doc, query, where, onSnapshot, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        window.showToast = function(message) {
            const toast = document.getElementById('toastNotification');
            const toastText = document.getElementById('toastText');
            toastText.innerText = message;
            toast.classList.remove('opacity-0', 'pointer-events-none', 'translate-y-[-20px]');
            toast.classList.add('opacity-100', 'translate-y-0');
            setTimeout(() => {
                toast.classList.remove('opacity-100', 'translate-y-0');
                toast.classList.add('opacity-0', 'pointer-events-none', 'translate-y-[-20px]');
            }, 3000);
        }

        const firebaseConfig = {
            apiKey: "AIzaSyBx2AF0YRpOEq--q__dn39NwiNCKXvKutM",
            authDomain: "erte-979ca.firebaseapp.com",
            projectId: "erte-979ca",
            storageBucket: "erte-979ca.firebasestorage.app",
            messagingSenderId: "329513636032",
            appId: "1:329513636032:web:25a10b627b91db2bbb5d25"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        let currentUser = null;
        let allMySaran = [];

        const saranForm = document.getElementById('saranForm');
        const editSaranId = document.getElementById('editSaranId');
        const txtSubjek = document.getElementById('txtSubjek');
        const txtPesan = document.getElementById('txtPesan');
        const btnSubmit = document.getElementById('btnSubmit');
        const popupModal = document.getElementById('popupModal');
        const modalContent = document.getElementById('modalContent');
        const formTitle = document.getElementById('formTitle');
        const listSaranContainer = document.getElementById('listSaranContainer');

        onAuthStateChanged(auth, (user) => {
            if (user) {
                currentUser = user;
                loadMySaran(user.email);
            } else {
                window.location.href = "../index.html";
            }
        });

        // Fungsi Buka / Tutup Pop-up Modal dari Bawah
        window.toggleModal = function(isOpen) {
            if (isOpen) {
                popupModal.classList.remove('opacity-0', 'pointer-events-none');
                modalContent.classList.remove('translate-y-full');
            } else {
                popupModal.classList.add('opacity-0', 'pointer-events-none');
                modalContent.classList.add('translate-y-full');
                resetForm();
            }
        }

        // Simpan / Update Saran ke Firestore (Koleksi "messages")
        saranForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            if (!currentUser) return;

            const id = editSaranId.value;
            const subjekVal = txtSubjek.value.trim();
            const pesanVal = txtPesan.value.trim();

            try {
                if (id) {
                    await updateDoc(doc(db, "messages", id), {
                        subject: subjekVal,
                        content: pesanVal,
                        updatedAt: serverTimestamp()
                    });
                    showToast('Saran berhasil diperbarui!');
                } else {
                    await addDoc(collection(db, "messages"), {
                        category: "Aspirasi",
                        subject: subjekVal,
                        content: pesanVal,
                        status: "Belum Ditanggapi",
                        userId: currentUser.uid || "guest-user",
                        userEmail: currentUser.email || "",
                        userName: currentUser.displayName || "Warga RT",
                        createdAt: serverTimestamp(),
                        updatedAt: serverTimestamp()
                    });
                    showToast('Saran & masukan berhasil dikirim!');
                }
                toggleModal(false);
            } catch (error) {
                alert("Gagal menyimpan: " + error.message);
            }
        });

        // Ambil Data Real-time Khusus Milik Pengguna yang Login dari Koleksi "messages"
        function loadMySaran(email) {
            const q = query(collection(db, "messages"), where("userEmail", "==", email));
            
            onSnapshot(q, (snapshot) => {
                allMySaran = [];
                snapshot.forEach((docSnap) => {
                    allMySaran.push({ id: docSnap.id, ...docSnap.data() });
                });

                allMySaran.sort((a, b) => {
                    const timeA = a.createdAt ? a.createdAt.toMillis() : 0;
                    const timeB = b.createdAt ? b.createdAt.toMillis() : 0;
                    return timeB - timeA;
                });

                let html = "";
                if (allMySaran.length === 0) {
                    html = `<div class="p-3 bg-slate-50 rounded-none border border-slate-200/60 text-center text-slate-400 text-xs">Belum ada saran atau masukan yang Anda kirim.</div>`;
                } else {
                    allMySaran.forEach((data) => {
                        let tanggalStr = "Baru saja";
                        if (data.createdAt) {
                            const dateObj = data.createdAt.toDate();
                            tanggalStr = dateObj.toLocaleDateString('id-ID', { day: 'numeric', month: 'short', year: 'numeric' }) + ' ' + dateObj.toLocaleTimeString('id-ID', { hour: '2-digit', minute: '2-digit' });
                        }

                        const isBelumDitanggapi = (data.status !== "Sudah Ditanggapi");
                        const statusBadgeClass = isBelumDitanggapi ? "bg-amber-100 text-amber-700 border border-amber-200" : "bg-emerald-100 text-emerald-700 border border-emerald-200";
                        const statusText = isBelumDitanggapi ? "Belum Ditanggapi" : "Sudah Ditanggapi";

                        html += `
                            <div class="p-3 bg-slate-50 rounded-none border border-slate-200/60 space-y-2">
                                <div class="flex items-center justify-between">
                                    <h4 class="font-bold text-slate-800 text-[11px] truncate max-w-[180px]">${data.subject || '-'}</h4>
                                    <span class="text-[9px] ${statusBadgeClass} px-1.5 py-0.5 rounded-none font-bold">${statusText}</span>
                                </div>
                                <p class="text-[10px] text-slate-600 leading-relaxed">${data.content || '-'}</p>
                                <div class="pt-1 flex items-center justify-between text-[9px] text-slate-400 border-t border-slate-200/40">
                                    <span>${tanggalStr}</span>
                                    <div class="flex items-center space-x-2">
                                        ${isBelumDitanggapi ? `
                                            <button type="button" onclick="editSaran('${data.id}')" class="text-blue-600 hover:underline font-semibold cursor-pointer">
                                                <i class="fa-solid fa-pen-to-square mr-0.5"></i> Edit
                                            </button>
                                            <button type="button" onclick="deleteSaran('${data.id}')" class="text-red-600 hover:underline font-semibold cursor-pointer">
                                                <i class="fa-solid fa-trash-can mr-0.5"></i> Hapus
                                            </button>
                                        ` : `<span class="text-emerald-600 italic">Terkunci (Sudah ditanggapi)</span>`}
                                    </div>
                                </div>
                            </div>
                        `;
                    });
                }
                listSaranContainer.innerHTML = html;
            }, (error) => {
                console.error("Gagal memuat data:", error);
                listSaranContainer.innerHTML = `<div class="p-3 bg-slate-50 rounded-none border border-slate-200/60 text-center text-red-500 text-xs">Gagal memuat data histori.</div>`;
            });
        }

        // Fungsi Masuk Mode Edit
        window.editSaran = function(id) {
            const item = allMySaran.find(s => s.id === id);
            if (item) {
                editSaranId.value = item.id;
                txtSubjek.value = item.subject || '';
                txtPesan.value = item.content || '';
                formTitle.innerHTML = `<i class="fa-solid fa-pen-to-square text-emerald-600 mr-1.5"></i> Edit Saran & Masukan`;
                btnSubmit.innerText = "Perbarui Saran";
                toggleModal(true);
            }
        }

        // Fungsi Reset Form
        window.resetForm = function() {
            editSaranId.value = "";
            txtSubjek.value = "";
            txtPesan.value = "";
            formTitle.innerHTML = `<i class="fa-solid fa-pen-to-square text-emerald-600 mr-1.5"></i> Kirim Saran Baru`;
            btnSubmit.innerText = "Kirim Saran & Masukan";
        }

        // Fungsi Hapus Saran
        window.deleteSaran = async function(id) {
            if (confirm("Apakah Anda yakin ingin menghapus saran ini?")) {
                try {
                    await deleteDoc(doc(db, "messages", id));
                    showToast('Saran berhasil dihapus!');
                    if (editSaranId.value === id) toggleModal(false);
                } catch (error) {
                    alert("Gagal menghapus: " + error.message);
                }
            }
        }
    </script>
</body>
</html>
