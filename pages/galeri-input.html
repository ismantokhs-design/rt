<!-- SKRIP LOGIKA & FIRESTORE -->
<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, collection, addDoc, getDocs, deleteDoc, updateDoc, doc, onSnapshot, serverTimestamp, query, orderBy } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const firebaseConfig = {
        apiKey: "AIzaSyBx2AF0YRpOEq--q__dn39NwiNCKXvKutM",
        authDomain: "erte-979ca.firebaseapp.com",
        projectId: "erte-979ca",
        storageBucket: "erte-979ca.firebasestorage.app",
        messagingSenderId: "329513636032",
        appId: "1:329513636032:web:25a10b627b91db2bbb5d25"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    // Inisialisasi Modal Melayang dari Bawah (Bottom Sheet) Dinamis Beserta Preview
    function initBottomModal() {
        if (document.getElementById('templateModal')) return;

        const modalHTML = `
        <div id="templateModal" class="fixed inset-0 bg-black/50 backdrop-blur-[2px] z-[9999] flex items-end justify-center hidden transition-opacity duration-300">
            <div id="templateModalBox" class="w-full max-w-lg bg-white dark:bg-slate-800 rounded-t-2xl p-5 shadow-2xl flex flex-col max-h-[90vh] transform translate-y-full transition-transform duration-300 ease-out">
                <div class="w-12 h-1.5 bg-slate-300 dark:bg-slate-600 rounded-full mx-auto mb-3"></div>
                
                <div class="flex justify-between items-center mb-3 pb-2 border-b border-slate-100 dark:border-slate-700">
                    <h3 class="font-bold text-slate-800 dark:text-slate-100 text-xs uppercase tracking-wide">Form Tambah Galeri</h3>
                    <button type="button" id="closeCustomModal" class="w-6 h-6 rounded-none bg-slate-100 dark:bg-slate-700 text-slate-500 hover:bg-slate-200 flex items-center justify-center text-xs cursor-pointer">
                        <i class="fa-solid fa-xmark"></i>
                    </button>
                </div>

                <form id="templateForm" class="space-y-3 text-xs overflow-y-auto flex-1 pb-2">
                    <div>
                        <label class="block text-[11px] font-semibold text-slate-700 dark:text-slate-300 mb-1">Judul Kegiatan</label>
                        <input type="text" id="inputTitle" required placeholder="Contoh: Kerja bakti..." class="w-full px-3 py-2 rounded-none border border-slate-200 dark:border-slate-600 text-xs bg-slate-50 dark:bg-slate-700 text-slate-800 dark:text-slate-100 focus:outline-none focus:border-emerald-600">
                    </div>
                    <div>
                        <label class="block text-[11px] font-semibold text-slate-700 dark:text-slate-300 mb-1">Tanggal Kegiatan</label>
                        <input type="date" id="inputActivityDate" required class="w-full px-3 py-2 rounded-none border border-slate-200 dark:border-slate-600 text-xs bg-slate-50 dark:bg-slate-700 text-slate-800 dark:text-slate-100 focus:outline-none focus:border-emerald-600">
                    </div>
                    <div>
                        <label class="block text-[11px] font-semibold text-slate-700 dark:text-slate-300 mb-1">Status Publikasi</label>
                        <select id="inputIsActive" class="w-full px-3 py-2 rounded-none border border-slate-200 dark:border-slate-600 text-xs bg-slate-50 dark:bg-slate-700 text-slate-800 dark:text-slate-100 focus:outline-none focus:border-emerald-600">
                            <option value="true">Active</option>
                            <option value="false">Inactive</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-[11px] font-semibold text-slate-700 dark:text-slate-300 mb-1">Deskripsi Kegiatan</label>
                        <textarea id="inputDescription" rows="2" placeholder="Tuliskan keterangan singkat..." class="w-full px-3 py-2 rounded-none border border-slate-200 dark:border-slate-600 text-xs bg-slate-50 dark:bg-slate-700 text-slate-800 dark:text-slate-100 focus:outline-none focus:border-emerald-600"></textarea>
                    </div>
                    <div>
                        <label class="block text-[11px] font-semibold text-slate-700 dark:text-slate-300 mb-1">Foto Kegiatan</label>
                        <input type="file" id="inputImageFile" accept="image/*" required class="w-full px-3 py-2 rounded-none border border-slate-200 dark:border-slate-600 text-xs bg-slate-50 dark:bg-slate-700 text-slate-800 dark:text-slate-100 focus:outline-none focus:border-emerald-600 file:mr-3 file:py-1 file:px-3 file:rounded-none file:border-0 file:text-xs file:font-semibold file:bg-emerald-600 file:text-white hover:file:bg-emerald-700 cursor-pointer">
                    </div>

                    <!-- Kotak Preview Gambar -->
                    <div id="imagePreviewContainer" class="hidden space-y-1">
                        <label class="block text-[11px] font-semibold text-slate-700 dark:text-slate-300">Preview Foto</label>
                        <div class="w-full h-36 bg-slate-100 dark:bg-slate-900 border border-slate-200 dark:border-slate-700 overflow-hidden relative">
                            <img id="previewImage" src="" alt="Preview" class="w-full h-full object-cover">
                        </div>
                    </div>

                    <div class="flex space-x-2 pt-2">
                        <button type="button" id="cancelCustomModal" class="w-1/2 bg-slate-200 dark:bg-slate-700 hover:bg-slate-300 text-slate-700 dark:text-slate-200 font-semibold py-2 rounded-none transition-all text-xs cursor-pointer">Batal</button>
                        <button type="submit" id="btnSubmitGaleri" class="w-1/2 bg-emerald-600 hover:bg-emerald-700 text-white font-semibold py-2 rounded-none shadow transition-all text-xs cursor-pointer">Simpan</button>
                    </div>
                </form>
            </div>
        </div>`;

        document.body.insertAdjacentHTML('beforeend', modalHTML);

        document.getElementById('closeCustomModal').addEventListener('click', window.closeTemplateModal);
        document.getElementById('cancelCustomModal').addEventListener('click', window.closeTemplateModal);
        document.getElementById('templateModal').addEventListener('click', (e) => {
            if (e.target.id === 'templateModal') window.closeTemplateModal();
        });

        // Set default tanggal hari ini
        const today = new Date().toISOString().split('T')[0];
        const dateInput = document.getElementById('inputActivityDate');
        if (dateInput) dateInput.value = today;

        // Listener untuk preview gambar
        document.getElementById('inputImageFile').addEventListener('change', (e) => {
            const file = e.target.files[0];
            const previewContainer = document.getElementById('imagePreviewContainer');
            const previewImg = document.getElementById('previewImage');

            if (file) {
                const reader = new FileReader();
                reader.onload = function(event) {
                    previewImg.src = event.target.result;
                    previewContainer.classList.remove('hidden');
                }
                reader.readAsDataURL(file);
            } else {
                previewContainer.classList.add('hidden');
                previewImg.src = '';
            }
        });

        // Submit form ke Firestore koleksi "galeri"[cite: 19]
        document.getElementById('templateForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const titleVal = document.getElementById('inputTitle').value.trim();
            const dateVal = document.getElementById('inputActivityDate').value;
            const statusVal = document.getElementById('inputIsActive').value === 'true';
            const descVal = document.getElementById('inputDescription').value.trim();
            const fileInput = document.getElementById('inputImageFile');
            const submitBtn = document.getElementById('btnSubmitGaleri');

            if (!titleVal || !fileInput.files[0]) return;

            try {
                submitBtn.disabled = true;
                submitBtn.innerText = "Mengompres & Menyimpan...";

                const base64ImageUrl = await compressImage(fileInput.files[0]);

                await addDoc(collection(db, "galeri"), {
                    title: titleVal,
                    activityDate: dateVal,
                    isActive: statusVal,
                    description: descVal,
                    imageUrl: base64ImageUrl,
                    createdAt: serverTimestamp()
                });

                e.target.reset();
                window.closeTemplateModal();
                if (typeof showToast === 'function') showToast("Galeri berhasil disimpan!");
            } catch (error) {
                alert("Gagal menyimpan galeri: " + error.message);
            } finally {
                submitBtn.disabled = false;
                submitBtn.innerText = "Simpan";
            }
        });
    }

    window.openTemplateModal = function() {
        initBottomModal();
        const modal = document.getElementById('templateModal');
        const box = document.getElementById('templateModalBox');
        if (modal && box) {
            modal.classList.remove('hidden');
            setTimeout(() => {
                box.classList.remove('translate-y-full');
            }, 10);
        }
    }

    window.closeTemplateModal = function() {
        const modal = document.getElementById('templateModal');
        const box = document.getElementById('templateModalBox');
        if (modal && box) {
            box.classList.add('translate-y-full');
            setTimeout(() => {
                modal.classList.add('hidden');
                const form = document.getElementById('templateForm');
                if (form) form.reset();
                const previewContainer = document.getElementById('imagePreviewContainer');
                if (previewContainer) previewContainer.classList.add('hidden');
            }, 300);
        }
    }

    function compressImage(file, maxWidth = 800, quality = 0.7) {
        return new Promise((resolve, reject) => {
            const reader = new FileReader();
            reader.readAsDataURL(file);
            reader.onload = (event) => {
                const img = new Image();
                img.src = event.target.result;
                img.onload = () => {
                    const canvas = document.createElement('canvas');
                    let width = img.width;
                    let height = img.height;

                    if (width > maxWidth) {
                        height = Math.round((height * maxWidth) / width);
                        width = maxWidth;
                    }

                    canvas.width = width;
                    canvas.height = height;
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0, width, height);

                    resolve(canvas.toDataURL('image/jpeg', quality));
                };
                img.onerror = (error) => reject(error);
            };
            reader.onerror = (error) => reject(error);
        });
    }

    // Toggle status isActive menggunakan tombol panah kiri-kanan
    window.toggleGaleriStatus = async function(id, currentStatus) {
        const newStatus = !currentStatus;
        try {
            await updateDoc(doc(db, "galeri", id), {
                isActive: newStatus
            });
            if (typeof showToast === 'function') showToast(`Status diubah ke ${newStatus ? 'ACTIVE' : 'INACTIVE'}`);
        } catch (error) {
            alert("Gagal mengubah status: " + error.message);
        }
    }

    window.deleteGaleri = async function(id) {
        if (confirm("Yakin ingin menghapus galeri ini?")) {
            try {
                await deleteDoc(doc(db, "galeri", id));
                if (typeof showToast === 'function') showToast("Galeri berhasil dihapus.");
            } catch (error) {
                alert("Gagal menghapus: " + error.message);
            }
        }
    }

    // Realtime Listener untuk Koleksi "galeri"[cite: 19]
    onSnapshot(query(collection(db, "galeri"), orderBy("createdAt", "desc")), (snapshot) => {
        let deskHtml = "";
        let mobHtml = "";

        if (snapshot.empty) {
            const emptyMsg = '<div class="col-span-full p-6 bg-slate-50 dark:bg-slate-700/50 rounded-none border border-slate-200/70 dark:border-slate-700 shadow-sm text-center text-slate-400 text-xs">Belum ada galeri tersimpan.</div>';
            document.getElementById('desktopContentContainer').innerHTML = emptyMsg;
            document.getElementById('mobileContentContainer').innerHTML = emptyMsg;
            return;
        }

        snapshot.forEach((docSnap) => {
            const data = docSnap.data();
            const docId = docSnap.id;
            const title = data.title || '-';
            const description = data.description || '-';
            const activityDate = data.activityDate || '-';
            const isActive = data.isActive === true; // boolean sesuai struktur db[cite: 19]
            const imageUrl = data.imageUrl || '';

            deskHtml += `
                <div class="bg-white dark:bg-slate-800 rounded-none border border-slate-200 dark:border-slate-700 shadow-sm overflow-hidden flex flex-col justify-between">
                    <div>
                        <div class="w-full h-36 bg-slate-100 dark:bg-slate-900 relative overflow-hidden">
                            ${imageUrl ? `<img src="${imageUrl}" alt="${title}" class="w-full h-full object-cover">` : '<div class="flex items-center justify-center h-full text-slate-400 text-xs">Tanpa Foto</div>'}
                            
                            <!-- Tombol Kiri-Kanan Status Active / Inactive -->
                            <div class="absolute top-2 right-2 flex items-center bg-white/90 dark:bg-slate-900/90 border border-slate-300 dark:border-slate-700 shadow">
                                <button type="button" onclick="window.toggleGaleriStatus('${docId}', ${isActive})" title="Ubah Status" class="px-1.5 py-1 text-slate-600 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-800 text-[10px] cursor-pointer">
                                    <i class="fa-solid fa-chevron-left"></i>
                                </button>
                                <span class="px-2 py-0.5 text-[10px] font-bold uppercase ${isActive ? 'text-emerald-600 dark:text-emerald-400' : 'text-slate-500'}">${isActive ? 'active' : 'inactive'}</span>
                                <button type="button" onclick="window.toggleGaleriStatus('${docId}', ${isActive})" title="Ubah Status" class="px-1.5 py-1 text-slate-600 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-800 text-[10px] cursor-pointer">
                                    <i class="fa-solid fa-chevron-right"></i>
                                </button>
                            </div>
                        </div>
                        <div class="p-3 space-y-1">
                            <span class="text-[10px] text-emerald-600 dark:text-emerald-400 font-semibold"><i class="fa-regular fa-calendar mr-1"></i>${activityDate}</span>
                            <h4 class="font-bold text-slate-800 dark:text-slate-100 text-xs truncate">${title}</h4>
                            <p class="text-[11px] text-slate-500 dark:text-slate-400 line-clamp-2">${description}</p>
                        </div>
                    </div>
                    <div class="p-3 pt-0 flex justify-end">
                        <button type="button" onclick="window.deleteGaleri('${docId}')" class="w-full bg-red-50 dark:bg-red-950/50 hover:bg-red-100 text-red-600 dark:text-red-400 py-1.5 px-3 rounded-none text-xs font-semibold transition-all cursor-pointer flex items-center justify-center space-x-1">
                            <i class="fa-solid fa-trash text-[10px]"></i>
                            <span>Hapus Galeri</span>
                        </button>
                    </div>
                </div>
            `;

            mobHtml += `
                <div class="bg-white dark:bg-slate-800 rounded-none border border-slate-200 dark:border-slate-700 shadow-sm overflow-hidden space-y-2 p-2.5">
                    <div class="flex items-center space-x-3">
                        <div class="w-20 h-16 bg-slate-100 dark:bg-slate-900 shrink-0 relative overflow-hidden">
                            ${imageUrl ? `<img src="${imageUrl}" alt="${title}" class="w-full h-full object-cover">` : ''}
                        </div>
                        <div class="flex-1 min-w-0 space-y-0.5">
                            <div class="inline-flex items-center bg-slate-100 dark:bg-slate-900 border border-slate-200 dark:border-slate-700">
                                <button type="button" onclick="window.toggleGaleriStatus('${docId}', ${isActive})" class="px-1 py-0.5 text-slate-500 hover:bg-slate-200 text-[9px] cursor-pointer"><i class="fa-solid fa-chevron-left"></i></button>
                                <span class="px-1.5 text-[9px] font-bold uppercase ${isActive ? 'text-emerald-600 dark:text-emerald-400' : 'text-slate-500'}">${isActive ? 'active' : 'inactive'}</span>
                                <button type="button" onclick="window.toggleGaleriStatus('${docId}', ${isActive})" class="px-1 py-0.5 text-slate-500 hover:bg-slate-200 text-[9px] cursor-pointer"><i class="fa-solid fa-chevron-right"></i></button>
                            </div>
                            <h4 class="font-bold text-slate-800 dark:text-slate-100 text-xs truncate">${title}</h4>
                            <p class="text-[10px] text-slate-400 truncate">${description}</p>
                        </div>
                        <button type="button" onclick="window.deleteGaleri('${docId}')" class="bg-red-50 dark:bg-red-950/50 text-red-600 dark:text-red-400 p-2 rounded-none text-xs cursor-pointer">
                            <i class="fa-solid fa-trash"></i>
                        </button>
                    </div>
                </div>
            `;
        });

        document.getElementById('desktopContentContainer').innerHTML = deskHtml;
        document.getElementById('mobileContentContainer').innerHTML = mobHtml;
    });
</script>
