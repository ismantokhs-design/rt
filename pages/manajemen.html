<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Pengaturan & Manajemen - RT 05</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts: Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        .no-scrollbar::-webkit-scrollbar {
            display: none !important;
            width: 0px !important;
            height: 0px !important;
        }
        .no-scrollbar {
            -ms-overflow-style: none !important;
            scrollbar-width: none !important;
        }
    </style>
</head>
<body class="bg-slate-900 font-['Inter'] flex justify-center items-center h-screen overflow-hidden m-0">

    <!-- Toast Notification -->
    <div id="toastNotification" class="fixed top-6 left-1/2 transform -translate-x-1/2 bg-slate-900/95 border border-slate-700 text-white px-4 py-2.5 rounded-2xl shadow-2xl text-xs font-medium flex items-center space-x-2 z-50 transition-all duration-300 opacity-0 pointer-events-none translate-y-[-20px]">
        <div class="w-5 h-5 rounded-full bg-emerald-500 text-white flex items-center justify-center text-[10px] shadow">
            <i class="fa-solid fa-check"></i>
        </div>
        <span id="toastText">Berhasil!</span>
    </div>

    <!-- Container HP Frame -->
    <div class="w-full h-screen sm:max-w-[400px] sm:h-[92vh] sm:max-h-[820px] bg-slate-50 sm:rounded-[35px] shadow-2xl flex flex-col justify-between relative overflow-hidden sm:border-[6px] sm:border-slate-800">
        
        <!-- Header -->
        <div class="bg-gradient-to-b from-emerald-600 to-emerald-700 text-white p-5 rounded-b-[28px] flex items-center justify-between shrink-0">
            <a href="../home.html" class="w-9 h-9 rounded-full bg-white/10 flex items-center justify-center text-white backdrop-blur-sm transition-all hover:bg-white/20">
                <i class="fa-solid fa-arrow-left text-xs"></i>
            </a>
            <h1 class="font-bold text-sm tracking-wide">Pengaturan & Manajemen</h1>
            <div class="w-9"></div>
        </div>

        <!-- Content (Scrollable Grid Menu) -->
        <div class="p-4 flex-1 overflow-y-auto no-scrollbar pb-28 space-y-4">
            
            <h2 class="font-bold text-slate-800 text-xs px-1">Menu Pengelolaan RT 05</h2>

            <!-- Grid Menu 2 Kolom -->
            <div class="grid grid-cols-2 gap-3">
                
                <!-- Menu 1: Manajemen Warga -->
                <a href="data-warga.html" class="bg-white p-5 rounded-2xl border border-slate-200/70 shadow-sm hover:border-emerald-500 hover:shadow-md transition-all flex flex-col items-center justify-center text-center group cursor-pointer">
                    <div class="w-12 h-12 rounded-2xl bg-emerald-50 text-emerald-600 flex items-center justify-center text-lg mb-3 group-hover:bg-emerald-600 group-hover:text-white transition-all shadow-sm">
                        <i class="fa-solid fa-users-gear"></i>
                    </div>
                    <span class="font-bold text-slate-800 text-xs group-hover:text-emerald-700">Manajemen Warga</span>
                    <span class="text-[10px] text-slate-400 mt-0.5">Data & Kepala Keluarga</span>
                </a>

                <!-- Menu 2: Manajemen Event / Kegiatan -->
                <button type="button" onclick="showToast('Membuka Manajemen Event')" class="bg-white p-5 rounded-2xl border border-slate-200/70 shadow-sm hover:border-emerald-500 hover:shadow-md transition-all flex flex-col items-center justify-center text-center group cursor-pointer">
                    <div class="w-12 h-12 rounded-2xl bg-emerald-50 text-emerald-600 flex items-center justify-center text-lg mb-3 group-hover:bg-emerald-600 group-hover:text-white transition-all shadow-sm">
                        <i class="fa-solid fa-calendar-days"></i>
                    </div>
                    <span class="font-bold text-slate-800 text-xs group-hover:text-emerald-700">Manajemen Event</span>
                    <span class="text-[10px] text-slate-400 mt-0.5">Jadwal & Agenda RT</span>
                </button>

                <!-- Menu 3: Iuran & Kas -->
                <button type="button" onclick="showToast('Membuka Manajemen Iuran')" class="bg-white p-5 rounded-2xl border border-slate-200/70 shadow-sm hover:border-emerald-500 hover:shadow-md transition-all flex flex-col items-center justify-center text-center group cursor-pointer">
                    <div class="w-12 h-12 rounded-2xl bg-emerald-50 text-emerald-600 flex items-center justify-center text-lg mb-3 group-hover:bg-emerald-600 group-hover:text-white transition-all shadow-sm">
                        <i class="fa-solid fa-box-archive"></i>
                    </div>
                    <span class="font-bold text-slate-800 text-xs group-hover:text-emerald-700">Kas & Iuran</span>
                    <span class="text-[10px] text-slate-400 mt-0.5">Pencatatan keuangan</span>
                </button>

                <!-- Menu 4: Banner Pengumuman -->
                <a href="banner.html" class="bg-white p-5 rounded-2xl border border-slate-200/70 shadow-sm hover:border-emerald-500 hover:shadow-md transition-all flex flex-col items-center justify-center text-center group cursor-pointer">
                    <div class="w-12 h-12 rounded-2xl bg-emerald-50 text-emerald-600 flex items-center justify-center text-lg mb-3 group-hover:bg-emerald-600 group-hover:text-white transition-all shadow-sm">
                        <i class="fa-solid fa-images"></i>
                    </div>
                    <span class="font-bold text-slate-800 text-xs group-hover:text-emerald-700">Banner</span>
                    <span class="text-[10px] text-slate-400 mt-0.5">Slider foto beranda</span>
                </a>

                <!-- Menu 5: Rapat -->
                <a href="rapat.html" class="bg-white p-5 rounded-2xl border border-slate-200/70 shadow-sm hover:border-emerald-500 hover:shadow-md transition-all flex flex-col items-center justify-center text-center group cursor-pointer">
                    <div class="w-12 h-12 rounded-2xl bg-emerald-50 text-emerald-600 flex items-center justify-center text-lg mb-3 group-hover:bg-emerald-600 group-hover:text-white transition-all shadow-sm">
                        <i class="fa-solid fa-users-rectangle"></i>
                    </div>
                    <span class="font-bold text-slate-800 text-xs group-hover:text-emerald-700">Rapat</span>
                    <span class="text-[10px] text-slate-400 mt-0.5">Musyawarah & presensi</span>
                </a>

                <!-- Menu 6: Running Text -->
                <a href="running-text.html" class="bg-white p-5 rounded-2xl border border-slate-200/70 shadow-sm hover:border-emerald-500 hover:shadow-md transition-all flex flex-col items-center justify-center text-center group cursor-pointer">
                    <div class="w-12 h-12 rounded-2xl bg-emerald-50 text-emerald-600 flex items-center justify-center text-lg mb-3 group-hover:bg-emerald-600 group-hover:text-white transition-all shadow-sm">
                        <i class="fa-solid fa-bars-staggered"></i>
                    </div>
                    <span class="font-bold text-slate-800 text-xs group-hover:text-emerald-700">Running Text</span>
                    <span class="text-[10px] text-slate-400 mt-0.5">Teks berjalan info RT</span>
                </a>

                <!-- Menu 7: QR Code Absensi (Baru) -->
                <a href="admin-qr.html" class="bg-white p-5 rounded-2xl border border-slate-200/70 shadow-sm hover:border-emerald-500 hover:shadow-md transition-all flex flex-col items-center justify-center text-center group cursor-pointer col-span-2">
                    <div class="w-12 h-12 rounded-2xl bg-emerald-50 text-emerald-600 flex items-center justify-center text-lg mb-3 group-hover:bg-emerald-600 group-hover:text-white transition-all shadow-sm">
                        <i class="fa-solid fa-qrcode"></i>
                    </div>
                    <span class="font-bold text-slate-800 text-xs group-hover:text-emerald-700">QR Code Absensi</span>
                    <span class="text-[10px] text-slate-400 mt-0.5">Tampilkan QR Code untuk scan warga</span>
                </a>

            </div>

        </div>

        <!-- Tempat Include Bottom Navigation -->
        <div id="nav-container"></div>

    </div>

    <!-- Skrip Utama Manajemen -->
    <script type="module">
        import { renderNavigation } from "../assets/js/navigation.js";

        // Render Navigasi Bawah
        document.getElementById('nav-container').innerHTML = renderNavigation('home', true);

        // Toast Notification
        window.showToast = function(message) {
            const toast = document.getElementById('toastNotification');
            const toastText = document.getElementById('toastText');
            toastText.innerText = message;
            toast.classList.remove('opacity-0', 'pointer-events-none', 'translate-y-[-20px]');
            toast.classList.add('opacity-100', 'translate-y-0');
            setTimeout(() => {
                toast.classList.remove('opacity-100', 'translate-y-0');
                toast.classList.add('opacity-0', 'pointer-events-none', 'translate-y-[-20px]');
            }, 1800);
        }
    </script>
</body>
</html>
