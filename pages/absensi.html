<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Absensi Kehadiran - RT 05</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body class="bg-slate-100 font-['Inter'] flex justify-center items-center min-h-screen">

    <div class="w-full max-w-md bg-white min-h-screen shadow-2xl flex flex-col justify-between relative overflow-hidden">
        
        <!-- Header -->
        <div class="bg-emerald-600 text-white p-6 rounded-b-[30px] flex items-center justify-between">
            <a href="../index.html" class="w-10 h-10 rounded-full bg-white/10 flex items-center justify-center text-white">
                <i class="fa-solid fa-arrow-left"></i>
            </a>
            <h1 class="font-bold text-base">Form Absensi Warga</h1>
            <div class="w-10"></div>
        </div>

        <!-- Content -->
        <div class="p-6 flex-1 overflow-y-auto pb-20">
            <div class="bg-emerald-50 border border-emerald-100 p-4 rounded-2xl mb-6">
                <h2 class="font-bold text-emerald-800 text-sm">Musyawarah Rutin Bulanan</h2>
                <p class="text-xs text-emerald-600 mt-1">Silakan isi data diri Anda untuk mencatat kehadiran rapat malam ini.</p>
            </div>

            <form id="formAbsen" class="space-y-4">
                <div>
                    <label class="block text-xs font-semibold text-slate-700 mb-1">Nama Lengkap Warga</label>
                    <input type="text" id="namaWarga" required placeholder="Contoh: Budi Santoso" class="w-full px-4 py-3 rounded-xl border border-slate-200 text-sm focus:outline-none focus:border-emerald-600 bg-slate-50">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-700 mb-1">Nomor Rumah / Blok</label>
                    <input type="text" id="nomorRumah" required placeholder="Contoh: Blok B No. 12" class="w-full px-4 py-3 rounded-xl border border-slate-200 text-sm focus:outline-none focus:border-emerald-600 bg-slate-50">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-700 mb-1">Status Kehadiran</label>
                    <select id="statusHadir" class="w-full px-4 py-3 rounded-xl border border-slate-200 text-sm focus:outline-none focus:border-emerald-600 bg-slate-50">
                        <option value="Hadir">Hadir di Lokasi</option>
                        <option value="Izin">Izin (Berhalangan)</option>
                        <option value="Sakit">Sakit</option>
                    </select>
                </div>
                <button type="submit" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-semibold py-3.5 rounded-xl shadow-lg shadow-emerald-600/30 transition-all text-sm mt-4">
                    Kirim Kehadiran
                </button>
            </form>

            <div class="mt-8">
                <h3 class="font-bold text-slate-800 text-sm mb-3">Daftar Kehadiran Masuk</h3>
                <div id="listAbsen" class="space-y-2 text-xs">
                    <!-- Data realtime dari Firebase akan muncul di sini -->
                    <div class="p-3 bg-slate-50 rounded-xl border border-slate-100 flex justify-between items-center">
                        <div>
                            <span class="font-bold text-slate-700 block">Pak Joko (Blok A4)</span>
                            <span class="text-slate-400">19:10 WIB</span>
                        </div>
                        <span class="bg-emerald-100 text-emerald-700 px-2.5 py-1 rounded-full font-medium">Hadir</span>
                    </div>
                </div>
            </div>
        </div>

        <!-- Bottom Navigation -->
        <div class="absolute bottom-0 left-0 right-0 bg-white border-t border-slate-200 py-3 px-6 flex justify-around items-center">
            <a href="../index.html" class="text-slate-400 flex flex-col items-center text-xs">
                <i class="fa-solid fa-house text-lg mb-1"></i>
                <span>Home</span>
            </a>
            <a href="absensi.html" class="text-emerald-600 flex flex-col items-center text-xs font-semibold">
                <i class="fa-solid fa-qrcode text-lg mb-1"></i>
                <span>Absen</span>
            </a>
            <a href="rapat.html" class="text-slate-400 flex flex-col items-center text-xs">
                <i class="fa-solid fa-book-open text-lg mb-1"></i>
                <span>Rapat</span>
            </a>
            <a href="keuangan.html" class="text-slate-400 flex flex-col items-center text-xs">
                <i class="fa-solid fa-wallet text-lg mb-1"></i>
                <span>Kas</span>
            </a>
        </div>

    </div>

</body>
</html>
