<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Absensi Kehadiran - RT 05</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts: Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- HTML5 QR Code Library -->
    <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
    <style>
        .no-scrollbar::-webkit-scrollbar {
            display: none !important;
            width: 0px !important;
            height: 0px !important;
        }
        .no-scrollbar {
            -ms-overflow-style: none !important;
            scrollbar-width: none !important;
        }
    </style>
</head>
<body class="bg-slate-900 font-['Inter'] flex justify-center items-center h-screen overflow-hidden m-0">

    <!-- Toast Notification -->
    <div id="toastNotification" class="fixed top-6 left-1/2 transform -translate-x-1/2 bg-slate-900/95 border border-slate-700 text-white px-4 py-2.5 rounded-2xl shadow-2xl text-xs font-medium flex items-center space-x-2 z-50 transition-all duration-300 opacity-0 pointer-events-none translate-y-[-20px]">
        <div class="w-5 h-5 rounded-full bg-emerald-500 text-white flex items-center justify-center text-[10px] shadow">
            <i class="fa-solid fa-check"></i>
        </div>
        <span id="toastText">Berhasil!</span>
    </div>

    <!-- Container HP Frame -->
    <div class="w-full h-screen sm:max-w-[400px] sm:h-[92vh] sm:max-h-[820px] bg-slate-50 sm:rounded-[35px] shadow-2xl flex flex-col justify-between relative overflow-hidden sm:border-[6px] sm:border-slate-800">
        
        <!-- Header -->
        <div class="bg-gradient-to-b from-emerald-600 to-emerald-700 text-white p-5 rounded-b-[28px] flex items-center justify-between shrink-0">
            <a href="../home.html" class="w-9 h-9 rounded-full bg-white/10 flex items-center justify-center text-white backdrop-blur-sm transition-all hover:bg-white/20">
                <i class="fa-solid fa-arrow-left text-xs"></i>
            </a>
            <h1 class="font-bold text-sm tracking-wide">Absensi Kehadiran</h1>
            <div class="w-9"></div>
        </div>

        <!-- Content (Scrollable) -->
        <div class="p-4 flex-1 overflow-y-auto no-scrollbar pb-28 space-y-4">
            
            <div class="bg-emerald-50 border border-emerald-100 p-4 rounded-2xl">
                <h2 class="font-bold text-emerald-800 text-xs">Musyawarah Rutin Bulanan</h2>
                <p class="text-[11px] text-emerald-600 mt-1">Pilih metode absensi dengan Scan QR Code atau isi form manual (memerlukan password admin).</p>
            </div>

            <!-- Tab Pilihan Mode (Scan / Manual) -->
            <div class="flex bg-slate-200 p-1 rounded-xl">
                <button type="button" id="tabScan" onclick="switchAbsenMode('scan')" class="flex-1 py-2 text-xs font-semibold rounded-lg bg-white text-emerald-700 shadow-sm transition-all cursor-pointer">
                    <i class="fa-solid fa-qrcode mr-1"></i> Scan QR Code
                </button>
                <button type="button" id="tabManual" onclick="switchAbsenMode('manual')" class="flex-1 py-2 text-xs font-semibold rounded-lg text-slate-600 transition-all cursor-pointer">
                    <i class="fa-solid fa-pen-to-square mr-1"></i> Form Manual
                </button>
            </div>

            <!-- Bagian Kamera Scanner QR -->
            <div id="scanSection" class="bg-white p-4 rounded-2xl border border-slate-200/60 shadow-sm text-center">
                <h3 class="font-bold text-slate-800 text-xs mb-2">Arahkan Kamera ke QR Code Kehadiran</h3>
                <div id="reader" class="w-full rounded-xl overflow-hidden border border-slate-200 bg-slate-100"></div>
                <p id="scanStatus" class="text-[11px] text-slate-500 mt-2">Menyiapkan kamera...</p>
            </div>

            <!-- Bagian Form Manual -->
            <form id="formAbsen" class="space-y-3 bg-white p-4 rounded-2xl border border-slate-200/60 shadow-sm hidden">
                <div>
                    <label class="block text-xs font-semibold text-slate-700 mb-1">Nama Lengkap Warga</label>
                    <input type="text" id="namaWarga" required placeholder="Contoh: Budi Santoso" class="w-full px-3 py-2.5 rounded-xl border border-slate-200 text-xs focus:outline-none focus:border-emerald-600 bg-slate-50">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-700 mb-1">Status Kehadiran</label>
                    <select id="statusHadir" class="w-full px-3 py-2.5 rounded-xl border border-slate-200 text-xs focus:outline-none focus:border-emerald-600 bg-slate-50">
                        <option value="Hadir">Hadir di Lokasi</option>
                        <option value="Izin">Izin (Berhalangan)</option>
                        <option value="Sakit">Sakit</option>
                    </select>
                </div>
                <button type="submit" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-semibold py-2.5 rounded-xl shadow-md shadow-emerald-600/35 transition-all text-xs mt-2 cursor-pointer">
                    Kirim Kehadiran (Password Admin)
                </button>
            </form>

        </div>

        <!-- MODAL PASSWORD ADMIN -->
        <div id="adminPasswordModal" class="absolute inset-0 bg-black/50 backdrop-blur-[2px] z-50 flex items-center justify-center hidden p-4">
            <div class="w-full max-w-xs bg-white rounded-2xl p-5 shadow-2xl">
                <div class="flex justify-between items-center mb-3 pb-2 border-b border-slate-100">
                    <div class="flex items-center space-x-2">
                        <div class="w-6 h-6 rounded-lg bg-emerald-50 text-emerald-600 flex items-center justify-center text-[10px]">
                            <i class="fa-solid fa-lock"></i>
                        </div>
                        <h3 class="font-bold text-slate-800 text-xs">Verifikasi Password Admin</h3>
                    </div>
                    <button type="button" onclick="closeAdminModal()" class="w-6 h-6 rounded-full bg-slate-100 text-slate-500 hover:bg-slate-200 flex items-center justify-center text-[10px] cursor-pointer">
                        <i class="fa-solid fa-xmark"></i>
                    </button>
                </div>
                <div class="space-y-3">
                    <div>
                        <label class="block text-[11px] font-semibold text-slate-700 mb-1">Masukkan Password Admin</label>
                        <input type="password" id="adminPasswordInput" placeholder="Password admin" class="w-full px-3 py-2 rounded-xl border border-slate-200 text-xs focus:outline-none focus:border-emerald-600 bg-slate-50">
                    </div>
                    <div id="passwordError" class="text-red-500 text-[10px] hidden">Password salah!</div>
                    <div class="flex space-x-2">
                        <button type="button" onclick="closeAdminModal()" class="flex-1 bg-slate-200 hover:bg-slate-300 text-slate-700 font-semibold py-2 rounded-xl text-xs cursor-pointer">Batal</button>
                        <button type="button" onclick="verifyAndSubmit()" class="flex-1 bg-emerald-600 hover:bg-emerald-700 text-white font-semibold py-2 rounded-xl text-xs cursor-pointer">Konfirmasi</button>
                    </div>
                </div>
            </div>
        </div>

        <!-- Tempat Include Bottom Navigation -->
        <div id="nav-container"></div>

    </div>

    <!-- Skrip Integrasi & Scanner QR -->
    <script type="module">
        import { renderNavigation } from "../assets/js/navigation.js";
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { getFirestore, collection, addDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        // Render Navigasi Bawah
        document.getElementById('nav-container').innerHTML = renderNavigation('absensi', true);

        // Toast Notification
        window.showToast = function(message) {
            const toast = document.getElementById('toastNotification');
            const toastText = document.getElementById('toastText');
            toastText.innerText = message;
            toast.classList.remove('opacity-0', 'pointer-events-none', 'translate-y-[-20px]');
            toast.classList.add('opacity-100', 'translate-y-0');
            setTimeout(() => {
                toast.classList.remove('opacity-100', 'translate-y-0');
                toast.classList.add('opacity-0', 'pointer-events-none', 'translate-y-[-20px]');
            }, 1800);
        }

        // Konfigurasi Firebase
        const firebaseConfig = {
            apiKey: "AIzaSyBx2AF0YRpOEq--q__dn39NwiNCKXvKutM",
            authDomain: "erte-979ca.firebaseapp.com",
            projectId: "erte-979ca",
            storageBucket: "erte-979ca.firebasestorage.app",
            messagingSenderId: "329513636032",
            appId: "1:329513636032:web:25a10b627b91db2bbb5d25"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        let currentUser = null;
        onAuthStateChanged(auth, (user) => {
            if (user) {
                currentUser = user;
                document.getElementById('namaWarga').value = user.displayName || "Warga";
            }
        });

        // Switch Mode Absen (Scan vs Manual)
        let html5QrCode = null;
        window.switchAbsenMode = function(mode) {
            const tabScan = document.getElementById('tabScan');
            const tabManual = document.getElementById('tabManual');
            const scanSection = document.getElementById('scanSection');
            const formAbsen = document.getElementById('formAbsen');

            if (mode === 'scan') {
                tabScan.className = "flex-1 py-2 text-xs font-semibold rounded-lg bg-white text-emerald-700 shadow-sm transition-all cursor-pointer";
                tabManual.className = "flex-1 py-2 text-xs font-semibold rounded-lg text-slate-600 transition-all cursor-pointer";
                scanSection.classList.remove('hidden');
                formAbsen.classList.add('hidden');
                startScanner();
            } else {
                tabManual.className = "flex-1 py-2 text-xs font-semibold rounded-lg bg-white text-emerald-700 shadow-sm transition-all cursor-pointer";
                tabScan.className = "flex-1 py-2 text-xs font-semibold rounded-lg text-slate-600 transition-all cursor-pointer";
                formAbsen.classList.remove('hidden');
                scanSection.classList.add('hidden');
                stopScanner();
            }
        };

        // Inisialisasi QR Scanner
        function startScanner() {
            if (!html5QrCode) {
                html5QrCode = new Html5Qrcode("reader");
            }
            html5QrCode.start(
                { facingMode: "environment" },
                { fps: 10, qrbox: { width: 200, height: 200 } },
                async (decodedText) => {
                    document.getElementById('scanStatus').innerText = `Berhasil Scan: ${decodedText}`;
                    await simpanAbsensiDatabase(decodedText, "Hadir (Scan QR)");
                    stopScanner();
                },
                (errorMessage) => {}
            ).catch((err) => {
                document.getElementById('scanStatus').innerText = "Gagal membuka kamera. Pastikan izin kamera diberikan.";
            });
        }

        function stopScanner() {
            if (html5QrCode && html5QrCode.isScanning) {
                html5QrCode.stop().catch(err => console.log(err));
            }
        }

        // Simpan ke Firestore
        async function simpanAbsensiDatabase(nama, status) {
            try {
                await addDoc(collection(db, "absensi"), {
                    nama: nama,
                    status: status,
                    waktu: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }),
                    createdAt: serverTimestamp()
                });
                showToast(`Absensi ${nama} berhasil dicatat!`);
            } catch (error) {
                alert("Gagal menyimpan absensi: " + error.message);
            }
        }

        // Intersepsi Form Manual
        const formAbsen = document.getElementById('formAbsen');
        formAbsen.addEventListener('submit', (e) => {
            e.preventDefault();
            document.getElementById('adminPasswordInput').value = "";
            document.getElementById('passwordError').classList.add('hidden');
            document.getElementById('adminPasswordModal').classList.remove('hidden');
        });

        window.closeAdminModal = function() {
            document.getElementById('adminPasswordModal').classList.add('hidden');
        };

        // Verifikasi Password Admin
        window.verifyAndSubmit = async function() {
            const passInput = document.getElementById('adminPasswordInput').value;
            const correctPassword = "rt05jaya"; // Ganti password admin di sini jika perlu

            if (passInput === correctPassword) {
                closeAdminModal();
                const nama = document.getElementById('namaWarga').value.trim();
                const status = document.getElementById('statusHadir').value;

                await simpanAbsensiDatabase(nama, status);
                formAbsen.reset();
            } else {
                document.getElementById('passwordError').classList.remove('hidden');
            }
        };

        // Jalankan scanner otomatis saat halaman dibuka
        window.addEventListener('load', () => {
            startScanner();
        });
    </script>
</body>
</html>
