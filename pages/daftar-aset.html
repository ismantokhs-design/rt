<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Manajemen Aset - Aplikasi RT-Ku</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts: Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        .no-scrollbar::-webkit-scrollbar {
            display: none !important;
            width: 0px !important;
            height: 0px !important;
        }
        .no-scrollbar {
            -ms-overflow-style: none !important;
            scrollbar-width: none !important;
        }
    </style>
</head>
<body class="bg-slate-900 font-['Inter'] flex justify-center items-center h-screen overflow-hidden m-0">

    <!-- Container HP Frame -->
    <div class="w-full h-screen sm:max-w-[400px] sm:h-[92vh] sm:max-h-[820px] bg-slate-50 sm:rounded-[35px] shadow-2xl flex flex-col justify-between relative overflow-hidden sm:border-[6px] sm:border-slate-800">
        
        <!-- Header -->
        <div class="bg-gradient-to-b from-emerald-600 to-emerald-700 text-white p-4 rounded-none flex items-center justify-between shrink-0 z-25">
            <a href="inventaris.html" class="w-9 h-9 rounded-none bg-white/10 flex items-center justify-center text-white backdrop-blur-sm transition-all hover:bg-white/20 cursor-pointer" title="Kembali ke Inventaris">
                <i class="fa-solid fa-arrow-left text-xs"></i>
            </a>
            <h1 class="font-bold text-sm tracking-wide">Manajemen Aset RT</h1>
            <div class="flex items-center space-x-1.5">
                <!-- Tombol Tambah Aset -->
                <button onclick="bukaModalTambah()" class="w-9 h-9 rounded-none bg-white/10 flex items-center justify-center text-white backdrop-blur-sm transition-all hover:bg-white/20 text-xs cursor-pointer" title="Tambah Aset">
                    <i class="fa-solid fa-plus"></i>
                </button>
            </div>
        </div>

        <!-- Ringkasan / Info Card -->
        <div class="p-4 pb-2 bg-white border-b border-slate-200 shrink-0 space-y-2">
            <div class="bg-emerald-50 p-3 border border-emerald-100 flex items-center justify-between">
                <div class="flex items-center space-x-2.5">
                    <div class="w-8 h-8 bg-emerald-600 text-white flex items-center justify-center text-xs">
                        <i class="fa-solid fa-vault"></i>
                    </div>
                    <div>
                        <span class="text-[10px] text-emerald-800 block font-medium">Total Jenis Aset / Inventaris</span>
                        <b id="totalJenisAset" class="text-xs text-emerald-900 font-bold">0 Item</b>
                    </div>
                </div>
                <div class="text-right">
                    <span class="text-[10px] text-emerald-800 block font-medium">Total Nilai Perkiraan</span>
                    <b id="totalNilaiAset" class="text-xs text-emerald-700 font-bold">Rp 0</b>
                </div>
            </div>
        </div>

        <!-- Content (Scrollable List Aset) -->
        <div class="p-4 flex-1 overflow-y-auto no-scrollbar space-y-3 text-xs">
            <div class="space-y-2.5" id="listAsetContainer">
                <div class="text-center py-8 text-slate-400">Memuat data aset...</div>
            </div>
        </div>

        <!-- Footer Info -->
        <div class="p-3 text-center border-t border-slate-200 bg-white/50 text-[10px] text-slate-400 shrink-0">
            Aplikasi RT-Ku &copy; 2026
        </div>

    </div>

    <!-- Modal Form Tambah / Edit Aset -->
    <div id="modalAset" class="fixed inset-0 bg-slate-900/60 z-50 hidden flex items-center justify-center p-4 backdrop-blur-sm">
        <div class="bg-white w-full max-w-[340px] rounded-none shadow-xl border border-slate-200 overflow-hidden">
            <div class="bg-emerald-600 text-white p-3.5 flex items-center justify-between">
                <h3 id="modalTitle" class="font-bold text-xs">Tambah Aset Baru</h3>
                <button onclick="tutupModal()" class="text-white hover:text-slate-200 cursor-pointer">
                    <i class="fa-solid fa-xmark text-sm"></i>
                </button>
            </div>
            <form id="formAset" onsubmit="simpanAset(event)" class="p-4 space-y-3 text-xs">
                <input type="hidden" id="editId">
                
                <!-- Kategori Aset -->
                <div>
                    <div class="flex items-center justify-between mb-1">
                        <label class="text-[10px] font-semibold text-slate-600">Kategori Aset</label>
                        <button type="button" onclick="bukaModalKategori()" class="text-[10px] text-emerald-600 hover:text-emerald-700 font-bold flex items-center cursor-pointer">
                            <i class="fa-solid fa-gear mr-1"></i> Atur Kategori
                        </button>
                    </div>
                    <select id="kategoriAset" required onchange="generateKodeAsetOtomatis()" class="w-full px-3 py-2 border border-slate-200 text-xs bg-slate-50 focus:outline-none focus:border-emerald-600 font-medium cursor-pointer">
                        <option value="">-- Pilih Kategori --</option>
                    </select>
                </div>

                <div>
                    <label class="block text-[10px] font-semibold text-slate-600 mb-1">Kode Aset / Inventaris (Otomatis)</label>
                    <input type="text" id="kodeAset" required readonly class="w-full px-3 py-2 border border-slate-200 text-xs bg-slate-100 font-bold text-slate-700 cursor-not-allowed">
                </div>
                <div>
                    <label class="block text-[10px] font-semibold text-slate-600 mb-1">Nama Barang / Aset</label>
                    <input type="text" id="namaAset" required placeholder="Contoh: Tenda RT, Sound System" class="w-full px-3 py-2 border border-slate-200 text-xs bg-slate-50 focus:outline-none focus:border-emerald-600 font-medium">
                </div>
                <div class="grid grid-cols-2 gap-2">
                    <div>
                        <label class="block text-[10px] font-semibold text-slate-600 mb-1">Jumlah</label>
                        <input type="number" id="jumlahAset" required min="1" value="1" class="w-full px-3 py-2 border border-slate-200 text-xs bg-slate-50 focus:outline-none focus:border-emerald-600 font-medium">
                    </div>
                    <div>
                        <div class="flex items-center justify-between mb-1">
                            <label class="text-[10px] font-semibold text-slate-600">Satuan</label>
                            <button type="button" onclick="bukaModalSatuan()" class="text-[9px] text-emerald-600 hover:text-emerald-700 font-bold flex items-center cursor-pointer">
                                <i class="fa-solid fa-gear mr-0.5"></i> Atur
                            </button>
                        </div>
                        <select id="satuanAset" required class="w-full px-3 py-2 border border-slate-200 text-xs bg-slate-50 focus:outline-none focus:border-emerald-600 font-medium cursor-pointer">
                            <option value="">-- Pilih --</option>
                        </select>
                    </div>
                </div>

                <!-- Harga Sewa Warga & Umum -->
                <div class="grid grid-cols-2 gap-2">
                    <div>
                        <label class="block text-[10px] font-semibold text-slate-600 mb-1">Harga Sewa (Warga)</label>
                        <input type="text" id="hargaWarga" required value="0" oninput="formatInputRibuan(this)" class="w-full px-3 py-2 border border-slate-200 text-xs bg-slate-50 focus:outline-none focus:border-emerald-600 font-medium">
                    </div>
                    <div>
                        <label class="block text-[10px] font-semibold text-slate-600 mb-1">Harga Sewa (Umum)</label>
                        <input type="text" id="hargaUmum" required value="0" oninput="formatInputRibuan(this)" class="w-full px-3 py-2 border border-slate-200 text-xs bg-slate-50 focus:outline-none focus:border-emerald-600 font-medium">
                    </div>
                </div>

                <div>
                    <label class="block text-[10px] font-semibold text-slate-600 mb-1">Kondisi</label>
                    <select id="kondisiAset" class="w-full px-3 py-2 border border-slate-200 text-xs bg-slate-50 focus:outline-none focus:border-emerald-600 font-medium cursor-pointer">
                        <option value="Baik">Baik</option>
                        <option value="Kurang Baik">Kurang Baik</option>
                        <option value="Rusak Berat">Rusak Berat</option>
                    </select>
                </div>
                <div>
                    <label class="block text-[10px] font-semibold text-slate-600 mb-1">Estimasi Nilai Total (Rp)</label>
                    <input type="text" id="nilaiAset" required value="0" oninput="formatInputRibuan(this)" placeholder="Contoh: 1.500.000" class="w-full px-3 py-2 border border-slate-200 text-xs bg-slate-50 focus:outline-none focus:border-emerald-600 font-medium">
                </div>
                <div>
                    <div class="flex items-center justify-between mb-1">
                        <label class="text-[10px] font-semibold text-slate-600">Lokasi Simpan / Keterangan</label>
                        <button type="button" onclick="bukaModalLokasi()" class="text-[10px] text-emerald-600 hover:text-emerald-700 font-bold flex items-center cursor-pointer">
                            <i class="fa-solid fa-gear mr-1"></i> Atur Lokasi
                        </button>
                    </div>
                    <select id="keteranganAset" class="w-full px-3 py-2 border border-slate-200 text-xs bg-slate-50 focus:outline-none focus:border-emerald-600 font-medium cursor-pointer">
                        <option value="">-- Pilih Lokasi Simpan --</option>
                    </select>
                </div>
                <div class="pt-2 flex space-x-2">
                    <button type="button" onclick="tutupModal()" class="flex-1 py-2 border border-slate-200 text-slate-600 font-semibold cursor-pointer hover:bg-slate-50">Batal</button>
                    <button type="submit" class="flex-1 py-2 bg-emerald-600 text-white font-semibold cursor-pointer hover:bg-emerald-700">Simpan</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Modal Pengaturan Daftar Kategori Aset -->
    <div id="modalKategori" class="fixed inset-0 bg-slate-900/60 z-50 hidden flex items-center justify-center p-4 backdrop-blur-sm">
        <div class="bg-white w-full max-w-[320px] rounded-none shadow-xl border border-slate-200 overflow-hidden">
            <div class="bg-sky-600 text-white p-3.5 flex items-center justify-between">
                <h3 class="font-bold text-xs">Kelola Kategori & Kode</h3>
                <button onclick="tutupModalKategori()" class="text-white hover:text-slate-200 cursor-pointer">
                    <i class="fa-solid fa-xmark text-sm"></i>
                </button>
            </div>
            <div class="p-4 space-y-3 text-xs">
                <div class="space-y-2">
                    <div>
                        <label class="block text-[9px] font-semibold text-slate-500 mb-1">Kode Kategori (Otomatis)</label>
                        <input type="text" id="inputKodeKategoriBaru" readonly class="w-full px-3 py-1.5 border border-slate-200 text-xs bg-slate-100 font-bold text-slate-700 cursor-not-allowed">
                    </div>
                    <div>
                        <label class="block text-[9px] font-semibold text-slate-500 mb-1">Nama Kategori</label>
                        <input type="text" id="inputNamaKategoriBaru" placeholder="Contoh: Elektronik, Inventaris" class="w-full px-3 py-1.5 border border-slate-200 text-xs bg-slate-50 focus:outline-none focus:border-sky-600">
                    </div>
                    <button type="button" onclick="tambahKategoriBaru()" class="w-full py-2 bg-sky-600 text-white font-semibold cursor-pointer hover:bg-sky-700">Tambah Kategori</button>
                </div>
                <div class="max-h-36 overflow-y-auto border border-slate-100 divide-y divide-slate-100" id="listKategoriContainer"></div>
                <div class="pt-1">
                    <button type="button" onclick="tutupModalKategori()" class="w-full py-2 bg-slate-200 text-slate-700 font-semibold cursor-pointer hover:bg-slate-300">Selesai</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Modal Pengaturan Daftar Satuan -->
    <div id="modalSatuan" class="fixed inset-0 bg-slate-900/60 z-50 hidden flex items-center justify-center p-4 backdrop-blur-sm">
        <div class="bg-white w-full max-w-[320px] rounded-none shadow-xl border border-slate-200 overflow-hidden">
            <div class="bg-sky-600 text-white p-3.5 flex items-center justify-between">
                <h3 class="font-bold text-xs">Kelola Satuan Barang</h3>
                <button onclick="tutupModalSatuan()" class="text-white hover:text-slate-200 cursor-pointer">
                    <i class="fa-solid fa-xmark text-sm"></i>
                </button>
            </div>
            <div class="p-4 space-y-3 text-xs">
                <div class="flex space-x-2">
                    <input type="text" id="inputSatuanBaru" placeholder="Nama satuan baru (Cth: Unit, Buah)..." class="w-full px-3 py-1.5 border border-slate-200 text-xs bg-slate-50 focus:outline-none focus:border-sky-600">
                    <button type="button" onclick="tambahSatuanBaru()" class="px-3 py-1.5 bg-sky-600 text-white font-semibold cursor-pointer hover:bg-sky-700 shrink-0">Tambah</button>
                </div>
                <div class="max-h-40 overflow-y-auto border border-slate-100 divide-y divide-slate-100" id="listSatuanContainer"></div>
                <div class="pt-1">
                    <button type="button" onclick="tutupModalSatuan()" class="w-full py-2 bg-slate-200 text-slate-700 font-semibold cursor-pointer hover:bg-slate-300">Selesai</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Modal Pengaturan Daftar Lokasi Simpan -->
    <div id="modalLokasi" class="fixed inset-0 bg-slate-900/60 z-50 hidden flex items-center justify-center p-4 backdrop-blur-sm">
        <div class="bg-white w-full max-w-[320px] rounded-none shadow-xl border border-slate-200 overflow-hidden">
            <div class="bg-sky-600 text-white p-3.5 flex items-center justify-between">
                <h3 class="font-bold text-xs">Kelola Daftar Lokasi Simpan</h3>
                <button onclick="tutupModalLokasi()" class="text-white hover:text-slate-200 cursor-pointer">
                    <i class="fa-solid fa-xmark text-sm"></i>
                </button>
            </div>
            <div class="p-4 space-y-3 text-xs">
                <div class="flex space-x-2">
                    <input type="text" id="inputLokasiBaru" placeholder="Nama lokasi baru..." class="w-full px-3 py-1.5 border border-slate-200 text-xs bg-slate-50 focus:outline-none focus:border-sky-600">
                    <button type="button" onclick="tambahLokasiBaru()" class="px-3 py-1.5 bg-sky-600 text-white font-semibold cursor-pointer hover:bg-sky-700 shrink-0">Tambah</button>
                </div>
                <div class="max-h-40 overflow-y-auto border border-slate-100 divide-y divide-slate-100" id="listLokasiContainer"></div>
                <div class="pt-1">
                    <button type="button" onclick="tutupModalLokasi()" class="w-full py-2 bg-slate-200 text-slate-700 font-semibold cursor-pointer hover:bg-slate-300">Selesai</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Skrip Firebase & Logika Aset -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { getFirestore, collection, onSnapshot, query, orderBy, addDoc, updateDoc, deleteDoc, doc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBx2AF0YRpOEq--q__dn39NwiNCKXvKutM",
            authDomain: "erte-979ca.firebaseapp.com",
            projectId: "erte-979ca",
            storageBucket: "erte-979ca.firebasestorage.app",
            messagingSenderId: "329513636032",
            appId: "1:329513636032:web:25a10b627b91db2bbb5d25"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        let dataAsetList = [];
        let dataLokasiList = [];
        let dataKategoriList = [];
        let dataSatuanList = [];

        function formatRupiah(angka) {
            return new Intl.NumberFormat('id-ID', { style: 'currency', currency: 'IDR', maximumFractionDigits: 0 }).format(angka).replace('Rp', 'Rp ');
        }

        window.formatInputRibuan = function(input) {
            let value = input.value.replace(/[^,\d]/g, '').toString();
            let split = value.split(',');
            let sisa = split[0].length % 3;
            let rupiah = split[0].substr(0, sisa);
            let ribuan = split[0].substr(sisa).match(/\d{3}/gi);

            if (ribuan) {
                let separator = sisa ? '.' : '';
                rupiah += separator + ribuan.join('.');
            }

            rupiah = split[1] !== undefined ? rupiah + ',' + split[1] : rupiah;
            input.value = rupiah;
        }

        function parseAngka(str) {
            if (!str) return 0;
            return Number(String(str).replace(/\./g, '')) || 0;
        }

        window.bukaModalTambah = function() {
            document.getElementById('modalTitle').innerText = "Tambah Aset Baru";
            document.getElementById('editId').value = "";
            document.getElementById('formAset').reset();
            document.getElementById('kodeAset').value = "";
            document.getElementById('hargaWarga').value = "0";
            document.getElementById('hargaUmum').value = "0";
            document.getElementById('nilaiAset').value = "0";
            document.getElementById('modalAset').classList.remove('hidden');
        }

        window.tutupModal = function() {
            document.getElementById('modalAset').classList.add('hidden');
        }

        window.bukaModalEdit = function(id) {
            const aset = dataAsetList.find(item => item.id === id);
            if (!aset) return;

            document.getElementById('modalTitle').innerText = "Edit Data Aset";
            document.getElementById('editId').value = aset.id;
            document.getElementById('kategoriAset').value = aset.kategori || "";
            document.getElementById('kodeAset').value = aset.kode || "";
            document.getElementById('namaAset').value = aset.nama || "";
            document.getElementById('jumlahAset').value = aset.jumlah || 1;
            document.getElementById('satuanAset').value = aset.satuan || "";
            document.getElementById('hargaWarga').value = new Intl.NumberFormat('id-ID').format(aset.hargaWarga || 0);
            document.getElementById('hargaUmum').value = new Intl.NumberFormat('id-ID').format(aset.hargaUmum || 0);
            document.getElementById('kondisiAset').value = aset.kondisi || "Baik";
            document.getElementById('nilaiAset').value = new Intl.NumberFormat('id-ID').format(aset.nilai || 0);
            document.getElementById('keteranganAset').value = aset.keterangan || "";
            document.getElementById('modalAset').classList.remove('hidden');
        }

        window.generateKodeAsetOtomatis = function() {
            const editId = document.getElementById('editId').value;
            if (editId) return;

            const kategoriSelectVal = document.getElementById('kategoriAset').value;
            if (!kategoriSelectVal) {
                document.getElementById('kodeAset').value = "";
                return;
            }

            const kodeKategori = kategoriSelectVal.split(" - ")[0].trim();
            const now = new Date();
            const mm = String(now.getMonth() + 1).padStart(2, '0');
            const yy = String(now.getFullYear()).slice(-2);
            const mmyy = `${mm}${yy}`;

            let maxUrut = 0;
            const prefixTarget = `AST-${kodeKategori}-${mmyy}-`;

            dataAsetList.forEach(item => {
                const kodeLama = String(item.kode || "").trim();
                if (kodeLama.startsWith(prefixTarget)) {
                    const noUrutStr = kodeLama.replace(prefixTarget, "");
                    const noUrutNum = parseInt(noUrutStr, 10);
                    if (!isNaN(noUrutNum) && noUrutNum > maxUrut) {
                        maxUrut = noUrutNum;
                    }
                }
            });

            const nextUrutNum = maxUrut + 1;
            const nomorUrutFormatted = String(nextUrutNum).padStart(3, '0');

            const kodeFinal = `AST-${kodeKategori}-${mmyy}-${nomorUrutFormatted}`;
            document.getElementById('kodeAset').value = kodeFinal;
        }

        function updateAutoKodeKategori() {
            const nextNumber = dataKategoriList.length + 1;
            document.getElementById('inputKodeKategoriBaru').value = String(nextNumber).padStart(2, '0');
        }

        // Kategori Modals
        window.bukaModalKategori = function() {
            updateAutoKodeKategori();
            document.getElementById('inputNamaKategoriBaru').value = "";
            renderListKategoriModal();
            document.getElementById('modalKategori').classList.remove('hidden');
        }

        window.tutupModalKategori = function() {
            document.getElementById('modalKategori').classList.add('hidden');
        }

        window.tambahKategoriBaru = async function() {
            const kode = document.getElementById('inputKodeKategoriBaru').value.trim();
            const nama = document.getElementById('inputNamaKategoriBaru').value.trim();
            if (!nama) return alert("Nama Kategori harus diisi!");

            try {
                await addDoc(collection(db, "masterKategoriAset"), { kode: kode, nama: nama });
                document.getElementById('inputNamaKategoriBaru').value = "";
            } catch (error) {
                console.error("Gagal menambah kategori:", error);
            }
        }

        window.hapusKategori = async function(id) {
            if (confirm("Hapus kategori ini dari daftar?")) {
                try {
                    await deleteDoc(doc(db, "masterKategoriAset", id));
                } catch (error) {
                    console.error("Gagal menghapus kategori:", error);
                }
            }
        }

        function updateDropdownKategori(selectedValue = "") {
            const select = document.getElementById('kategoriAset');
            let html = `<option value="">-- Pilih Kategori --</option>`;
            dataKategoriList.forEach(kat => {
                const label = `${kat.kode} - ${kat.nama}`;
                const selected = (label === selectedValue || kat.nama === selectedValue) ? "selected" : "";
                html += `<option value="${label}" ${selected}>${label}</option>`;
            });
            select.innerHTML = html;
        }

        function renderListKategoriModal() {
            const container = document.getElementById('listKategoriContainer');
            let html = "";
            dataKategoriList.forEach(kat => {
                html += `
                    <div class="p-2 flex items-center justify-between text-slate-700">
                        <span><b>[${kat.kode}]</b> ${kat.nama}</span>
                        <button type="button" onclick="hapusKategori('${kat.id}')" class="text-red-500 hover:text-red-700 cursor-pointer p-1">
                            <i class="fa-solid fa-trash text-xs"></i>
                        </button>
                    </div>
                `;
            });
            if (html === "") {
                html = `<div class="p-3 text-center text-slate-400">Belum ada kategori.</div>`;
            }
            container.innerHTML = html;
        }

        // Satuan Modals
        window.bukaModalSatuan = function() {
            document.getElementById('inputSatuanBaru').value = "";
            renderListSatuanModal();
            document.getElementById('modalSatuan').classList.remove('hidden');
        }

        window.tutupModalSatuan = function() {
            document.getElementById('modalSatuan').classList.add('hidden');
        }

        window.tambahSatuanBaru = async function() {
            const namaSatuan = document.getElementById('inputSatuanBaru').value.trim();
            if (!namaSatuan) return alert("Nama satuan tidak boleh kosong!");

            try {
                await addDoc(collection(db, "masterSatuanAset"), { nama: namaSatuan });
                document.getElementById('inputSatuanBaru').value = "";
            } catch (error) {
                console.error("Gagal menambah satuan:", error);
            }
        }

        window.hapusSatuan = async function(id) {
            if (confirm("Hapus satuan ini dari daftar?")) {
                try {
                    await deleteDoc(doc(db, "masterSatuanAset", id));
                } catch (error) {
                    console.error("Gagal menghapus satuan:", error);
                }
            }
        }

        function updateDropdownSatuan(selectedValue = "") {
            const select = document.getElementById('satuanAset');
            let html = `<option value="">-- Pilih --</option>`;
            dataSatuanList.forEach(sat => {
                const selected = (sat.nama === selectedValue) ? "selected" : "";
                html += `<option value="${sat.nama}" ${selected}>${sat.nama}</option>`;
            });
            select.innerHTML = html;
        }

        function renderListSatuanModal() {
            const container = document.getElementById('listSatuanContainer');
            let html = "";
            dataSatuanList.forEach(sat => {
                html += `
                    <div class="p-2 flex items-center justify-between text-slate-700">
                        <span>${sat.nama}</span>
                        <button type="button" onclick="hapusSatuan('${sat.id}')" class="text-red-500 hover:text-red-700 cursor-pointer p-1">
                            <i class="fa-solid fa-trash text-xs"></i>
                        </button>
                    </div>
                `;
            });
            if (html === "") {
                html = `<div class="p-3 text-center text-slate-400">Belum ada daftar satuan.</div>`;
            }
            container.innerHTML = html;
        }

        // Lokasi Modals
        window.bukaModalLokasi = function() {
            document.getElementById('inputLokasiBaru').value = "";
            renderListLokasiModal();
            document.getElementById('modalLokasi').classList.remove('hidden');
        }

        window.tutupModalLokasi = function() {
            document.getElementById('modalLokasi').classList.add('hidden');
        }

        window.tambahLokasiBaru = async function() {
            const namaLokasi = document.getElementById('inputLokasiBaru').value.trim();
            if (!namaLokasi) return alert("Nama lokasi tidak boleh kosong!");

            try {
                await addDoc(collection(db, "masterLokasiAset"), { nama: namaLokasi });
                document.getElementById('inputLokasiBaru').value = "";
            } catch (error) {
                console.error("Gagal menambah lokasi:", error);
            }
        }

        window.hapusLokasi = async function(id) {
            if (confirm("Hapus lokasi simpan ini dari daftar?")) {
                try {
                    await deleteDoc(doc(db, "masterLokasiAset", id));
                } catch (error) {
                    console.error("Gagal menghapus lokasi:", error);
                }
            }
        }

        function updateDropdownLokasi(selectedValue = "") {
            const select = document.getElementById('keteranganAset');
            let html = `<option value="">-- Pilih Lokasi Simpan --</option>`;
            dataLokasiList.forEach(loc => {
                const selected = (loc.nama === selectedValue) ? "selected" : "";
                html += `<option value="${loc.nama}" ${selected}>${loc.nama}</option>`;
            });
            select.innerHTML = html;
        }

        function renderListLokasiModal() {
            const container = document.getElementById('listLokasiContainer');
            let html = "";
            dataLokasiList.forEach(loc => {
                html += `
                    <div class="p-2 flex items-center justify-between text-slate-700">
                        <span>${loc.nama}</span>
                        <button type="button" onclick="hapusLokasi('${loc.id}')" class="text-red-500 hover:text-red-700 cursor-pointer p-1">
                            <i class="fa-solid fa-trash text-xs"></i>
                        </button>
                    </div>
                `;
            });
            if (html === "") {
                html = `<div class="p-3 text-center text-slate-400">Belum ada daftar lokasi.</div>`;
            }
            container.innerHTML = html;
        }

        window.simpanAset = async function(event) {
            event.preventDefault();
            const id = document.getElementById('editId').value;
            const payload = {
                kategori: document.getElementById('kategoriAset').value,
                kode: document.getElementById('kodeAset').value.trim(),
                nama: document.getElementById('namaAset').value.trim(),
                jumlah: Number(document.getElementById('jumlahAset').value),
                satuan: document.getElementById('satuanAset').value,
                hargaWarga: parseAngka(document.getElementById('hargaWarga').value),
                hargaUmum: parseAngka(document.getElementById('hargaUmum').value),
                kondisi: document.getElementById('kondisiAset').value,
                nilai: parseAngka(document.getElementById('nilaiAset').value),
                keterangan: document.getElementById('keteranganAset').value,
                updatedAt: new Date().toISOString().split('T')[0]
            };

            try {
                if (id) {
                    await updateDoc(doc(db, "asetRt", id), payload);
                } else {
                    await addDoc(collection(db, "asetRt"), payload);
                }
                tutupModal();
            } catch (error) {
                console.error("Gagal menyimpan aset:", error);
                alert("Terjadi kesalahan saat menyimpan data.");
            }
        }

        window.hapusAset = async function(id) {
            if (confirm("Apakah Anda yakin ingin menghapus data aset ini?")) {
                try {
                    await deleteDoc(doc(db, "asetRt", id));
                } catch (error) {
                    console.error("Gagal menghapus aset:", error);
                }
            }
        }

        function renderAset() {
            const container = document.getElementById('listAsetContainer');
            let html = "";
            let totalNilaiSemua = 0;

            dataAsetList.sort((a, b) => String(a.kode || "").localeCompare(String(b.kode || ""), undefined, { numeric: true }));

            dataAsetList.forEach(item => {
                const nilai = Number(item.nilai || 0);
                const hrgWarga = Number(item.hargaWarga || 0);
                const hrgUmum = Number(item.hargaUmum || 0);
                totalNilaiSemua += nilai;

                let badgeColor = "bg-emerald-100 text-emerald-700";
                if (item.kondisi === "Kurang Baik") badgeColor = "bg-amber-100 text-amber-700";
                else if (item.kondisi === "Rusak Berat") badgeColor = "bg-red-100 text-red-700";

                html += `
                    <div class="bg-white p-3 border border-slate-200/70 shadow-sm space-y-2">
                        <div class="flex items-center justify-between border-b border-slate-100 pb-1.5">
                            <div>
                                ${item.kategori ? `<span class="text-[9px] bg-slate-100 text-slate-600 px-1.5 py-0.5 rounded font-bold mr-1">${item.kategori}</span>` : ''}
                                <span class="font-bold text-slate-800 text-[11px]">${item.kode || '-'} - ${item.nama}</span>
                            </div>
                            <span class="text-[9px] px-2 py-0.5 rounded font-bold ${badgeColor}">${item.kondisi}</span>
                        </div>
                        <div class="grid grid-cols-2 gap-1 text-[11px] text-slate-600">
                            <div>Jumlah: <b class="text-slate-800">${item.jumlah} ${item.satuan || 'Unit'}</b></div>
                            <div class="text-right">Estimasi Nilai: <b class="text-emerald-600">${formatRupiah(nilai)}</b></div>
                        </div>
                        <div class="bg-slate-50 p-1.5 border border-slate-100 grid grid-cols-2 text-[10px] text-slate-600">
                            <div>Sewa Warga: <b class="text-slate-800">${formatRupiah(hrgWarga)}</b></div>
                            <div class="text-right">Sewa Umum: <b class="text-slate-800">${formatRupiah(hrgUmum)}</b></div>
                        </div>
                        ${item.keterangan ? `<div class="text-[10px] text-slate-400 italic">Lokasi: ${item.keterangan}</div>` : ''}
                        <div class="flex justify-end space-x-1.5 pt-1 border-t border-slate-50">
                            <button onclick="bukaModalEdit('${item.id}')" class="px-2.5 py-1 bg-sky-50 text-sky-600 text-[10px] font-semibold hover:bg-sky-100 cursor-pointer">
                                <i class="fa-solid fa-pen-to-square mr-1"></i> Edit
                            </button>
                            <button onclick="hapusAset('${item.id}')" class="px-2.5 py-1 bg-red-50 text-red-600 text-[10px] font-semibold hover:bg-red-100 cursor-pointer">
                                <i class="fa-solid fa-trash mr-1"></i> Hapus
                            </button>
                        </div>
                    </div>
                `;
            });

            if (html === "") {
                html = `<div class="text-center py-8 text-slate-400">Belum ada data aset RT yang tercatat.</div>`;
            }

            container.innerHTML = html;
            document.getElementById('totalJenisAset').innerText = `${dataAsetList.length} Item`;
            document.getElementById('totalNilaiAset').innerText = formatRupiah(totalNilaiSemua);
        }

        // Real-time listener koleksi 'asetRt'
        const qAset = query(collection(db, "asetRt"), orderBy("kode", "asc"));
        onSnapshot(qAset, (snapshot) => {
            dataAsetList = [];
            snapshot.forEach((docSnap) => {
                dataAsetList.push({ id: docSnap.id, ...docSnap.data() });
            });
            renderAset();
        });

        // Real-time listener koleksi 'masterLokasiAset'
        const qLokasi = query(collection(db, "masterLokasiAset"), orderBy("nama", "asc"));
        onSnapshot(qLokasi, (snapshot) => {
            dataLokasiList = [];
            snapshot.forEach((docSnap) => {
                dataLokasiList.push({ id: docSnap.id, ...docSnap.data() });
            });
            const currentSelected = document.getElementById('keteranganAset').value;
            updateDropdownLokasi(currentSelected);
            if (!document.getElementById('modalLokasi').classList.contains('hidden')) {
                renderListLokasiModal();
            }
        });

        // Real-time listener koleksi 'masterSatuanAset'
        const qSatuan = query(collection(db, "masterSatuanAset"), orderBy("nama", "asc"));
        onSnapshot(qSatuan, (snapshot) => {
            dataSatuanList = [];
            snapshot.forEach((docSnap) => {
                dataSatuanList.push({ id: docSnap.id, ...docSnap.data() });
            });
            const currentSelected = document.getElementById('satuanAset').value;
            updateDropdownSatuan(currentSelected);
            if (!document.getElementById('modalSatuan').classList.contains('hidden')) {
                renderListSatuanModal();
            }
        });

        // Real-time listener koleksi 'masterKategoriAset'
        const qKategori = query(collection(db, "masterKategoriAset"), orderBy("kode", "asc"));
        onSnapshot(qKategori, (snapshot) => {
            dataKategoriList = [];
            snapshot.forEach((docSnap) => {
                dataKategoriList.push({ id: docSnap.id, ...docSnap.data() });
            });
            const currentSelected = document.getElementById('kategoriAset').value;
            updateDropdownKategori(currentSelected);
            updateAutoKodeKategori();
            generateKodeAsetOtomatis();
            if (!document.getElementById('modalKategori').classList.contains('hidden')) {
                renderListKategoriModal();
            }
        });

        onAuthStateChanged(auth, (user) => {
            if (!user) {
                window.location.href = "../index.html";
            }
        });
    </script>
</body>
</html>
