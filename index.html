<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Aplikasi RT-Ku</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts: Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- PWA Manifest -->
    <link rel="manifest" href="manifest.json">
    <style>
        .no-scrollbar::-webkit-scrollbar {
            display: none !important;
            width: 0px !important;
            height: 0px !important;
        }
        .no-scrollbar {
            -ms-overflow-style: none !important;
            scrollbar-width: none !important;
        }
    </style>
</head>
<body class="bg-slate-900 font-['Inter'] flex justify-center items-center h-screen overflow-hidden m-0">

    <!-- 1. SPLASH SCREEN (Tampil Saat Pertama Kali Buka) -->
    <div id="splashScreen" class="absolute inset-0 bg-gradient-to-b from-emerald-600 to-emerald-800 z-50 flex flex-col items-center justify-center text-white transition-opacity duration-700">
        <div class="w-20 h-20 rounded-3xl bg-white shadow-2xl flex items-center justify-center text-emerald-700 text-3xl font-bold mb-4 animate-bounce">
            RT
        </div>
        <h1 class="text-xl font-bold tracking-wider">RT-KU</h1>
        <p class="text-emerald-100 text-xs mt-1">Sistem Layanan Warga RT 05</p>
        <div class="absolute bottom-10 flex items-center space-x-1.5 text-emerald-200 text-[10px]">
            <i class="fa-solid fa-spinner animate-spin"></i>
            <span>Memuat aplikasi...</span>
        </div>
    </div>

    <!-- 2. LOADING SCREEN SAAT TOMBOL MASUK/DAFTAR DIKLIK -->
    <div id="actionLoading" class="absolute inset-0 bg-slate-950/80 backdrop-blur-sm z-50 flex flex-col items-center justify-center text-white transition-all duration-300 opacity-0 pointer-events-none">
        <div class="w-14 h-14 rounded-2xl bg-emerald-600 shadow-2xl flex items-center justify-center text-white text-xl mb-3 animate-pulse">
            <i class="fa-solid fa-house-chimney"></i>
        </div>
        <p id="loadingText" class="text-xs font-medium tracking-wide text-emerald-100">Memproses data...</p>
    </div>

    <!-- Toast Notification Melayang yang Smooth -->
    <div id="toastNotification" class="fixed top-6 left-1/2 transform -translate-x-1/2 bg-slate-900/95 border border-slate-700 text-white px-4 py-2.5 rounded-2xl shadow-2xl text-xs font-medium flex items-center space-x-2 z-50 transition-all duration-300 opacity-0 pointer-events-none translate-y-[-20px]">
        <div class="w-5 h-5 rounded-full bg-emerald-500 text-white flex items-center justify-center text-[10px] shadow">
            <i class="fa-solid fa-check"></i>
        </div>
        <span id="toastText">Berhasil masuk!</span>
    </div>

    <!-- Container HP Frame (Full di HP, berbentuk frame jika di Laptop) -->
    <div class="w-full h-screen sm:max-w-[400px] sm:h-[92vh] sm:max-h-[820px] bg-slate-50 sm:rounded-[35px] shadow-2xl flex flex-col justify-between relative overflow-hidden sm:border-[6px] sm:border-slate-800">
        
        <!-- Header / Top Section -->
        <div class="bg-gradient-to-b from-emerald-600 to-emerald-700 text-white px-6 pt-6 pb-10 sm:rounded-b-[30px] shrink-0 text-center relative">
            <div class="w-12 h-12 rounded-full bg-white flex items-center justify-center shadow-lg mx-auto mb-3">
                <span class="text-emerald-700 font-bold text-base">RT</span>
            </div>
            <h1 id="formTitle" class="text-base font-bold tracking-wide">Selamat Datang di RT-Ku</h1>
            <p id="formSubtitle" class="text-emerald-100 text-[11px] mt-0.5">Silakan masuk menggunakan email Anda</p>
        </div>

        <!-- Main Content Scrollable -->
        <div class="px-6 -mt-5 flex-1 overflow-y-auto no-scrollbar pb-10">
            
            <div class="bg-white rounded-2xl shadow-sm p-5 border border-slate-200/60 mt-2">
                
                <!-- Tab Pilihan Mode (Masuk / Daftar) -->
                <div class="flex bg-slate-100 p-1 rounded-xl mb-5">
                    <button type="button" id="tabLogin" onclick="switchMode('login')" class="flex-1 py-2 text-xs font-semibold rounded-lg bg-white text-emerald-700 shadow-sm transition-all cursor-pointer">Masuk</button>
                    <button type="button" id="tabRegister" onclick="switchMode('register')" class="flex-1 py-2 text-xs font-semibold rounded-lg text-slate-500 transition-all cursor-pointer">Daftar Baru</button>
                </div>

                <!-- Form Auth -->
                <form id="authForm" class="space-y-4">
                    <div id="nameFieldContainer" class="hidden">
                        <label class="block text-xs font-semibold text-slate-700 mb-1">Nama Lengkap</label>
                        <div class="relative">
                            <span class="absolute inset-y-0 left-0 pl-3 flex items-center text-slate-400 text-xs">
                                <i class="fa-solid fa-user"></i>
                            </span>
                            <input type="text" id="fullName" placeholder="Contoh: Budi Santoso" class="w-full pl-9 pr-4 py-2.5 rounded-xl border border-slate-200 text-xs focus:outline-none focus:border-emerald-600 bg-slate-50">
                        </div>
                    </div>

                    <div>
                        <label class="block text-xs font-semibold text-slate-700 mb-1">Alamat Email</label>
                        <div class="relative">
                            <span class="absolute inset-y-0 left-0 pl-3 flex items-center text-slate-400 text-xs">
                                <i class="fa-solid fa-envelope"></i>
                            </span>
                            <input type="email" id="emailInput" required placeholder="nama@email.com" class="w-full pl-9 pr-4 py-2.5 rounded-xl border border-slate-200 text-xs focus:outline-none focus:border-emerald-600 bg-slate-50">
                        </div>
                    </div>

                    <div>
                        <label class="block text-xs font-semibold text-slate-700 mb-1">Kata Sandi (Password)</label>
                        <div class="relative">
                            <span class="absolute inset-y-0 left-0 pl-3 flex items-center text-slate-400 text-xs">
                                <i class="fa-solid fa-lock"></i>
                            </span>
                            <input type="password" id="passwordInput" required placeholder="Minimal 6 karakter" class="w-full pl-9 pr-10 py-2.5 rounded-xl border border-slate-200 text-xs focus:outline-none focus:border-emerald-600 bg-slate-50">
                            
                            <!-- Tombol Toggle Show/Hide Password -->
                            <button type="button" onclick="togglePasswordVisibility()" class="absolute inset-y-0 right-0 pr-3 flex items-center text-slate-400 hover:text-slate-600 cursor-pointer">
                                <i id="togglePasswordIcon" class="fa-solid fa-eye text-xs"></i>
                            </button>
                        </div>
                    </div>

                    <div id="errorMessage" class="text-red-500 text-[11px] text-center hidden"></div>

                    <button type="submit" id="submitBtn" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-semibold py-3 rounded-xl shadow-md shadow-emerald-600/35 transition-all text-xs mt-2 cursor-pointer">
                        Masuk ke Aplikasi
                    </button>
                </form>

            </div>

        </div>

        <!-- Footer / Copyright -->
        <div class="bg-white border-t border-slate-200 py-3 px-6 text-center shrink-0">
            <span class="text-slate-400 text-[10px] font-medium">
                &copy; 2026 Aplikasi RT-Ku. Hak Cipta Dilindungi.
            </span>
        </div>

    </div>

    <!-- Script Utama -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { 
            getAuth, 
            signInWithEmailAndPassword, 
            createUserWithEmailAndPassword, 
            updateProfile,
            onAuthStateChanged
        } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { getFirestore, doc, setDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";
        
        // 1. Pendaftaran Service Worker PWA
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js')
                    .then((reg) => console.log('Service Worker PWA terdaftar:', reg.scope))
                    .catch((err) => console.log('Gagal daftar SW:', err));
            });
        }

        // 2. Konfigurasi Firebase
        const firebaseConfig = {
            apiKey: "AIzaSyBx2AF0YRpOEq--q__dn39NwiNCKXvKutM",
            authDomain: "erte-979ca.firebaseapp.com",
            projectId: "erte-979ca",
            storageBucket: "erte-979ca.firebasestorage.app",
            messagingSenderId: "329513636032",
            appId: "1:329513636032:web:25a10b627b91db2bbb5d25",
            measurementId: "G-VQ7N0NJFKG"
        };
        
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        // Cek Sesi Auth & Hilangkan Splash Screen Awal
        onAuthStateChanged(auth, (user) => {
            const splash = document.getElementById('splashScreen');
            if (user) {
                window.location.href = "home.html";
            } else {
                setTimeout(() => {
                    if (splash) {
                        splash.classList.add('opacity-0', 'pointer-events-none');
                        setTimeout(() => splash.remove(), 700);
                    }
                }, 1200);
            }
        });

        // Fungsi Tampilkan Loading Saat Aksi Tombol
        window.showActionLoading = function(text) {
            const loader = document.getElementById('actionLoading');
            const loadText = document.getElementById('loadingText');
            loadText.innerText = text;
            loader.classList.remove('opacity-0', 'pointer-events-none');
        }

        // Fungsi Toast Notification yang Smooth
        window.showToast = function(message) {
            const toast = document.getElementById('toastNotification');
            const toastText = document.getElementById('toastText');
            toastText.innerText = message;

            toast.classList.remove('opacity-0', 'pointer-events-none', 'translate-y-[-20px]');
            toast.classList.add('opacity-100', 'translate-y-0');

            setTimeout(() => {
                toast.classList.remove('opacity-100', 'translate-y-0');
                toast.classList.add('opacity-0', 'pointer-events-none', 'translate-y-[-20px]');
            }, 1500);
        }

        // 3. Fungsi Toggle Show/Hide Password
        window.togglePasswordVisibility = function() {
            const passwordInput = document.getElementById('passwordInput');
            const toggleIcon = document.getElementById('togglePasswordIcon');
            
            if (passwordInput.type === 'password') {
                passwordInput.type = 'text';
                toggleIcon.className = 'fa-solid fa-eye-slash text-xs';
            } else {
                passwordInput.type = 'password';
                toggleIcon.className = 'fa-solid fa-eye text-xs';
            }
        };

        let isRegisterMode = false;

        window.switchMode = function(mode) {
            const tabLogin = document.getElementById('tabLogin');
            const tabRegister = document.getElementById('tabRegister');
            const nameFieldContainer = document.getElementById('nameFieldContainer');
            const formTitle = document.getElementById('formTitle');
            const formSubtitle = document.getElementById('formSubtitle');
            const submitBtn = document.getElementById('submitBtn');
            const errorMsg = document.getElementById('errorMessage');
            errorMsg.classList.add('hidden');

            if (mode === 'register') {
                isRegisterMode = true;
                tabRegister.className = "flex-1 py-2 text-xs font-semibold rounded-lg bg-white text-emerald-700 shadow-sm transition-all cursor-pointer";
                tabLogin.className = "flex-1 py-2 text-xs font-semibold rounded-lg text-slate-500 transition-all cursor-pointer";
                nameFieldContainer.classList.remove('hidden');
                formTitle.innerText = "Pendaftaran Warga Baru";
                formSubtitle.innerText = "Buat akun baru dengan email Anda";
                submitBtn.innerText = "Daftar Sekarang";
            } else {
                isRegisterMode = false;
                tabLogin.className = "flex-1 py-2 text-xs font-semibold rounded-lg bg-white text-emerald-700 shadow-sm transition-all cursor-pointer";
                tabRegister.className = "flex-1 py-2 text-xs font-semibold rounded-lg text-slate-500 transition-all cursor-pointer";
                nameFieldContainer.classList.add('hidden');
                formTitle.innerText = "Selamat Datang di RT-Ku";
                formSubtitle.innerText = "Silakan masuk menggunakan email Anda";
                submitBtn.innerText = "Masuk ke Aplikasi";
            }
        };

        const authForm = document.getElementById('authForm');
        authForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('emailInput').value;
            const password = document.getElementById('passwordInput').value;
            const fullName = document.getElementById('fullName').value;
            const errorMsg = document.getElementById('errorMessage');
            errorMsg.classList.add('hidden');

            try {
                if (isRegisterMode) {
                    showActionLoading('Mendaftarkan akun baru...');
                    const userCredential = await createUserWithEmailAndPassword(auth, email, password);
                    await updateProfile(userCredential.user, { displayName: fullName });
                    
                    // Simpan data ke Firestore koleksi "users" dengan role default "Warga"
                    await setDoc(doc(db, "users", userCredential.user.uid), {
                        name: fullName,
                        email: email,
                        phone: "",
                        role: "Warga",
                        createdAt: new Date()
                    });

                    showToast('Pendaftaran berhasil!');
                    setTimeout(() => { window.location.href = "home.html"; }, 1000);
                } else {
                    showActionLoading('Memeriksa akun...');
                    await signInWithEmailAndPassword(auth, email, password);
                    
                    showToast('Login berhasil!');
                    setTimeout(() => { window.location.href = "home.html"; }, 1000);
                }
            } catch (error) {
                // Sembunyikan kembali loading jika terjadi error
                document.getElementById('actionLoading').classList.add('opacity-0', 'pointer-events-none');
                
                let pesanError = error.message;
                if (error.code === 'auth/email-already-in-use') {
                    pesanError = "Email ini sudah terdaftar. Silakan langsung masuk.";
                } else if (error.code === 'auth/invalid-credential' || error.code === 'auth/wrong-password' || error.code === 'auth/user-not-found') {
                    pesanError = "Email atau kata sandi salah.";
                } else if (error.code === 'auth/weak-password') {
                    pesanError = "Kata sandi terlalu lemah (minimal 6 karakter).";
                }
                
                errorMsg.innerText = pesanError;
                errorMsg.classList.remove('hidden');
            }
        });
    </script>
</body>
</html>
